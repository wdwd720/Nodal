    TreasuryRiskDecisionPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/TreasuryRiskDecisionRecord" } }
    TreasuryCrossingRuleRequest:
