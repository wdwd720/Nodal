      tags: [advanced]
      summary: Price an order exactly under the schedule in force (nothing is recorded or charged)
      description: >-
        The fee engine itemizes the reference notional, the spread, every explicit fee, the network
        estimate and the effective all-in price, and the disclosure is verified against the
        schedule before it is returned. The reference price is a decimal string in the schedule's
        quote asset. A read: it records, reserves and charges nothing.
      parameters:
        - { in: query, name: schedule_key, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { in: query, name: side, required: true, schema: { $ref: "#/components/schemas/FeeSide" } }
        - { in: query, name: base_quantity, required: true, schema: { $ref: "#/components/schemas/Quantity" } }
        - { in: query, name: base_decimals, required: true, schema: { type: integer, minimum: 0, maximum: 38 } }
        - { in: query, name: reference_price, required: true, schema: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' } }
        - { in: query, name: at, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { in: query, name: trailing_volume_usd, schema: { $ref: "#/components/schemas/USD" } }
        - { in: query, name: has_subscription, schema: { type: boolean } }
        - { in: query, name: strategy_originated, schema: { type: boolean } }
      responses:
        "200":
          description: The verified disclosure the schedule produces
          content: { application/json: { schema: { $ref: "#/components/schemas/FeeQuotePreview" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
