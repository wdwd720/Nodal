        settlement_symbol: { type: string }
        settlement_decimals: { type: integer, minimum: 0, maximum: 18 }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedEquityApplicationPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items, value_domain]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdvancedEquityApplication" } }
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedEquityCorporateActionResult:
      type: object
      required: [action, applications, replayed, value_domain]
      properties:
        action: { $ref: "#/components/schemas/AdvancedEquityCorporateAction" }
        applications: { type: array, items: { $ref: "#/components/schemas/AdvancedEquityApplication" } }
        replayed: { type: boolean, description: True when the action had been applied already and nothing was posted }
        terms_version: { type: integer, description: The terms version a symbol change wrote }
        instrument_status: { type: string, description: The instrument's status after a delisting step }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }

    # >>> advanced:orders schemas (insert this subsystem's schemas directly below; keep the marker)
    #
    # The internal order book. A price is an exact decimal string in the
    # book's quote asset per whole base unit (never a JSON number, never
    # rounded); a quantity is base units of the base asset; an amount of value
    # (a notional, a fee) is base units of the quote asset. Every enum carries
    # x-enum-varnames prefixed Book so its Go constants cannot collide.
    AdvancedBookPrice:
      type: string
      maxLength: 64
      pattern: '^[0-9]+(\.[0-9]+)?$'
      description: An exact decimal price in the book's quote asset per whole base unit
      examples: ["2500.00"]
    AdvancedBookMode:
      type: string
      enum: [PAPER, SANDBOX]
      x-enum-varnames: [BookModePaper, BookModeSandbox]
    AdvancedBookStatus:
      type: string
      enum: [OPEN, HALTED, CLOSED]
      x-enum-varnames: [BookStatusOpen, BookStatusHalted, BookStatusClosed]
    AdvancedBookVenueLabel:
      type: string
      enum: [SIMULATED_INTERNAL_BOOK]
      x-enum-varnames: [BookVenueSimulatedInternalBook]
    AdvancedBookTermsSource:
      type: string
      enum: [CANONICAL, BOOK_SPOT]
      x-enum-varnames: [BookTermsCanonical, BookTermsSpot]
      description: CANONICAL is the instrument's versioned terms; BOOK_SPOT is spot-pair terms stated when the book was opened
    AdvancedBookSide:
      type: string
      enum: [BUY, SELL]
      x-enum-varnames: [BookSideBuy, BookSideSell]
    AdvancedBookOrderType:
      type: string
      enum: [LIMIT, MARKET]
      x-enum-varnames: [BookOrderTypeLimit, BookOrderTypeMarket]
    AdvancedBookTimeInForce:
      type: string
      enum: [GTC, IOC, FOK]
      x-enum-varnames: [BookTimeInForceGTC, BookTimeInForceIOC, BookTimeInForceFOK]
    AdvancedBookSTP:
      type: string
      enum: [CANCEL_TAKER, CANCEL_MAKER, CANCEL_BOTH]
      x-enum-varnames: [BookSTPCancelTaker, BookSTPCancelMaker, BookSTPCancelBoth]
      description: Self-trade prevention when the order takes liquidity; two orders of one account never trade
    AdvancedBookLiquidityIntent:
      type: string
      enum: [TAKE_LIQUIDITY, PROVIDE_LIQUIDITY]
      x-enum-varnames: [BookTakeLiquidity, BookProvideLiquidity]
    AdvancedBookOrderStatus:
      type: string
      enum: [PENDING, OPEN, PARTIALLY_FILLED, FILLED, CANCELLED, REJECTED]
      x-enum-varnames: [BookOrderPending, BookOrderOpen, BookOrderPartiallyFilled, BookOrderFilled, BookOrderCancelled, BookOrderRejected]
    AdvancedBookOrderScope:
      type: string
      enum: [WORKING, ALL]
      x-enum-varnames: [BookOrderScopeWorking, BookOrderScopeAll]
    AdvancedBookLiquidity:
      type: string
      enum: [MAKER, TAKER]
      x-enum-varnames: [BookLiquidityMaker, BookLiquidityTaker]
      description: The role the account's order played in the fill
    AdvancedBookOwnerType:
      type: string
      enum: [CUSTOMER, HOUSE]
      x-enum-varnames: [BookOwnerCustomer, BookOwnerHouse]
    AdvancedBookFeeScheduleRequest:
      type: object
      description: >-
        The explicit fee one side of every fill pays, in the book's quote
        asset: a percentage of the fill's notional, an extra percentage for a
        strategy-originated order, a subscription discount on the percentage
        fee, and a cap in basis points of notional (0 disables it). The
        internal book charges nothing else -- no spread, no fixed or minimum
        fee, no venue pass-through -- and rounds in the customer's favour.
      required: [version, quote_asset_id, quote_decimals, percentage_fee_bps]
      properties:
        version: { type: string, minLength: 1, maxLength: 64 }
        quote_asset_id: { $ref: "#/components/schemas/UUID" }
        quote_decimals: { type: integer, minimum: 0, maximum: 18 }
        percentage_fee_bps: { $ref: "#/components/schemas/BPS" }
        strategy_fee_bps: { $ref: "#/components/schemas/BPS" }
        subscription_discount_bps: { $ref: "#/components/schemas/BPS" }
        max_total_fee_bps: { $ref: "#/components/schemas/BPS" }
    AdvancedBookFeeSchedule:
      type: object
      description: The fee schedule a book prices one side of every fill with, as recorded on the book, and its hash
      required: [version, quote_asset_id, quote_decimals, percentage_fee_bps, strategy_fee_bps, subscription_discount_bps,
                 max_total_fee_bps, hash]
      properties:
        version: { type: string }
        quote_asset_id: { $ref: "#/components/schemas/UUID" }
        quote_decimals: { type: integer, minimum: 0, maximum: 18 }
        percentage_fee_bps: { $ref: "#/components/schemas/BPS" }
        strategy_fee_bps: { $ref: "#/components/schemas/BPS" }
        subscription_discount_bps: { $ref: "#/components/schemas/BPS" }
        max_total_fee_bps: { $ref: "#/components/schemas/BPS" }
        hash: { type: string, description: The schedule's hash, as recorded on the book and on every fill it priced }
    AdvancedBookCrossingRule:
      type: object
      description: >-
        The house-versus-customer crossing rule in force. Version 0 is the
        default, in force until a rule is recorded: a house (principal) book
        never trades with a customer.
      required: [book_id, version, allow_house_customer_crossing, is_default]
      properties:
        book_id: { $ref: "#/components/schemas/UUID" }
        version: { type: integer }
        allow_house_customer_crossing: { type: boolean }
        is_default: { type: boolean, description: True when no rule was ever recorded and the default applies }
        reason: { type: string }
        actor_type: { type: string }
        actor_id: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    AdvancedBook:
      type: object
      description: >-
        One internal book: its instrument and assets, the exact grid it trades
        on, the fee schedules that price every fill, the crossing rule in
        force and its journal cursor.
      required: [id, instrument_id, venue_label, mode, status, instrument_kind, base_asset_id, base_symbol, base_decimals,
                 quote_asset_id, quote_symbol, quote_decimals, price_scale, tick_price, lot_size, min_quantity, max_price,
                 trading_calendar, terms_source, maker_fee, taker_fee, crossing_rule, snapshot_interval, last_command_seq,
                 last_event_seq, last_trade_seq, state_hash, value_domain]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        venue_label: { $ref: "#/components/schemas/AdvancedBookVenueLabel" }
        mode: { $ref: "#/components/schemas/AdvancedBookMode" }
        status: { $ref: "#/components/schemas/AdvancedBookStatus" }
        instrument_kind: { $ref: "#/components/schemas/InstrumentKind" }
        base_asset_id: { $ref: "#/components/schemas/UUID" }
        base_symbol: { type: string }
        base_decimals: { type: integer, minimum: 0, maximum: 18 }
        quote_asset_id: { $ref: "#/components/schemas/UUID" }
        quote_symbol: { type: string }
        quote_decimals: { type: integer, minimum: 0, maximum: 18 }
        price_scale: { type: integer }
        tick_price: { $ref: "#/components/schemas/AdvancedBookPrice" }
        lot_size: { $ref: "#/components/schemas/Quantity" }
        min_quantity: { $ref: "#/components/schemas/Quantity" }
        max_price: { $ref: "#/components/schemas/AdvancedBookPrice" }
        trading_calendar: { type: string }
        terms_source: { $ref: "#/components/schemas/AdvancedBookTermsSource" }
        terms_version: { type: integer, description: The canonical terms version the book was opened on (absent for BOOK_SPOT) }
        maker_fee: { $ref: "#/components/schemas/AdvancedBookFeeSchedule" }
        taker_fee: { $ref: "#/components/schemas/AdvancedBookFeeSchedule" }
        crossing_rule: { $ref: "#/components/schemas/AdvancedBookCrossingRule" }
        snapshot_interval: { type: integer, format: int64 }
        last_command_seq: { type: integer, format: int64 }
        last_event_seq: { type: integer, format: int64 }
        last_trade_seq: { type: integer, format: int64 }
        state_hash: { type: string, description: hex sha256 of the book's state after its last command }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedBookPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items, value_domain]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdvancedBook" } }
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedBookOpenRequest:
      type: object
      description: spot_terms is required for a SPOT_PAIR and refused for every other instrument.
      required: [instrument_id, mode, maker_fee, taker_fee]
      properties:
        instrument_id: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/AdvancedBookMode" }
        spot_terms: { $ref: "#/components/schemas/InstrumentTerms" }
        maker_fee: { $ref: "#/components/schemas/AdvancedBookFeeScheduleRequest" }
        taker_fee: { $ref: "#/components/schemas/AdvancedBookFeeScheduleRequest" }
        snapshot_interval: { type: integer, minimum: 1, maximum: 100000, description: Commands between snapshots (default 64) }
    AdvancedBookStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status: { $ref: "#/components/schemas/AdvancedBookStatus" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdvancedBookCrossingRuleRequest:
      type: object
      required: [allow_house_customer_crossing, reason]
      properties:
        allow_house_customer_crossing: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdvancedBookDepthLevel:
      type: object
      required: [price, price_ticks, quantity, orders]
      properties:
        price: { $ref: "#/components/schemas/AdvancedBookPrice" }
        price_ticks: { type: integer, format: int64 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        orders: { type: integer }
    AdvancedBookDepth:
      type: object
      required: [book_id, instrument_id, status, base_decimals, quote_decimals, bids, asks, last_command_seq, state_hash, value_domain]
      properties:
        book_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        status: { $ref: "#/components/schemas/AdvancedBookStatus" }
        base_decimals: { type: integer, minimum: 0, maximum: 18 }
        quote_decimals: { type: integer, minimum: 0, maximum: 18 }
        bids: { type: array, items: { $ref: "#/components/schemas/AdvancedBookDepthLevel" } }
        asks: { type: array, items: { $ref: "#/components/schemas/AdvancedBookDepthLevel" } }
        last_command_seq: { type: integer, format: int64 }
        state_hash: { type: string }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedBookOrderRequest:
      type: object
      description: >-
        price is the limit price, or a market order's protection price, which
        this book requires; quantity is base units of the base asset.
      required: [account_id, side, order_type, time_in_force, price, quantity]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        side: { $ref: "#/components/schemas/AdvancedBookSide" }
        order_type: { $ref: "#/components/schemas/AdvancedBookOrderType" }
        time_in_force: { $ref: "#/components/schemas/AdvancedBookTimeInForce" }
        price: { $ref: "#/components/schemas/AdvancedBookPrice" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        post_only: { type: boolean }
        reduce_only: { type: boolean }
        stp: { $ref: "#/components/schemas/AdvancedBookSTP" }
        client_order_id: { type: string, minLength: 1, maxLength: 128 }
        mode: { $ref: "#/components/schemas/AdvancedBookMode" }
    AdvancedBookOrder:
      type: object
      required: [id, book_id, instrument_id, venue_label, account_id, side, order_type, time_in_force, stp, liquidity_intent,
                 post_only, reduce_only, strategy_originated, mode, price, price_ticks, quantity, filled_quantity,
                 remaining_quantity, cancelled_quantity, base_decimals, quote_decimals, status, created_at, updated_at, value_domain]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        book_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        venue_label: { $ref: "#/components/schemas/AdvancedBookVenueLabel" }
        account_id: { $ref: "#/components/schemas/UUID" }
        intent_id: { $ref: "#/components/schemas/UUID" }
        client_order_id: { type: string }
        side: { $ref: "#/components/schemas/AdvancedBookSide" }
        order_type: { $ref: "#/components/schemas/AdvancedBookOrderType" }
        time_in_force: { $ref: "#/components/schemas/AdvancedBookTimeInForce" }
        stp: { $ref: "#/components/schemas/AdvancedBookSTP" }
        liquidity_intent: { $ref: "#/components/schemas/AdvancedBookLiquidityIntent" }
        post_only: { type: boolean }
        reduce_only: { type: boolean }
        strategy_originated: { type: boolean }
        mode: { $ref: "#/components/schemas/AdvancedBookMode" }
        price: { $ref: "#/components/schemas/AdvancedBookPrice" }
        price_ticks: { type: integer, format: int64 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        filled_quantity: { $ref: "#/components/schemas/Quantity" }
        remaining_quantity: { $ref: "#/components/schemas/Quantity" }
        cancelled_quantity: { $ref: "#/components/schemas/Quantity" }
        base_symbol: { type: string }
        base_decimals: { type: integer, minimum: 0, maximum: 18 }
        quote_symbol: { type: string }
        quote_decimals: { type: integer, minimum: 0, maximum: 18 }
        status: { $ref: "#/components/schemas/AdvancedBookOrderStatus" }
        reject_reason: { type: string }
        cancel_reason: { type: string }
        reservation_id: { $ref: "#/components/schemas/UUID" }
        accepted_command_seq: { type: integer, format: int64 }
        last_command_seq: { type: integer, format: int64 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedBookOrderPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items, value_domain]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdvancedBookOrder" } }
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedBookFill:
      type: object
      description: >-
        One trade seen from one account's side: the account's own order, side,
        role and fee. The counterparty is named only by its owner type; its
        account is never shown.
      required: [trade_seq, book_id, instrument_id, order_id, side, liquidity, price, price_ticks, quantity, quote_notional, fee,
                 counterparty_owner_type, crossing_rule_version, command_seq, journal_transaction_id, effect_id, evidence_ref,
                 evidence_sha256, executed_at, base_decimals, quote_decimals, value_domain]
      properties:
        trade_seq: { type: integer, format: int64 }
        book_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        order_id: { $ref: "#/components/schemas/UUID" }
        side: { $ref: "#/components/schemas/AdvancedBookSide" }
        liquidity: { $ref: "#/components/schemas/AdvancedBookLiquidity" }
        price: { $ref: "#/components/schemas/AdvancedBookPrice" }
        price_ticks: { type: integer, format: int64 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        quote_notional: { $ref: "#/components/schemas/Quantity" }
        fee: { $ref: "#/components/schemas/Quantity" }
        counterparty_owner_type: { $ref: "#/components/schemas/AdvancedBookOwnerType" }
        crossing_rule_version: { type: integer }
        command_seq: { type: integer, format: int64 }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        executed_at: { $ref: "#/components/schemas/Timestamp" }
        base_symbol: { type: string }
        base_decimals: { type: integer, minimum: 0, maximum: 18 }
        quote_symbol: { type: string }
        quote_decimals: { type: integer, minimum: 0, maximum: 18 }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedBookFillPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items, value_domain]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdvancedBookFill" } }
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedBookCommandResult:
      type: object
      description: >-
        The order after a command, with the fills that command made for it.
        command_seq and state_hash are absent when the command never reached
        the book.
      required: [order, fills, value_domain]
      properties:
        order: { $ref: "#/components/schemas/AdvancedBookOrder" }
        intent_status: { type: string, description: The order's economic intent status after a submission }
        command_seq: { type: integer, format: int64 }
        state_hash: { type: string }
        fills: { type: array, items: { $ref: "#/components/schemas/AdvancedBookFill" } }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedBookOrderCancelRequest:
      type: object
      required: [account_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
    AdvancedBookOrderReplaceRequest:
      type: object
      description: quantity is the new TOTAL quantity in base units, fills included.
      required: [account_id, price, quantity]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        price: { $ref: "#/components/schemas/AdvancedBookPrice" }
        quantity: { $ref: "#/components/schemas/Quantity" }
    AdvancedBookTradeProof:
      type: object
      description: >-
        The audit proof of one trade: the SIM_TRADE journal transaction (which
        the database balances per party), the APPLIED effect that names it,
        the write-once evidence document and its digest, the hashes of the
        fee schedules that priced it, and the book's journal cursor and latest
        snapshot, which the operator's journal verification replays.
      required: [book_id, instrument_id, venue_label, trade_seq, command_seq, event_seq, price, price_ticks, quantity, quote_notional,
                 aggressor_side, maker_order_id, taker_order_id, maker_owner_type, taker_owner_type, maker_fee, taker_fee,
                 maker_schedule_hash, taker_schedule_hash, crossing_rule_version, journal_transaction_id, effect_id, evidence_ref,
                 evidence_sha256, executed_at, base_decimals, quote_decimals, book_last_command_seq, book_state_hash, snapshot_seq,
                 value_domain]
      properties:
        book_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        venue_label: { $ref: "#/components/schemas/AdvancedBookVenueLabel" }
        trade_seq: { type: integer, format: int64 }
        command_seq: { type: integer, format: int64 }
        event_seq: { type: integer, format: int64 }
        price: { $ref: "#/components/schemas/AdvancedBookPrice" }
        price_ticks: { type: integer, format: int64 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        quote_notional: { $ref: "#/components/schemas/Quantity" }
        aggressor_side: { $ref: "#/components/schemas/AdvancedBookSide" }
        maker_order_id: { $ref: "#/components/schemas/UUID" }
        taker_order_id: { $ref: "#/components/schemas/UUID" }
        maker_owner_type: { $ref: "#/components/schemas/AdvancedBookOwnerType" }
        taker_owner_type: { $ref: "#/components/schemas/AdvancedBookOwnerType" }
        maker_fee: { $ref: "#/components/schemas/Quantity" }
        taker_fee: { $ref: "#/components/schemas/Quantity" }
        maker_schedule_hash: { type: string }
        taker_schedule_hash: { type: string }
        crossing_rule_version: { type: integer }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string, description: hex sha256 of the archived canonical evidence document }
        executed_at: { $ref: "#/components/schemas/Timestamp" }
        base_symbol: { type: string }
        base_decimals: { type: integer, minimum: 0, maximum: 18 }
        quote_symbol: { type: string }
        quote_decimals: { type: integer, minimum: 0, maximum: 18 }
        book_last_command_seq: { type: integer, format: int64 }
        book_state_hash: { type: string }
        snapshot_seq: { type: integer, format: int64, description: Command sequence of the book's latest snapshot (0 when none) }
        snapshot_hash: { type: string }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedBookJournalVerification:
      type: object
      description: What replaying the book's journal from the database proved. Every hash is hex sha256.
      required: [book_id, instrument_id, commands, events, trades, genesis_hash, state_hash, full_replay_hash,
                 snapshot_replay_hash, snapshot_seq, orders_checked, verified_at]
      properties:
        book_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        commands: { type: integer, format: int64 }
        events: { type: integer, format: int64 }
        trades: { type: integer, format: int64 }
        genesis_hash: { type: string }
        state_hash: { type: string }
        full_replay_hash: { type: string }
        snapshot_replay_hash: { type: string }
        snapshot_seq: { type: integer, format: int64 }
        orders_checked: { type: integer }
        verified_at: { $ref: "#/components/schemas/Timestamp" }

    # >>> advanced:transfers schemas (insert this subsystem's schemas directly below; keep the marker)
    #
    # The enums carry x-enum-varnames so their Go constants can never collide
    # with another schema's (ALLOW and OPEN already exist unprefixed).
    AdvancedTransferStatus:
      type: string
      enum: [PENDING, COMPLETED, REJECTED, REVERSED]
      x-enum-varnames: [TransferStatusPending, TransferStatusCompleted, TransferStatusRejected, TransferStatusReversed]
      description: PENDING exists only inside the transaction that decides a transfer; a committed transfer is COMPLETED, REJECTED or REVERSED.
    AdvancedTransfer:
      type: object
      description: >-
        One customer-to-customer transfer of simulated value. What a reader
        sees depends on who they are: the sender sees their whole record but
        not the account id behind a handle they paid; a recipient sees a
        transfer once it moved value, without the sender's decision record or
        the reversal reason; an operator holding account:read_any sees
        everything.
      required: [id, intent_id, status, sender_account_id, asset_id, asset_symbol, asset_decimals, quantity, notional_usd,
                 mode, reason_codes, policy_version, policy_hash, created_at, updated_at, value_domain]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        intent_id: { $ref: "#/components/schemas/UUID" }
        status: { $ref: "#/components/schemas/AdvancedTransferStatus" }
        sender_account_id: { $ref: "#/components/schemas/UUID" }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string, description: The handle the sender named the recipient by (absent when named by account id) }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_symbol: { type: string }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        notional_usd: { $ref: "#/components/schemas/USD" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        memo: { type: string, description: Visible to the two parties only and never in a journal or an event or a notification }
        rejection_code: { type: string, description: The primary stable code of a REJECTED transfer }
        reason_codes: { type: array, items: { type: string }, description: Every code that applied to a REJECTED transfer with the primary first }
        policy_version: { type: string }
        policy_hash: { type: string }
        risk_decision_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        decided_at: { $ref: "#/components/schemas/Timestamp" }
        reversal_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        reversal_reason_code: { type: string }
        reversed_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedTransferPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items, value_domain]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdvancedTransfer" } }
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedTransferSendRequest:
      type: object
      description: >-
        Name the recipient by exactly one of recipient_handle or
        recipient_account_id, and the value by exactly one of amount (a plain
        decimal in whole units of the asset, never rounded: more fractional
        digits than the asset has is PRECISION_LOSS) or quantity (exact base
        units). asset_id defaults to the sandbox dollar.
      required: [account_id, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string, maxLength: 33, pattern: '^@?[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$' }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        amount: { type: string, maxLength: 64, pattern: '^[0-9]+(\.[0-9]+)?$' }
        quantity: { $ref: "#/components/schemas/Quantity" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        memo: { type: string, maxLength: 280, description: Printable text without surrounding whitespace; the transfer policy may bound it lower }
    AdvancedTransferReverseRequest:
      type: object
      required: [reason_code, reason]
      properties:
        reason_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$', examples: ["FRAUD_CONFIRMED"] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdvancedTransferHandleRequest:
      type: object
      required: [account_id, handle]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        handle:
          type: string
          maxLength: 33
          pattern: '^@?[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$'
          description: 3..32 characters of a-z, 0-9, '_', '.', '-' starting with a letter or digit; a leading '@' is dropped and the handle is lower-cased
    AdvancedTransferHandle:
      type: object
      required: [id, account_id, handle, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        handle: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    AdvancedTransferRecipientRuleKind:
      type: string
      enum: [ALLOW, BLOCK, CLEAR]
      x-enum-varnames: [TransferRuleAllow, TransferRuleBlock, TransferRuleClear]
    AdvancedTransferRecipientRuleRequest:
      type: object
      description: Name the recipient by exactly one of recipient_handle or recipient_account_id.
      required: [account_id, rule]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string, maxLength: 33, pattern: '^@?[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$' }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        rule: { $ref: "#/components/schemas/AdvancedTransferRecipientRuleKind" }
        reason: { type: string, maxLength: 500 }
    AdvancedTransferRecipientRule:
      type: object
      description: The rule as recorded; the recipient is named the way the request named it.
      required: [account_id, rule]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        rule: { $ref: "#/components/schemas/AdvancedTransferRecipientRuleKind" }
        reason: { type: string }
    AdvancedTransferSenderMode:
      type: string
      enum: [OPEN, ALLOWLIST_ONLY]
      x-enum-varnames: [TransferSenderOpen, TransferSenderAllowlistOnly]
    AdvancedTransferSenderModeRequest:
      type: object
      required: [account_id, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/AdvancedTransferSenderMode" }
    AdvancedTransferSenderModeSetting:
      type: object
      required: [account_id, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/AdvancedTransferSenderMode" }
    AdvancedTransferAssetIdentity:
      type: object
      description: >-
        The clearing identity of one asset: TRANSFER_OUT = TRANSFER_IN = the
        register's COMPLETED quantity, and the customer WALLET change over every
        transfer journal and reversal is zero.
      required: [asset_id, transfer_out, transfer_in, register_completed, wallet_delta]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        transfer_out: { $ref: "#/components/schemas/Quantity" }
        transfer_in: { $ref: "#/components/schemas/Quantity" }
        register_completed: { $ref: "#/components/schemas/Quantity" }
        wallet_delta: { $ref: "#/components/schemas/Quantity" }
    AdvancedTransferDiscrepancy:
      type: object
      required: [code, detail]
      properties:
        code: { type: string }
        transfer_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        detail: { type: string }
    AdvancedTransferReconciliation:
      type: object
      required: [checked_at, transfers, ok, assets, discrepancies, value_domain]
      properties:
        checked_at: { $ref: "#/components/schemas/Timestamp" }
        transfers: { type: integer, description: Transfers in scope whatever their status }
        ok: { type: boolean }
        assets: { type: array, items: { $ref: "#/components/schemas/AdvancedTransferAssetIdentity" } }
        discrepancies: { type: array, items: { $ref: "#/components/schemas/AdvancedTransferDiscrepancy" } }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedFaucetGrantRequest:
      type: object
      description: >-
        The value is exactly one of amount (a plain decimal in whole sandbox
        dollars, never rounded) or quantity (exact base units; the sandbox
        dollar has 6 decimals).
      required: [account_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        amount: { type: string, maxLength: 64, pattern: '^[0-9]+(\.[0-9]+)?$' }
        quantity: { $ref: "#/components/schemas/Quantity" }
    AdvancedFaucetGrant:
      type: object
      required: [id, account_id, asset_id, asset_symbol, asset_decimals, quantity, policy_version, policy_hash, environment,
                 effect_id, journal_transaction_id, granted_at, value_domain]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_symbol: { type: string }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        policy_version: { type: string }
        policy_hash: { type: string }
        environment: { type: string }
        effect_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        granted_at: { $ref: "#/components/schemas/Timestamp" }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedFaucetAllowance:
      type: object
      description: >-
        cap is the faucet policy's per-account limit for the rolling window,
        used is what the account was granted inside it, and remaining is
        cap - used (never below zero), all in base units of the sandbox dollar.
      required: [account_id, asset_id, asset_symbol, asset_decimals, cap, used, remaining, window_ms, policy_version,
                 policy_hash, environment, value_domain]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_symbol: { type: string }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        cap: { $ref: "#/components/schemas/Quantity" }
        used: { $ref: "#/components/schemas/Quantity" }
        remaining: { $ref: "#/components/schemas/Quantity" }
        window_ms: { type: integer, format: int64 }
        policy_version: { type: string }
        policy_hash: { type: string }
        environment: { type: string }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }

