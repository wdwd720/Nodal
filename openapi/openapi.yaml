        approval_version: { type: integer }
        legal_review_ref: { type: string }
        provider_contract_ref: { type: string }
        risk_approval_ref: { type: string }
        security_approval_ref: { type: string }
        approvers: { type: array, items: { type: object, additionalProperties: true } }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    CapabilityGateTransition:
      type: object
      required: [transition_id, from, to, actor_type, actor_id, reason, occurred_at, sandbox]
      properties:
        transition_id: { $ref: "#/components/schemas/UUID" }
        from: { type: string, enum: [DISABLED, PENDING_APPROVAL, APPROVED, ACTIVE, SUSPENDED, REVOKED, EXPIRED, SANDBOX] }
        to: { type: string, enum: [DISABLED, PENDING_APPROVAL, APPROVED, ACTIVE, SUSPENDED, REVOKED, EXPIRED, SANDBOX] }
        actor_type: { type: string, description: "OPERATOR for a person, SYSTEM for a boot-time sandbox activation" }
        actor_id: { type: string }
        reason: { type: string }
        evidence_hash: { type: string, description: "Hex SHA-256 of the evidence references at the time, empty when there were none" }
        occurred_at: { type: string, format: date-time }
        sandbox: { type: boolean, description: "True when the transition entered SANDBOX: never an approval" }
    GateActionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 8 }
        legal_review_ref: { type: string }
        provider_contract_ref: { type: string }
        risk_approval_ref: { type: string }
        security_approval_ref: { type: string }
        evidence_hashes: { type: array, items: { type: string } }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        note: { type: string }
    KillSwitch:
      type: object
      required: [kind, scope_id, active, severity]
      properties:
        kind: { type: string, enum: [GLOBAL_NEW_RISK_KILL, ACCOUNT_FREEZE, AGENT_PAUSE, STRATEGY_VERSION_DISABLE, VENUE_DISABLE, INSTRUMENT_CLOSE_ONLY, INSTRUMENT_HALT, CHAIN_DISABLE_NEW_ACTIONS, PROVIDER_DISABLE_NEW_ACTIONS, FUNDING_DISABLE, WITHDRAWALS_DISABLE, MODEL_DISABLE] }
        scope_id: { type: string }
        active: { type: boolean }
        severity: { type: string, enum: [STANDARD, SEVERE] }
        reason: { type: string }
        activated_at: { $ref: "#/components/schemas/Timestamp" }
        released_at: { $ref: "#/components/schemas/Timestamp" }
    KillSwitchRequest:
      type: object
      required: [kind, action, reason]
      properties:
        kind: { type: string }
        scope_id: { type: string, default: "*" }
        action: { type: string, enum: [activate, release] }
        reason: { type: string, minLength: 8 }
        approval_id: { $ref: "#/components/schemas/UUID", description: "Required to release a SEVERE switch" }
    AdminActionProposal:
      type: object
      required: [kind, target_type, target_id, reason]
      properties:
        kind: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        params: { type: object, additionalProperties: true }
        reason: { type: string, minLength: 8 }
    AdminAction:
      type: object
      required: [id, kind, target_type, target_id, status, requires_dual, proposed_by, proposed_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        params: { type: object, additionalProperties: true }
        params_hash: { type: string }
        reason: { type: string }
        requires_dual: { type: boolean }
        status: { type: string, enum: [PROPOSED, APPROVED, REJECTED, EXECUTED, FAILED, EXPIRED, CANCELLED] }
        proposed_by: { $ref: "#/components/schemas/UUID" }
        proposed_at: { $ref: "#/components/schemas/Timestamp" }
        approved_by: { $ref: "#/components/schemas/UUID" }
        approved_at: { $ref: "#/components/schemas/Timestamp" }
        executed_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    AdminActionPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdminAction" } }
    ReconciliationRecord:
      type: object
      required: [id, kind, mode, scope_type, scope_id, status, material, blocks_new_risk, opened_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string, enum: [EXECUTION, WALLET_BALANCE, FUNDING, LEDGER_INTERNAL, POSITION_LEDGER, SUBMISSION_UNKNOWN] }
        mode: { type: string, enum: [EVENT_DRIVEN, PERIODIC, FULL] }
        scope_type: { type: string }
        scope_id: { type: string }
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        expected: { type: object, additionalProperties: true }
        observed: { type: object, additionalProperties: true }
        difference: { type: object, additionalProperties: true }
        status: { type: string, enum: [OPEN, MATCHED, MISMATCH, INVESTIGATING, RESOLVED_AUTOMATIC, RESOLVED_MANUAL, ESCALATED] }
        material: { type: boolean }
        blocks_new_risk: { type: boolean }
        opened_at: { $ref: "#/components/schemas/Timestamp" }
        resolved_at: { $ref: "#/components/schemas/Timestamp" }
        resolution_reason: { type: string }
        resolution_evidence_ref: { type: string }
        compensating_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
    ReconciliationRecordPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/ReconciliationRecord" } }
    ReconciliationResolution:
      type: object
      required: [reason, evidence_ref]
      properties:
        reason: { type: string, minLength: 8 }
        evidence_ref: { type: string }
        approval_id: { $ref: "#/components/schemas/UUID" }
        compensation:
          type: object
          description: Reason-coded compensating posting; never a balance edit
          properties:
            reason_code: { type: string }
            entries:
              type: array
              items:
                type: object
                required: [account_code, asset, side, quantity]
                properties:
                  account_code: { type: string }
                  asset: { $ref: "#/components/schemas/UUID" }
                  side: { type: string, enum: [DEBIT, CREDIT] }
                  quantity: { $ref: "#/components/schemas/Quantity" }
    StatusChange:
      type: object
      required: [to, reason]
      properties:
        to: { type: string }
        reason: { type: string, minLength: 8 }
        policy_version: { type: string }
    ProviderStatus:
      type: object
      required: [name, role, health, verification]
      properties:
        name: { type: string }
        role: { type: string }
        health: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, DISABLED] }
        verification: { type: string, enum: [CODE_COMPLETE, CONTRACT_TESTED, SANDBOX_VERIFIED, CANARY_VERIFIED, LIVE_VERIFIED, BLOCKED_EXTERNAL] }
        mode: { type: string, enum: [fake, sandbox, live] }
        error_rate_bps: { type: integer }
        p95_ms: { type: integer }
        last_success_at: { $ref: "#/components/schemas/Timestamp" }
        disable_reason: { type: string }
    # ---- profile, terms and account lifecycle ----
    UserProfile:
      type: object
      required: [user_id, locale, time_zone, avatar_seed, created_at]
      description: >-
        Product-level state only. It carries no e-mail address, phone number,
        legal name or date of birth: those are sealed in identity_pii and this
        surface has no route to them.
      properties:
        user_id: { $ref: "#/components/schemas/UUID" }
        display_name: { type: string, maxLength: 64 }
        handle: { type: string, pattern: "^[a-z][a-z0-9_]{2,29}$" }
        locale: { type: string, pattern: "^[a-z]{2}(-[A-Z]{2})?$" }
        time_zone: { type: string, maxLength: 64 }
        avatar_seed:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Sixteen hex characters a client renders an identicon from. Nodal accepts no avatar upload.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ProfileUpdate:
      type: object
      description: Only the fields present are changed. An empty handle clears it.
      properties:
        display_name: { type: string, maxLength: 64 }
        handle: { type: string, maxLength: 30 }
        locale: { type: string, maxLength: 5 }
        time_zone: { type: string, maxLength: 64 }
    Onboarding:
      type: object
      required: [started_at, complete, steps]
      description: >-
        Timestamps, not a state machine. The steps are independent, may be done
        in any order, and cannot be undone (D-053).
      properties:
        started_at: { $ref: "#/components/schemas/Timestamp" }
        complete: { type: boolean }
        completed_at: { $ref: "#/components/schemas/Timestamp" }
        next_step: { type: string, enum: [PROFILE, TERMS] }
        steps:
          type: array
          items:
            type: object
            required: [key, complete]
            properties:
              key: { type: string, enum: [PROFILE, TERMS] }
              complete: { type: boolean }
              completed_at: { $ref: "#/components/schemas/Timestamp" }
    LegalDocument:
      type: object
      required: [document_id, version, title, content_hash, requirement, counsel_review_required, accepted]
      properties:
        document_id:
          type: string
          enum: [TERMS_OF_SERVICE, PRIVACY_POLICY, RISK_DISCLOSURE, CREDITS_TERMS, WITHDRAWAL_DISCLOSURE]
        version: { type: string }
        title: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        requirement:
          type: string
          enum: [ONBOARDING, WITHDRAWAL]
          description: When acceptance is required. A WITHDRAWAL document is not asked for at signup.
        counsel_review_required:
          type: boolean
          description: >-
            The document has not been reviewed by a lawyer. Every document
            currently served is marked, and a surface must say so rather than
            presenting a draft as settled.
        body:
          type: string
          description: >-
            The document text, as Markdown, so a client renders exactly what it
            records acceptance of.
        accepted: { type: boolean }
        accepted_at: { $ref: "#/components/schemas/Timestamp" }
    PublicLegalDocument:
      type: object
      description: A served legal document without any person's acceptance state.
      required: [document_id, version, title, content_hash, requirement, counsel_review_required, body]
      properties:
        document_id: { type: string }
        version: { type: string }
        title: { type: string }
        content_hash: { type: string, description: "sha256 of the exact body bytes; an acceptance records this hash" }
        requirement: { type: string }
        counsel_review_required: { type: boolean }
        body: { type: string }
    TermsState:
      type: object
      required: [documents, outstanding]
      properties:
        documents: { type: array, items: { $ref: "#/components/schemas/LegalDocument" } }
        outstanding:
          type: array
          description: Documents required at onboarding whose current bytes the caller has not accepted.
          items: { type: string }
        acceptances: { type: array, items: { $ref: "#/components/schemas/TermsAcceptance" } }
    TermsAcceptance:
      type: object
      required: [id, document_id, version, content_hash, accepted_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        document_id: { type: string }
        version: { type: string }
        content_hash: { type: string }
        accepted_at: { $ref: "#/components/schemas/Timestamp" }
    TermsAcceptanceRequest:
      type: object
      required: [document_ids]
      properties:
        document_ids:
          type: array
          minItems: 1
          items:
            type: string
            enum: [TERMS_OF_SERVICE, PRIVACY_POLICY, RISK_DISCLOSURE, CREDITS_TERMS, WITHDRAWAL_DISCLOSURE]
    AccountRestriction:
      type: object
      required: [code, message]
      description: >-
        A restriction, written for the person it applies to. The free text an
        operator wrote on a status change is deliberately not here: it was
        written for other operators and appears in the support view instead.
      properties:
        code:
          type: string
          enum: [USER_SUSPENDED, USER_CLOSED, ACCOUNT_RESTRICTED, ACCOUNT_FROZEN, ACCOUNT_CLOSED, CLOSURE_PENDING]
        account_id: { $ref: "#/components/schemas/UUID" }
        message: { type: string }
    ClosureRequest:
      type: object
      required: [id, state, requested_at, cooling_off_until]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        state: { type: string, enum: [PENDING, CANCELLED, REFUSED, EFFECTED] }
        requested_at: { $ref: "#/components/schemas/Timestamp" }
        cooling_off_until: { $ref: "#/components/schemas/Timestamp" }
        effectable:
          type: boolean
          description: The cooling-off period has passed and an operator may now effect the request.
        decided_at: { $ref: "#/components/schemas/Timestamp" }
        decided_reason: { type: string }
    MyAccount:
      type: object
      required: [user_id, user_status, accounts, restrictions, cooling_off_days]
      properties:
        user_id: { $ref: "#/components/schemas/UUID" }
        user_status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }
        restrictions: { type: array, items: { $ref: "#/components/schemas/AccountRestriction" } }
        closure_request: { $ref: "#/components/schemas/ClosureRequest" }
        cooling_off_days:
          type: integer
          description: How long a new closure request would wait before it could be effected.
    CloseAccountRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: Optional. A person leaving does not owe an explanation.
    SecuritySummary:
      type: object
      required: [active_sessions, mfa_present, amr, step_up_max_age_seconds]
      description: >-
        Derived from the session store and the claims of the current session.
        Nothing here is a secret and nothing here is created by asking.
      properties:
        active_sessions: { type: integer }
        mfa_present:
          type: boolean
          description: The identity provider asserted a strong authentication method for the current session.
        amr: { type: array, items: { type: string } }
        last_login_at: { $ref: "#/components/schemas/Timestamp" }
        last_step_up_at: { $ref: "#/components/schemas/Timestamp" }
        step_up_valid_until: { $ref: "#/components/schemas/Timestamp" }
        step_up_max_age_seconds: { type: integer }
        current_session_id: { $ref: "#/components/schemas/UUID" }
    AdminUserView:
      type: object
      required: [user_id, user_status, idp_issuer, idp_subject, email_verified, created_at, accounts, restrictions, active_sessions, audit_stream, verification, closure_blockers]
      description: >-
        Read only. There is no field here an operator can write, and the only
        mutation the support surface offers is deciding a closure request the
        user themselves opened (PART 38).
      properties:
        user_id: { $ref: "#/components/schemas/UUID" }
        user_status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        idp_issuer: { type: string }
        idp_subject: { type: string }
        email_verified:
          type: boolean
          description: >-
            The identity provider asserted a verified address. The address
            itself is sealed and is not reachable from here.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        profile: { $ref: "#/components/schemas/UserProfile" }
        onboarding: { $ref: "#/components/schemas/Onboarding" }
        accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }
        restrictions: { type: array, items: { $ref: "#/components/schemas/AccountRestriction" } }
        closure_request: { $ref: "#/components/schemas/ClosureRequest" }
        acceptances: { type: array, items: { $ref: "#/components/schemas/TermsAcceptance" } }
        active_sessions: { type: integer }
        audit_stream:
          type: string
          description: >-
            Where this user history is recorded, so the support view points at
            the evidence rather than restating it.
        verification:
          type: object
          required: [known]
          description: >-
            The verification level Nodal has established. known is false when
            this deployment wired no resolver, which is reported as not known
            here and never as NONE.
          properties:
            known: { type: boolean }
            level: { type: string }
        closure_blockers:
          type: object
          required: [clear, credit_balance, open_payout_requests, open_native_positions, reasons]
          description: >-
            What this person accounts still hold, across every account they own.
            Effecting a closure is irreversible and puts whatever is left out of
            their reach, so the decision surface carries the three facts the
            refusal exists for and the service refuses EFFECT while any of them
            stands. A blocker means REFUSE with a reason, never a permanent no.
          properties:
            clear:
              type: boolean
              description: Nothing financial stands in the way of effecting.
            credit_balance:
              type: string
              description: >-
                The gross Credit balance in base units, as a decimal string.
                Gross and not spendable a disputed or frozen lot is still value
                that belongs to this person.
            open_payout_requests:
              type: integer
              description: Payout requests that have not reached a terminal state.
            open_native_positions:
              type: integer
              description: Native-asset positions still holding a non-zero quantity.
            reasons:
              type: array
              items: { type: string }
              description: >-
                One sentence per blocker, in a fixed order, written for the
                operator deciding and for the person who will read the refusal.
    ClosureDecision:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [CANCEL, REFUSE, EFFECT] }
        reason: { type: string, minLength: 8 }
    NotificationKind:
      type: string
      description: >-
        What a notification is about. The list is the product vocabulary; the
        nine names migration 00640 declared and nothing produces are not
        accepted here.
      enum: [CREDIT_PURCHASE_CAPTURED, CREDIT_PURCHASE_REVERSED, NATIVE_TRADE_FILLED, NATIVE_MARKET_PAUSED,
             PAYOUT_ACCEPTED, PAYOUT_SETTLED, PAYOUT_FAILED, PAYOUT_NEEDS_REVIEW, VERIFICATION_UPDATED,
             ACCOUNT_RESTRICTED, SECURITY_NEW_SESSION, AGENT_PAUSED, SYSTEM]
    Notification:
      type: object
      required: [id, kind, severity, title, body, occurred_at, sandbox]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        severity: { type: string, enum: [INFO, WARN, CRITICAL] }
        title: { type: string }
        body: { type: string }
        account_id: { type: [string, "null"], format: uuid }
        resource_type: { type: string }
        resource_id: { type: string }
        data:
          type: object
          additionalProperties: true
          description: Identifiers and state names only; never a balance. Canonical figures come from REST.
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        read_at: { type: [string, "null"], format: date-time }
        sandbox:
          type: boolean
          description: True when this notification was produced on a sandbox tier and describes nothing of real value (ADR-0023).
    NotificationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        next_cursor: { type: [string, "null"] }
    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }
    MarkedRead:
      type: object
      required: [updated]
      properties:
        updated: { type: integer, minimum: 0 }
    NotificationPreference:
      type: object
      required: [kind, channel, enabled, enforced]
      properties:
        kind: { $ref: "#/components/schemas/NotificationKind" }
        channel:
          type: string
          enum: [IN_APP]
          description: The only delivery channel that exists. No e-mail, SMS or push provider is configured anywhere in this system.
        enabled: { type: boolean }
        enforced:
          type: boolean
          description: >-
            False where the kind cannot be switched off -- a new sign-in, an
            account restriction, a reversed purchase, a failed payout, a system
            message. The stored answer is kept and ignored, and a settings page
            should show the switch as fixed rather than one that does nothing.
    NotificationPreferences:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NotificationPreference" } }
    NotificationPreferencesUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [kind, enabled]
            properties:
              kind: { $ref: "#/components/schemas/NotificationKind" }
              enabled: { type: boolean }
    MeAuditEntry:
      type: object
      required: [id, source, action, occurred_at]
      properties:
        id: { type: string }
        source:
          type: string
          enum: [SECURITY, ACCOUNT]
          description: SECURITY is the sign-in and session trail; ACCOUNT is what was done to the caller's own accounts.
        action: { type: string }
        severity: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        actor_type:
          type: string
          description: Who acted, by category. The operator's identity is never exposed to a customer.
        ip: { type: string }
        user_agent: { type: string }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
    MeAuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MeAuditEntry" } }
        next_cursor: { type: [string, "null"] }
    # ---- agents ----
    AuthorityLevel:
      type: object
      description: >-
        One rung of the authority ladder, rendered from the matrix the code
        enforces rather than written out beside it. Disabled levels are returned
        rather than hidden, with the capability each would need.
      required: [level, name, summary, enabled]
      properties:
        level: { type: integer, minimum: 0, maximum: 6 }
        name:
          type: string
          enum: [RESEARCH_ONLY, RECOMMENDATION, PREPARE_TRANSACTION, USER_APPROVED_RULE,
                 BOUNDED_DISCRETION, AUTONOMOUS_SELECTION, AUTONOMOUS_PORTFOLIO]
        summary: { type: string }
        enabled: { type: boolean }
        required_capability: { type: string }
    AgentSchedule:
      type: object
      description: How often the agent may evaluate. MANUAL carries no interval.
      required: [kind]
      properties:
        kind: { type: string, enum: [MANUAL, INTERVAL] }
        interval_minutes: { type: integer, minimum: 5, maximum: 10080 }
    AgentLimits:
      type: object
      description: >-
        The bounds the owner granted. Every Credit figure is an exact integer
        string of base units; none of them is a currency amount and none is ever
        a floating-point number. The budget is a ceiling on Credits at risk, not
        a reservation - no Credits move when an agent is created.
      required: [budget_credits, per_trade_cap_credits, daily_loss_stop_credits,
                 max_position_share_bps, allowed_asset_ids, schedule]
      properties:
        budget_credits: { $ref: "#/components/schemas/Quantity" }
        per_trade_cap_credits: { $ref: "#/components/schemas/Quantity" }
        daily_loss_stop_credits: { $ref: "#/components/schemas/Quantity" }
        max_position_share_bps: { $ref: "#/components/schemas/BPS" }
        allowed_asset_ids:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/UUID" }
        schedule: { $ref: "#/components/schemas/AgentSchedule" }
    AgentRuntime:
      type: object
      description: >-
        What is actually evaluating and executing, derived from agent runs and
        from which worker processes this deployment runs. It is not the agent's
        lifecycle state: an agent can be enabled, correct and evaluated by
        nothing at all, and NOT_DEPLOYED says exactly that.
      required: [evaluator, executor, detail]
      properties:
        evaluator: { type: string, enum: [NOT_DEPLOYED, IDLE, RUNNING] }
        executor: { type: string, enum: [NOT_DEPLOYED, IDLE, RUNNING] }
        last_heartbeat: { $ref: "#/components/schemas/Timestamp" }
        detail: { type: string }
    AgentBudget:
      type: object
      description: >-
        granted is the ceiling; used is derived from the intents this agent's
        runs created that reached a state where value is committed. source names
        where used came from, so a zero is never mistaken for a measurement that
        was not made.
      required: [granted_credits, used_credits, source]
      properties:
        granted_credits: { $ref: "#/components/schemas/Quantity" }
        used_credits: { $ref: "#/components/schemas/Quantity" }
        source: { type: string, enum: [NO_RUNS_RECORDED, NO_INTENTS_CREATED, COMMITTED_INTENTS] }
    AgentPause:
      type: object
      required: [reason_code, reason, paused_by_actor_type, paused_at]
      properties:
        reason_code: { type: string }
        reason: { type: string }
        paused_by_actor_type: { type: string, enum: [USER, OPERATOR, SYSTEM] }
        paused_at: { $ref: "#/components/schemas/Timestamp" }
        open_orders_policy: { type: string, enum: [LEAVE, CANCEL_CANCELABLE] }
    Agent:
      type: object
      required: [id, account_id, strategy_id, strategy_version_id, name, stage, state, status,
                 authority, limits, budget, runtime, archived, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        strategy_id: { $ref: "#/components/schemas/UUID" }
        strategy_version_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        stage:
          type: string
          description: The furthest rung of the promotion ladder this agent has reached.
          enum: [DRAFT, COMPILED, VALIDATED, BACKTEST_ELIGIBLE, SHADOW, CANARY, LIMITED, LIVE]
        state:
          type: string
          enum: [DRAFT, COMPILED, VALIDATED, BACKTEST_ELIGIBLE, SHADOW, CANARY, LIMITED, LIVE,
                 PAUSED, FAILED, REVOKED, SUPERSEDED]
        status:
          type: string
          description: >-
            The product's own word for the state, which is what a person is
            actually asking. STOPPED means created and never enabled; ENABLED
            means the owner granted it the right to be evaluated, which is not
            the same as something evaluating it - read runtime for that.
          enum: [STOPPED, ENABLED, PAUSED, DISABLED, FAILED]
        mode: { type: string, enum: [BACKTEST, PAPER, SHADOW, CANARY, LIMITED, LIVE] }
        authority: { $ref: "#/components/schemas/AuthorityLevel" }
        limits: { $ref: "#/components/schemas/AgentLimits" }
        budget: { $ref: "#/components/schemas/AgentBudget" }
        runtime: { $ref: "#/components/schemas/AgentRuntime" }
        pause: { $ref: "#/components/schemas/AgentPause" }
        runs_total: { type: integer }
        last_run_at: { $ref: "#/components/schemas/Timestamp" }
        last_run_status: { type: string }
        archived: { type: boolean }
        granted_by_user_id: { $ref: "#/components/schemas/UUID" }
        granted_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AgentPage:
      type: object
      required: [items, authority_levels]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
        authority_levels:
          type: array
          description: Every declared level and whether this build permits it.
          items: { $ref: "#/components/schemas/AuthorityLevel" }
        next_cursor: { type: string }
    CreateAgentRequest:
      type: object
      required: [account_id, strategy_id, strategy_version_id, name, authority_level, limits]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        strategy_id: { $ref: "#/components/schemas/UUID" }
        strategy_version_id:
          $ref: "#/components/schemas/UUID"
        name: { type: string, minLength: 1, maxLength: 120 }
        authority_level:
          type: integer
          minimum: 0
          maximum: 6
          description: >-
            0 to 3 are the product. 4, 5 and 6 are declared, disabled by policy,
            and refused with the capability each would need.
        limits: { $ref: "#/components/schemas/AgentLimits" }
    AgentActionRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    StrategyVersion:
      type: object
      required: [id, version, status, ir_hash, effect_set, human_readable]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        version: { type: integer }
        status: { type: string, enum: [COMPILED, ACCEPTED, REJECTED, SUPERSEDED, REVOKED] }
        ir_hash: { type: string }
        effect_set:
          type: array
          items: { type: string }
        human_readable:
          type: string
          description: The compiled strategy in words, which is what a person reviews before approving it.
        ir:
          description: The typed intermediate representation itself.
          type: object
          additionalProperties: true
        built_at: { $ref: "#/components/schemas/Timestamp" }
    Strategy:
      type: object
      required: [id, account_id, name, description, source_kind, status, compiler_configured, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: string }
        source_kind: { type: string, enum: [NATURAL_LANGUAGE, TYPESCRIPT_SDK, CLONE] }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        compiler_configured:
          type: boolean
          description: >-
            Whether this deployment can compile at all. False means a compile
            attempt will be recorded with COMPILER_UNAVAILABLE and produce no IR.
        current_version: { $ref: "#/components/schemas/StrategyVersion" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    StrategyPage:
      type: object
      required: [items, compiler_configured]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Strategy" }
        compiler_configured: { type: boolean }
        next_cursor: { type: string }
    CreateStrategyRequest:
      type: object
      required: [account_id, name, description]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 8000 }
        constraints:
          type: object
          additionalProperties: true
          description: Optional structured bounds stated up front, recorded with the description.
    CompileResult:
      type: object
      required: [strategy_id, attempt_id, attempt_no, outcome, detail]
      properties:
        strategy_id: { $ref: "#/components/schemas/UUID" }
        attempt_id: { $ref: "#/components/schemas/UUID" }
        attempt_no: { type: integer }
        outcome:
          type: string
          enum: [SUCCESS, REJECTED, NEEDS_CLARIFICATION, MODEL_UNAVAILABLE, TIMEOUT]
        failure_codes:
          type: array
          description: >-
            Machine-readable reasons. COMPILER_UNAVAILABLE means this deployment
            has no compiler backend configured, so nothing was attempted and
            nothing was inferred.
          items: { type: string }
        clarifications:
          type: array
          description: What the compiler could not decide. It never guesses.
          items: { type: string }
        detail: { type: string }
        version: { $ref: "#/components/schemas/StrategyVersion" }
    # ---- native markets: discovery, charts, portfolio, activity (M) ----
    NativeMarketSummary:
      type: object
      description: >-
        One market as the markets page and the trade screen see it. Every price is
        an exact integer at price_scale and every quantity is base units; nothing
        here is a float and nothing is a display string.


        It carries no account identity, because the markets list that returns it
        is unauthenticated: an identifier on a public page is both readable and
        enumerable by anybody. The creator is a field of NativeMarketDetail,
        which only a signed-in caller can reach (D-110).
      required:
        [market_id, asset_id, credit_asset_id, name, symbol, market_status, asset_status,
         last_price, price_scale, asset_decimals, virtual_credit_reserve,
         initial_asset_reserve, real_credit_reserve, asset_reserve, liquidity_credits,
         circulating_supply, max_supply, credit_volume_24h, trades_24h,
         platform_fee_bps, creator_fee_bps, demo, created_at]
      properties:
        market_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        credit_asset_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        symbol: { type: string }
        description: { type: string }
        image_url: { type: string }
        market_status: { type: string, enum: [PENDING, ACTIVE, CLOSE_ONLY, HALTED, FROZEN, DELISTED] }
        asset_status: { type: string, enum: [DRAFT, PENDING_REVIEW, ACTIVE, CLOSE_ONLY, HALTED, DELISTED, REJECTED] }
        moderation_state: { type: string, enum: [PENDING, APPROVED, REJECTED, FLAGGED] }
        last_price:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: The MARGINAL price -- what the next base unit costs -- at price_scale.
        price_scale: { type: integer, description: Decimal places every price here carries }
        reference_price_24h: { $ref: "#/components/schemas/Quantity" }
        change_24h_bps:
          type: integer
          format: int64
          description: Signed move over the last 24 hours. Meaningless unless has_24h_change.
        has_24h_change:
          type: boolean
          description: >-
            False when the market has not traded in the window, which is a
            different fact from having moved nothing.
        credit_volume_24h: { $ref: "#/components/schemas/Quantity" }
        trades_24h: { type: integer, format: int64 }
        virtual_credit_reserve: { $ref: "#/components/schemas/Quantity" }
        initial_asset_reserve: { $ref: "#/components/schemas/Quantity" }
        real_credit_reserve:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: R -- the only Credits in this pool that could ever be paid out.
        asset_reserve: { $ref: "#/components/schemas/Quantity" }
        liquidity_credits:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: V + R, the depth the curve prices against.
        circulating_supply: { $ref: "#/components/schemas/Quantity" }
        max_supply: { $ref: "#/components/schemas/Quantity" }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        platform_fee_bps: { $ref: "#/components/schemas/BPS" }
        creator_fee_bps: { $ref: "#/components/schemas/BPS" }
        state_version: { type: integer, format: int64 }
        demo:
          type: boolean
          description: >-
            This object was created by the sandbox demo seeder. It exists only on a
            sandbox tier and represents nothing.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        activated_at: { $ref: "#/components/schemas/Timestamp" }

    NativeMarketPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [markets, sort, stable]
          properties:
            markets: { type: array, items: { $ref: "#/components/schemas/NativeMarketSummary" } }
            sort: { type: string, enum: [NEWEST, VOLUME_24H, CHANGE_24H, LIQUIDITY, PRICE] }
            stable:
              type: boolean
              description: >-
                Whether paging this ordering sees every market exactly once. Only
                NEWEST does; the others rank by figures that move when somebody
                trades.

    MarketSafetyLimits:
      type: object
      description: >-
        The limits in force on this market right now (product goal section 47), from
        two documents: the market-safety policy, which is about the venue, and the
        risk kernel's GLOBAL policy, which is about an account.
      required: [safety_policy_version]
      properties:
        safety_policy_version: { type: string }
        max_price_impact_bps: { $ref: "#/components/schemas/BPS" }
        max_slippage_bps: { $ref: "#/components/schemas/BPS" }
        circuit_breaker_move_bps: { type: integer, format: int64 }
        circuit_breaker_window_seconds: { type: integer }
        min_opening_liquidity_credits: { $ref: "#/components/schemas/Quantity" }
        creator_may_buy_own_asset: { type: boolean }
        risk_policy_version: { type: string }
        max_native_market_concentration_bps: { $ref: "#/components/schemas/BPS" }
        max_creator_concentration_bps: { $ref: "#/components/schemas/BPS" }

    NativeMarketDetail:
      type: object
      required: [market, limits_in_force]
      properties:
        market: { $ref: "#/components/schemas/NativeMarketSummary" }
        limits_in_force: { $ref: "#/components/schemas/MarketSafetyLimits" }
        creator_account_id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: >-
            The creator's account id, which is the handle placeholder. A display
            name belongs to the profile domain and is joined later; inventing one
            here would be a second source for it. It is on the DETAIL response
            rather than on the summary because the summary is served
            unauthenticated by the markets list (D-110).
        top_holders:
          type: array
          description: >-
            Holder concentration, which is the number a buyer most needs to see.
            It names nobody; see NativeAssetHolder.
          items: { $ref: "#/components/schemas/NativeAssetHolder" }

    NativeAssetHolder:
      type: object
      description: >-
        One place in an asset's holder concentration. It says how much and how
        large a share, and it does not say whose: `top_holders` used to render an
        account id to any signed-in caller, which made every market's largest
        positions readable by account and watchable trade by trade. The caller's
        own row is marked `is_you`, which tells them nothing they did not send.
        A named holder list is surveillance and belongs behind
        `native_market:surveil` on an operator route (D-111).
      required: [rank, quantity, share_bps]
      properties:
        rank:
          type: integer
          description: >-
            1 is the largest holder of this asset. The rank is over every holder,
            not over the returned page, so rank 10 on a page of ten means there
            are more.
        quantity:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: Base units, at the ASSET's decimals.
        share_bps:
          allOf: [{ $ref: "#/components/schemas/BPS" }]
          description: >-
            This holding as a share of every unit accounts hold, truncated. The
            denominator is the sum of customer balances rather than the
            circulating supply, because units still in the pool are held by
            nobody and a creator's allocation is minted outside the curve, so a
            share of circulating supply can exceed 100%. This one cannot.
        is_you:
          type: boolean
          description: >-
            This row is the calling account's own holding. Present only where the
            request named an account the caller owns.

    NativeCandle:
      type: object
      required: [open_time, open, high, low, close, credit_volume, asset_volume, trades]
      properties:
        open_time: { $ref: "#/components/schemas/Timestamp" }
        open: { $ref: "#/components/schemas/Quantity" }
        high: { $ref: "#/components/schemas/Quantity" }
        low: { $ref: "#/components/schemas/Quantity" }
        close: { $ref: "#/components/schemas/Quantity" }
        credit_volume: { $ref: "#/components/schemas/Quantity" }
        asset_volume: { $ref: "#/components/schemas/Quantity" }
        trades: { type: integer, format: int64 }

    NativeCandlePage:
      type: object
      required: [market_id, interval, from, to, price_scale, asset_decimals, candles]
      properties:
        market_id: { $ref: "#/components/schemas/UUID" }
        interval: { type: string, enum: ["1m", "5m", "15m", "1h", "1d"] }
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        price_scale: { type: integer }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        candles:
          type: array
          description: Oldest first. A bucket with no trades is absent, never filled forward.
          items: { $ref: "#/components/schemas/NativeCandle" }

    NativeTradePrint:
      type: object
      description: One public print. It carries no account identity, by design.
      required: [seq, side, effective_price, spot_price_after, credit_volume, asset_volume, printed_at]
      properties:
        seq: { type: integer, format: int64 }
        side: { type: string, enum: [BUY, SELL] }
        effective_price: { $ref: "#/components/schemas/Quantity" }
        spot_price_before: { $ref: "#/components/schemas/Quantity" }
        spot_price_after: { $ref: "#/components/schemas/Quantity" }
        credit_volume: { $ref: "#/components/schemas/Quantity" }
        asset_volume: { $ref: "#/components/schemas/Quantity" }
        printed_at: { $ref: "#/components/schemas/Timestamp" }

    NativeTradePage:
      type: object
      required: [market_id, price_scale, asset_decimals, trades]
      properties:
        market_id: { $ref: "#/components/schemas/UUID" }
        price_scale: { type: integer }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        trades: { type: array, items: { $ref: "#/components/schemas/NativeTradePrint" } }

    SignedQuantity:
      type: string
      pattern: '^-?[0-9]+$'
      description: >-
        An exact base-unit amount that may be negative. A loss is a real outcome,
        so P&L is signed where a balance is not.

    ValueTemperature:
      type: string
      enum: [ECONOMY, REAL, SIMULATED]
      description: >-
        What KIND of value an amount is (product goal section 46). ECONOMY is
        closed-loop Nodal Credits and native assets; REAL is money at a payment
        provider; SIMULATED is a sandbox tier or a demo object, where nothing moves
        anywhere. The three are never synonyms and are never rendered as one number.

    PortfolioPosition:
      type: object
      description: >-
        One native position. quantity, cost_basis_credits, realized_pnl_credits and
        fees_paid_credits are the read model migration 00772 maintains from the
        fills; market_value_credits and unrealized_pnl_credits are computed at
        as_of from the market's marginal price.
      required:
        [asset_id, symbol, quantity, cost_basis_credits, realized_pnl_credits,
         fees_paid_credits, market_value_credits, unrealized_pnl_credits, total_pnl_credits,
         price_scale, asset_decimals, temperature]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        market_id: { $ref: "#/components/schemas/UUID" }
        symbol: { type: string }
        name: { type: string }
        market_status: { type: string, enum: [PENDING, ACTIVE, CLOSE_ONLY, HALTED, FROZEN, DELISTED] }
        quantity: { $ref: "#/components/schemas/Quantity" }
        cost_basis_credits: { $ref: "#/components/schemas/Quantity" }
        average_cost_credits:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: Cost of one base unit at price_scale. Absent on a closed position.
        spot_price: { $ref: "#/components/schemas/Quantity" }
        market_value_credits: { $ref: "#/components/schemas/Quantity" }
        realized_pnl_credits: { $ref: "#/components/schemas/SignedQuantity" }
        unrealized_pnl_credits: { $ref: "#/components/schemas/SignedQuantity" }
        total_pnl_credits: { $ref: "#/components/schemas/SignedQuantity" }
        fees_paid_credits: { $ref: "#/components/schemas/Quantity" }
        units_bought_total: { $ref: "#/components/schemas/Quantity" }
        units_sold_total: { $ref: "#/components/schemas/Quantity" }
        allocation_units:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: Units granted to the creator at the mint, at zero cost.
        fill_count: { type: integer, format: int64 }
        price_scale: { type: integer }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        temperature: { $ref: "#/components/schemas/ValueTemperature" }
        demo: { type: boolean }
        first_acquired_at: { $ref: "#/components/schemas/Timestamp" }
        last_trade_at: { $ref: "#/components/schemas/Timestamp" }

    PortfolioTotals:
      type: object
      required:
        [cost_basis_credits, market_value_credits, unrealized_pnl_credits,
         realized_pnl_credits, total_pnl_credits, fees_paid_credits,
         position_count, open_position_count]
      properties:
        cost_basis_credits: { $ref: "#/components/schemas/Quantity" }
        market_value_credits: { $ref: "#/components/schemas/Quantity" }
        unrealized_pnl_credits: { $ref: "#/components/schemas/SignedQuantity" }
        realized_pnl_credits: { $ref: "#/components/schemas/SignedQuantity" }
        total_pnl_credits: { $ref: "#/components/schemas/SignedQuantity" }
        fees_paid_credits: { $ref: "#/components/schemas/Quantity" }
        position_count: { type: integer }
        open_position_count: { type: integer }

    Portfolio:
      type: object
      required: [account_id, as_of, temperature, credits, positions, totals]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        as_of:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: >-
            The instant every mark-to-market figure here was computed at. A number
            on a screen that does not say when it was true is a number nobody can
            act on.
        temperature:
          allOf: [{ $ref: "#/components/schemas/ValueTemperature" }]
          description: The temperature of this deployment's Credits as a whole.
        credits: { $ref: "#/components/schemas/CreditBalance" }
        positions: { type: array, items: { $ref: "#/components/schemas/PortfolioPosition" } }
        totals: { $ref: "#/components/schemas/PortfolioTotals" }

    ActivityFeedKind:
      type: string
      enum:
        [CREDIT_PURCHASE, CREDIT_REVERSAL, NATIVE_TRADE, NATIVE_ASSET_CREATED,
         PAYOUT_REQUESTED, PAYOUT_STATE_CHANGED, ADMIN_ADJUSTMENT,
         VERIFICATION_UPDATED, PAYOUT_DESTINATION_ADDED, PAYOUT_DESTINATION_DISABLED,
         TERMS_ACCEPTED, ACCOUNT_CLOSURE_REQUESTED, ACCOUNT_CLOSURE_DECIDED,
         AGENT_CREATED, AGENT_PAUSED, AGENT_RESUMED, AGENT_DISABLED,
         NATIVE_MARKET_PAUSED]
      description: >-
        The closed set of activity kinds. A domain joins the feed by adding a
        Source and a summary template in internal/activity; see that package's
        doc.go for the extension point.

    ActivityAmount:
      type: object
      required: [unit, value, temperature]
      properties:
        unit:
          type: string
          enum: [CREDITS, MONEY_MINOR, ASSET_UNITS]
          description: >-
            How to read `value`. CREDITS is Credit base units, MONEY_MINOR is minor
            units of `currency`, ASSET_UNITS is base units of `symbol`.
        value: { $ref: "#/components/schemas/SignedQuantity" }
        currency: { type: string }
        symbol: { type: string }
        origin: { $ref: "#/components/schemas/CreditOrigin" }
        temperature: { $ref: "#/components/schemas/ValueTemperature" }

    ActivityFeedItem:
      type: object
      required: [id, kind, occurred_at, summary, reference, amounts, simulated]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ActivityFeedKind" }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        summary:
          type: string
          description: Built on the server from a fixed template per kind, never from user text.
        status: { type: string }
        amounts: { type: array, items: { $ref: "#/components/schemas/ActivityAmount" } }
        reference:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        simulated: { type: boolean }

    ActivityFeedPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/ActivityFeedItem" } }
    # --- verification, eligibility and the conversion request ------------
    VerificationState:
      type: string
      description: >-
        The financial verification state machine of §20. UNVERIFIED is §20's
        NOT_STARTED under the name the schema already used. Nothing reaches
        VERIFIED except through a provider session that decided so.
      enum: [UNVERIFIED, REQUIRED, STARTED, PENDING, NEEDS_INFORMATION,
             VERIFIED, REJECTED, EXPIRED, RESTRICTED, SUSPENDED]
    VerificationLevel:
      type: string
      description: >-
        How thoroughly the person behind an account has been identified.
        NODAL_IDENTITY is a verified e-mail address and says nothing about who
        they are or whether they may receive money; PAYOUT_KYC and ENHANCED are
        a provider's decision plus the sub-checks that justify it.
      enum: [NONE, NODAL_IDENTITY, PAYOUT_KYC, ENHANCED]
    VerificationSessionStatus:
      type: string
      description: >-
        The provider-abstract status union of PROVIDER_BOUNDARY §3, derived from
        what Persona, Veriff, Sumsub and Stripe Identity each report so that no
        one vendor's vocabulary becomes the schema's.
      enum: [CREATED, PENDING_USER_ACTION, PROCESSING, REQUIRES_INPUT,
             MANUAL_REVIEW, APPROVED, DECLINED, CANCELLED, EXPIRED]
    VerificationCheckKind:
      type: string
      description: The five things §21 says must each be able to refuse on their own.
      enum: [IDENTITY_DOCUMENT, AGE, JURISDICTION, SANCTIONS, PEP]
    VerificationOutcome:
      type: string
      description: >-
        One sub-check's answer. UNKNOWN is not a pass and not a fail: a provider
        that has not screened somebody has not cleared them either.
      enum: [PASS, FAIL, NEEDS_INFORMATION, UNKNOWN, NOT_APPLICABLE]
    VerificationCheck:
      type: object
      required: [kind, outcome, provider, rules_version, sandbox, recorded_at]
      description: >-
        One sub-check, its answer, who produced it and under which rule version.
        `detail` is a safe reason code and never a document, a government
        identifier or a date of birth.
      properties:
        kind: { $ref: "#/components/schemas/VerificationCheckKind" }
        outcome: { $ref: "#/components/schemas/VerificationOutcome" }
        provider: { type: string }
        provider_ref: { type: string }
        rules_version: { type: string }
        detail: { type: string }
        sandbox:
          type: boolean
          description: A rehearsal answer. A database CHECK refuses one in PROD.
        recorded_at: { $ref: "#/components/schemas/Timestamp" }
    VerificationRequirement:
      type: object
      required: [code, detail, action]
      description: One thing standing between a person and a level, with what they can do about it.
      properties:
        code:
          type: string
          description: A check kind, or VERIFICATION_SESSION / JURISDICTION / PROVIDER / OPERATOR_REVIEW / VERIFICATION_EXPIRED.
        detail: { type: string }
        action:
          type: string
          enum: [START_VERIFICATION, CONTINUE_VERIFICATION, PROVIDE_INFORMATION,
                 REVERIFY, CONTACT_SUPPORT, WAIT, NONE]
    VerificationSession:
      type: object
      required: [session_id, status, purpose, provider, sandbox, created_at]
      properties:
        session_id: { $ref: "#/components/schemas/UUID" }
        status: { $ref: "#/components/schemas/VerificationSessionStatus" }
        purpose: { type: string, enum: [PAYOUT_KYC, ENHANCED] }
        provider: { type: string }
        provider_ref: { type: string }
        jurisdiction_country: { type: string }
        jurisdiction_region: { type: string }
        rules_version: { type: string }
        failure_reason: { type: string }
        sandbox: { type: boolean }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    VerificationProfile:
      type: object
      required: [account_id, state, level, jurisdiction_supported, minimum_age,
                 age_verified, sanctions_state, sandbox, rules_version, payout_ready]
      description: >-
        The §24 profile area. It says what has been established, what has not,
        and what to do next. It carries no personal data.
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        state: { $ref: "#/components/schemas/VerificationState" }
        level: { $ref: "#/components/schemas/VerificationLevel" }
        payout_ready:
          type: boolean
          description: >-
            Whether verification, by itself, no longer stands between this
            person and a withdrawal. It says nothing about whether a withdrawal
            is possible; see /me/eligibility for that.
        jurisdiction_country: { type: string }
        jurisdiction_region: { type: string }
        jurisdiction_supported: { type: boolean }
        jurisdiction_refusals: { type: array, items: { type: string } }
        minimum_age:
          type: integer
          description: The age threshold this jurisdiction is judged against, from the versioned rule table.
        age_verified: { type: boolean }
        sanctions_state: { type: string, enum: [UNKNOWN, CLEAR, HIT, REVIEW] }
        restrictions: { type: array, items: { type: string } }
        verified_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        session: { $ref: "#/components/schemas/VerificationSession" }
        checks: { type: array, items: { $ref: "#/components/schemas/VerificationCheck" } }
        missing: { type: array, items: { $ref: "#/components/schemas/VerificationRequirement" } }
        sandbox:
          type: boolean
          description: True when any of this was established by a rehearsal provider.
        rules_version: { type: string }
        provider: { type: string }
        provider_availability:
          type: string
          enum: ["", NOT_OFFERED, REQUIRES_APPLICATION, APPLICATION_PENDING,
                 APPLICATION_DENIED, SANDBOX_ONLY, LIVE]
    StartVerificationRequest:
      type: object
      required: [account_id, jurisdiction_country]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        purpose:
          type: string
          enum: [PAYOUT_KYC, ENHANCED]
          description: Defaults to PAYOUT_KYC, which is what a withdrawal needs.
        jurisdiction_country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2. Never inferred from a network address.
        jurisdiction_region:
          type: string
          description: The subdivision code without its country prefix. Required where the rules depend on it.
    StartedVerification:
      type: object
      required: [session, sandbox]
      properties:
        session: { $ref: "#/components/schemas/VerificationSession" }
        hosted_url:
          type: string
          description: >-
            Single-use and short-lived. It is returned here and stored nowhere.
            On a sandbox tier it is a `sandbox:` reference rather than a page,
            because there is no hosted flow to visit.
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        sandbox: { type: boolean }
        sandbox_control_path:
          type: string
          description: >-
            Present only for a rehearsal session. It is where a sandbox operator
            chooses the outcome explicitly, and its presence is what makes a
            sandbox session visibly a rehearsal.
    SandboxVerificationOutcome:
      type: object
      required: [account_id, outcome]
      description: SANDBOX TIER ONLY. Refused with FORBIDDEN anywhere else.
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        outcome:
          type: string
          enum: [VERIFIED, NEEDS_INFORMATION, REJECTED, UNDERAGE, SANCTIONED]
          description: >-
            There is no default. UNDERAGE and SANCTIONED are separate from
            REJECTED because §21 requires an age failure and a sanctions failure
            to be separately expressible.
    WithdrawalReason:
      type: string
      description: >-
        A machine-readable reason value cannot leave. Each names something that
        could change. REQUIRES_VERIFICATION and TERMS_NOT_ACCEPTED are NEXT
        STEPS and not denials, and the product must present them as such:
        TERMS_NOT_ACCEPTED means the withdrawal disclosure has not been accepted
        at the version now served, which is the normal state of somebody who has
        never withdrawn. The eligible figures stay true beside it.
      enum: [REQUIRES_VERIFICATION, ORIGIN_NOT_WITHDRAWABLE, CAPABILITY_INACTIVE,
             JURISDICTION_RESTRICTED, ACCOUNT_RESTRICTED, PROVIDER_UNAVAILABLE,
             MINIMUM_NOT_MET, FUNDING_NOT_SETTLED, HOLD_PERIOD_NOT_ELAPSED,
             NO_VALUE, POLICY_INVALID, TERMS_NOT_ACCEPTED]
    WithdrawalOriginBucket:
      type: object
      required: [origin, quantity, withdrawable, reasons, payout_allowed, consumption_rank]
      properties:
        origin: { $ref: "#/components/schemas/CreditOrigin" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        withdrawable: { $ref: "#/components/schemas/Quantity" }
        reasons: { type: array, items: { $ref: "#/components/schemas/WithdrawalReason" } }
        payout_allowed: { type: boolean }
        required_verification: { $ref: "#/components/schemas/VerificationLevel" }
        required_capability: { type: string }
        min_hold_days: { type: integer }
        consumption_rank:
          type: integer
          description: Where this origin sits in the consumption order. Lower leaves first.
        verification_would_suffice: { type: boolean }
    WithdrawalEligibility:
      type: object
      required: [account_id, eligible, withdrawable_now, gross, spendable, frozen,
                 payout_eligible, ineligible, buckets, reasons, policy_version,
                 current_verification, required_verification, sandbox]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        eligible: { type: boolean }
        withdrawable_now: { $ref: "#/components/schemas/Quantity" }
        gross: { $ref: "#/components/schemas/Quantity" }
        spendable: { $ref: "#/components/schemas/Quantity" }
        frozen: { $ref: "#/components/schemas/Quantity" }
        payout_eligible: { $ref: "#/components/schemas/Quantity" }
        ineligible: { $ref: "#/components/schemas/Quantity" }
        buckets: { type: array, items: { $ref: "#/components/schemas/WithdrawalOriginBucket" } }
        reasons: { type: array, items: { $ref: "#/components/schemas/WithdrawalReason" } }
        verification_would_suffice:
          type: boolean
          description: True when identity verification is the only thing standing between this person and some of their money.
        current_verification: { $ref: "#/components/schemas/VerificationLevel" }
        required_verification: { $ref: "#/components/schemas/VerificationLevel" }
        minimum_quantity:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: The provider's minimum expressed in Credits, or "0" when it publishes none. Zero is never "any amount will do".
        provider: { type: string }
        provider_available: { type: boolean }
        destination_configured: { type: boolean }
        jurisdiction_supported: { type: boolean }
        policy_version: { type: string }
        policy_hash: { type: string }
        sandbox: { type: boolean }
    PayoutDestinationStatus:
      type: string
      description: >-
        UNVERIFIED is §25's VERIFYING and VERIFIED is its ACTIVE; the existing
        names are kept because working code and a registered enum pairing use
        them (D-060). REJECTED and DISABLED are terminal: a destination never
        comes back, and adding it again is a new registration.
      enum: [UNVERIFIED, VERIFIED, REJECTED, DISABLED]
    PayoutDestination:
      type: object
      required: [destination_id, account_id, kind, provider, status, sandbox, created_at]
      description: >-
        Nodal stores the provider's token and a mask. There is no account
        number, card number, IBAN, routing number or key in this object, and
        there is none in the table behind it.
      properties:
        destination_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string, enum: [BANK, CARD_PUSH, FIAT_WALLET, CRYPTO_WALLET] }
        provider: { type: string }
        status: { $ref: "#/components/schemas/PayoutDestinationStatus" }
        display_label: { type: string }
        masked_display:
          type: string
          description: What a person recognises, such as "••••4242". Never the whole number.
        currency: { type: string }
        country: { type: string }
        usable:
          type: boolean
          description: Whether a payout may be sent here right now.
        sandbox: { type: boolean }
        verified_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    CreatePayoutDestination:
      type: object
      required: [account_id, kind, provider_token]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string, enum: [BANK, CARD_PUSH, FIAT_WALLET, CRYPTO_WALLET] }
        provider_token:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The provider's token for the destination, or on a sandbox tier a
            sandbox handle. An input that looks like an account number, a card
            number, an IBAN, a private key or a seed phrase is REFUSED, not
            stored: Nodal never holds one.
        display_label: { type: string, maxLength: 64 }
        masked_display: { type: string, maxLength: 64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
    CreatePayoutQuote:
      type: object
      required: [account_id, destination_id, amount]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        destination_id: { $ref: "#/components/schemas/UUID" }
        amount:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: The GROSS Credits the customer would give up. The fee comes out of it.
    PayoutQuote:
      type: object
      required: [quote_id, account_id, destination_id, provider, gross_quantity,
                 fee_quantity, net_quantity, currency, gross_amount_minor,
                 fee_amount_minor, net_amount_minor, minimum_ok, expires_at, sandbox]
      description: >-
        What the provider said a payout would cost, before anybody committed.
        Both sides are exact integers; there is no rate field holding a decimal.
      properties:
        quote_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        destination_id: { $ref: "#/components/schemas/UUID" }
        provider: { type: string }
        gross_quantity: { $ref: "#/components/schemas/Quantity" }
        fee_quantity: { $ref: "#/components/schemas/Quantity" }
        net_quantity: { $ref: "#/components/schemas/Quantity" }
        currency: { type: string }
        gross_amount_minor: { type: integer, format: int64 }
        fee_amount_minor: { type: integer, format: int64 }
        net_amount_minor: { type: integer, format: int64 }
        minimum_amount_minor: { type: integer, format: int64 }
        minimum_ok:
          type: boolean
          description: Judged NET of fees, because sub-minimum dust is destroyed rather than returned.
        pricing_version: { type: string }
        fee_model_version:
          type: string
          description: >-
            Which fee schedule produced these numbers. On a sandbox tier it says
            in words that the figures are placeholders and not a price anybody
            has agreed.
        policy_version: { type: string }
        provenance:
          type: array
          items: { $ref: "#/components/schemas/PayoutProvenanceSlice" }
          description: What value would leave, in the order it would leave.
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        consumed_at: { $ref: "#/components/schemas/Timestamp" }
        sandbox: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    PayoutProvenanceSlice:
      type: object
      required: [origin, quantity, consumption_rank]
      description: >-
        One origin's contribution to a payout (§23). The order is the
        consumption order: among the origins a policy permits, the most
        restricted permitted one leaves first.
      properties:
        origin: { $ref: "#/components/schemas/CreditOrigin" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        consumption_rank: { type: integer }
        returned:
          type: boolean
          description: True for a slice a cancellation gave back to the exact lots it came from.
