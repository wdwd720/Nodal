      responses:
        "200":
          description: Page of economic intents
          content: { application/json: { schema: { $ref: "#/components/schemas/EconomicIntentPage" } } }
        "403": { $ref: "#/components/responses/Problem" }
  /advanced/intents/{intentId}:
    get:
