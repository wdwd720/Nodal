    # >>> advanced:margin schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:derivatives schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:equities schemas (insert this subsystem's schemas directly below; keep the marker)
    #
    # Equities. A price is an exact decimal string per whole share in the
    # listing's settlement asset (never a JSON number, never rounded); a share
    # quantity is base units of the listing's share asset (fractional shares
    # at its decimals); an amount of value -- a notional, a fee, a settlement,
    # a reservation for a buy -- is base units of the settlement asset. Every
    # enum carries x-enum-varnames prefixed Equity so its Go constants cannot
    # collide.
    AdvancedEquityPrice:
      type: string
      maxLength: 64
      pattern: '^[0-9]+(\.[0-9]+)?$'
      description: An exact decimal amount of the settlement asset per whole share
      examples: ["150.25"]
    AdvancedEquityDate:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: A calendar day, YYYY-MM-DD, with no time and no zone
      examples: ["2026-10-08"]
    AdvancedEquityKind:
