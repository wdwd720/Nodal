    MarginPlanDecision:
      type: string
      enum: [COMPLETE, AWAIT_PRICE, AWAIT_VENUE, SELL, SELL_ALL, APPLY_COLLATERAL, BANKRUPT, MANUAL_REVIEW]
    MarginStepAction:
      type: string
      enum: [SELL, APPLY_COLLATERAL]
    MarginStressScenario:
      type: string
      enum: [GAP_DOWN_5, GAP_DOWN_10, GAP_DOWN_25, GAP_DOWN_50, GAP_UP_5, GAP_UP_10, GAP_UP_25, GAP_UP_50,
             ORACLE_UNAVAILABLE, VENUE_UNAVAILABLE, PARTIAL_FILL, EXTREME_SPREAD, BRIDGE_DELAYED, COLLATERAL_DEPEG]
    MarginPrice:
      type: object
      required: [mantissa, scale]
      description: The price of one whole unit in the numeraire, exactly mantissa × 10^-scale.
      properties:
        mantissa: { $ref: "#/components/schemas/Quantity" }
        scale: { type: integer }
        source: { type: string }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
    MarginOpenRequest:
      type: object
      required: [account_id, margin_mode, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        margin_mode: { $ref: "#/components/schemas/MarginMode" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        isolated_asset_id: { $ref: "#/components/schemas/UUID" }
    MarginAccountRef:
      type: object
      required: [account_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
    MarginCollateralRequest:
      type: object
      required: [account_id, asset_id, quantity]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
    MarginAmountRequest:
      type: object
      required: [account_id, amount]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        amount: { $ref: "#/components/schemas/Quantity" }
    MarginLeveragedBuyRequest:
      type: object
      required: [account_id, asset_id, quantity]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
    MarginSeedRequest:
      type: object
      required: [pool_amount, fund_amount]
      properties:
        pool_amount: { $ref: "#/components/schemas/Quantity" }
        fund_amount: { $ref: "#/components/schemas/Quantity" }
    MarginBatchRequest:
      type: object
      properties:
        limit: { type: integer, minimum: 1 }
    MarginLiquidateRequest:
      type: object
      required: [account_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        expected_step: { type: integer, minimum: 0, description: "The step meant (1 for the first); 0 or absent means whatever step is next. A step already executed is returned, not repeated." }
    MarginAccount:
      type: object
      required: [value_domain, id, account_id, margin_mode, mode, status, policy_version, numeraire_asset_id, lending_pool_id,
                 insurance_fund_id, opened_at]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        margin_mode: { $ref: "#/components/schemas/MarginMode" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        status: { $ref: "#/components/schemas/MarginAccountStatus" }
        policy_version: { type: string }
        numeraire_asset_id: { $ref: "#/components/schemas/UUID" }
        isolated_asset_id: { $ref: "#/components/schemas/UUID" }
        lending_pool_id: { $ref: "#/components/schemas/UUID" }
        insurance_fund_id: { $ref: "#/components/schemas/UUID" }
        opened_at: { $ref: "#/components/schemas/Timestamp" }
    MarginHaircut:
      type: object
      required: [volatility_bps, liquidity_bps, oracle_bps, venue_bps, concentration_bps, settlement_bps, cross_chain_bps, zero_value, total_bps]
      properties:
        volatility_bps: { $ref: "#/components/schemas/BPS" }
        liquidity_bps: { $ref: "#/components/schemas/BPS" }
        oracle_bps: { $ref: "#/components/schemas/BPS" }
        venue_bps: { $ref: "#/components/schemas/BPS" }
        concentration_bps: { $ref: "#/components/schemas/BPS" }
        settlement_bps: { $ref: "#/components/schemas/BPS" }
        cross_chain_bps: { $ref: "#/components/schemas/BPS" }
        zero_value: { type: boolean, description: "A stale, missing or future mark (or a delayed bridge) makes the collateral worthless." }
        total_bps: { $ref: "#/components/schemas/BPS" }
    MarginHolding:
      type: object
      required: [asset_id, numeraire, quantity, market_value, priced, fresh, concentration_share_bps, haircut, collateral_value,
                 exposure, initial_margin, maintenance_margin]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        numeraire: { type: boolean }
        quantity: { $ref: "#/components/schemas/Quantity", description: "base units of the asset" }
        market_value: { $ref: "#/components/schemas/Quantity" }
        priced: { type: boolean }
        fresh: { type: boolean }
        mark_at: { $ref: "#/components/schemas/Timestamp" }
        mark: { $ref: "#/components/schemas/MarginPrice", description: "the mark the evaluation used; present on reads" }
        concentration_share_bps: { $ref: "#/components/schemas/BPS" }
        haircut: { $ref: "#/components/schemas/MarginHaircut" }
        collateral_value: { $ref: "#/components/schemas/Quantity" }
        exposure: { $ref: "#/components/schemas/Quantity" }
        initial_margin: { $ref: "#/components/schemas/Quantity" }
        maintenance_margin: { $ref: "#/components/schemas/Quantity" }
    MarginEvaluationUSD:
      type: object
      description: The engine's cent rendering, rounded so the account can only look less healthy (assets and equity down, liabilities and requirements up).
      required: [eligible_collateral, borrow_liabilities, accrued_interest, equity, market_value, gross_exposure, initial_margin,
                 maintenance_margin, warning_threshold, margin_available, liquidation_buffer]
      properties:
        eligible_collateral: { $ref: "#/components/schemas/USD" }
        borrow_liabilities: { $ref: "#/components/schemas/USD" }
        accrued_interest: { $ref: "#/components/schemas/USD" }
        equity: { $ref: "#/components/schemas/USD" }
        market_value: { $ref: "#/components/schemas/USD" }
        gross_exposure: { $ref: "#/components/schemas/USD" }
        initial_margin: { $ref: "#/components/schemas/USD" }
        maintenance_margin: { $ref: "#/components/schemas/USD" }
        warning_threshold: { $ref: "#/components/schemas/USD" }
        margin_available: { $ref: "#/components/schemas/USD" }
        liquidation_buffer: { $ref: "#/components/schemas/USD" }
    MarginEvaluation:
      type: object
      description: >-
        The margin engine's deterministic evaluation. equity = eligible_collateral + realized_pnl + unrealized_pnl
        − borrow_liabilities − accrued_fees − accrued_interest; liquidation_buffer = equity − maintenance_margin
        (negative once eligible for liquidation). Quantities are numeraire base units.
      required: [at, policy_version, policy_hash, hash, numeraire_asset_id, numeraire_decimals, health, levered, liquidation_eligible,
                 prices_fresh, missing_marks, stale_assets, leverage_cap_bps, effective_leverage_bps, leverage_unbounded,
                 eligible_collateral, realized_pnl, unrealized_pnl, borrow_liabilities, accrued_fees, accrued_interest, equity,
                 market_value, net_asset_value, gross_exposure, net_exposure, initial_margin, maintenance_margin, warning_threshold,
                 liquidation_buffer, capacity, margin_available, usd, holdings]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        policy_version: { type: string }
        policy_hash: { type: string }
        hash: { type: string }
        numeraire_asset_id: { $ref: "#/components/schemas/UUID" }
        numeraire_decimals: { type: integer }
        health: { $ref: "#/components/schemas/MarginAccountStatus" }
        levered: { type: boolean }
        liquidation_eligible: { type: boolean }
        prices_fresh: { type: boolean }
        missing_marks: { type: boolean }
        stale_assets: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        oldest_mark_at: { $ref: "#/components/schemas/Timestamp" }
        newest_mark_at: { $ref: "#/components/schemas/Timestamp" }
        leverage_cap_bps: { type: integer, format: int64, description: "basis points of gross exposure over equity (50000 = 5x)" }
        effective_leverage_bps: { type: integer, format: int64, description: "basis points, rounded up" }
        leverage_unbounded: { type: boolean }
        eligible_collateral: { $ref: "#/components/schemas/Quantity" }
        realized_pnl: { $ref: "#/components/schemas/Quantity" }
        unrealized_pnl: { $ref: "#/components/schemas/Quantity" }
        borrow_liabilities: { $ref: "#/components/schemas/Quantity" }
        accrued_fees: { $ref: "#/components/schemas/Quantity" }
        accrued_interest: { $ref: "#/components/schemas/Quantity" }
        equity: { $ref: "#/components/schemas/Quantity" }
        market_value: { $ref: "#/components/schemas/Quantity" }
        net_asset_value: { $ref: "#/components/schemas/Quantity" }
        gross_exposure: { $ref: "#/components/schemas/Quantity" }
        net_exposure: { $ref: "#/components/schemas/Quantity" }
        initial_margin: { $ref: "#/components/schemas/Quantity" }
        maintenance_margin: { $ref: "#/components/schemas/Quantity" }
        warning_threshold: { $ref: "#/components/schemas/Quantity" }
        liquidation_buffer: { $ref: "#/components/schemas/Quantity" }
        capacity: { $ref: "#/components/schemas/Quantity" }
        margin_available: { $ref: "#/components/schemas/Quantity" }
        usd: { $ref: "#/components/schemas/MarginEvaluationUSD" }
        holdings: { type: array, items: { $ref: "#/components/schemas/MarginHolding" } }
    MarginLoan:
      type: object
      required: [lot_id, principal, interest, rate_bps, accrued_through]
      properties:
        lot_id: { $ref: "#/components/schemas/UUID" }
        principal: { $ref: "#/components/schemas/Quantity", description: "outstanding principal" }
        interest: { $ref: "#/components/schemas/Quantity", description: "interest posted (capitalized) and not yet repaid" }
        rate_bps: { type: integer, format: int64, description: "annual simple rate" }
        accrued_through: { $ref: "#/components/schemas/Timestamp" }
    MarginCall:
      type: object
      required: [id, margin_account_id, account_id, status, issued_at, equity, maintenance_margin, deficiency, evaluation_hash,
                 numeraire_asset_id, numeraire_decimals]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        status: { $ref: "#/components/schemas/MarginCallStatus" }
        issued_at: { $ref: "#/components/schemas/Timestamp" }
        equity: { $ref: "#/components/schemas/Quantity" }
        maintenance_margin: { $ref: "#/components/schemas/Quantity" }
        deficiency: { $ref: "#/components/schemas/Quantity" }
        evaluation_hash: { type: string }
        resolved_at: { $ref: "#/components/schemas/Timestamp" }
        numeraire_asset_id: { $ref: "#/components/schemas/UUID" }
        numeraire_decimals: { type: integer }
    MarginCase:
      type: object
      required: [id, margin_account_id, account_id, margin_call_id, status, policy_version, target, max_steps, steps_executed,
                 opened_at, last_reason, numeraire_asset_id, numeraire_decimals]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        margin_call_id: { $ref: "#/components/schemas/UUID" }
        status: { $ref: "#/components/schemas/MarginCaseStatus" }
        policy_version: { type: string }
        target: { $ref: "#/components/schemas/MarginLiquidationTarget" }
        max_steps: { type: integer }
        steps_executed: { type: integer }
        opened_at: { $ref: "#/components/schemas/Timestamp" }
        closed_at: { $ref: "#/components/schemas/Timestamp" }
        last_reason: { type: string }
        deficit: { $ref: "#/components/schemas/Quantity" }
        deficit_coverage_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        deficit_covered_at: { $ref: "#/components/schemas/Timestamp" }
        numeraire_asset_id: { $ref: "#/components/schemas/UUID" }
        numeraire_decimals: { type: integer }
    MarginLiquidationStep:
      type: object
      required: [id, step_no, action, asset_id, quantity, slippage_bps, slippage_cap_bps, proceeds, fee, repaid, excess,
                 equity_before, equity_after, plan_hash, executed_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        step_no: { type: integer }
        action: { $ref: "#/components/schemas/MarginStepAction" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        mark: { $ref: "#/components/schemas/MarginPrice" }
        execution_price: { $ref: "#/components/schemas/MarginPrice" }
        slippage_bps: { $ref: "#/components/schemas/BPS" }
        slippage_cap_bps: { $ref: "#/components/schemas/BPS" }
        proceeds: { $ref: "#/components/schemas/Quantity" }
        fee: { $ref: "#/components/schemas/Quantity" }
        repaid: { $ref: "#/components/schemas/Quantity" }
        excess: { $ref: "#/components/schemas/Quantity" }
        trade_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        release_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        repay_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        excess_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        equity_before: { $ref: "#/components/schemas/Quantity" }
        equity_after: { $ref: "#/components/schemas/Quantity" }
        plan_hash: { type: string }
        executed_at: { $ref: "#/components/schemas/Timestamp" }
    MarginAccountDetail:
      allOf:
        - { $ref: "#/components/schemas/MarginAccount" }
        - type: object
          required: [evaluation, loans]
          properties:
            evaluation: { $ref: "#/components/schemas/MarginEvaluation" }
            loans: { type: array, items: { $ref: "#/components/schemas/MarginLoan" } }
            open_call: { $ref: "#/components/schemas/MarginCall" }
            latest_case: { $ref: "#/components/schemas/MarginCase" }
    MarginCaseDetail:
      allOf:
        - { $ref: "#/components/schemas/MarginCase" }
        - type: object
          required: [value_domain, steps]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            steps: { type: array, items: { $ref: "#/components/schemas/MarginLiquidationStep" } }
    MarginCallPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/MarginCall" } }
    MarginCasePage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/MarginCase" } }
    MarginStressResult:
      type: object
      required: [scenario, shock_bps, equity_after, maintenance_after, initial_after, equity_after_usd, maintenance_after_usd,
                 would_liquidate, executable, outcome, steps_simulated, deficit, deficit_usd, insurance_fund_draw, insurance_fund_draw_usd]
      properties:
        scenario: { $ref: "#/components/schemas/MarginStressScenario" }
        shock_bps: { $ref: "#/components/schemas/BPS" }
        equity_after: { $ref: "#/components/schemas/Quantity" }
        maintenance_after: { $ref: "#/components/schemas/Quantity" }
        initial_after: { $ref: "#/components/schemas/Quantity" }
        equity_after_usd: { $ref: "#/components/schemas/USD" }
        maintenance_after_usd: { $ref: "#/components/schemas/USD" }
        would_liquidate: { type: boolean }
        executable: { type: boolean }
        outcome: { $ref: "#/components/schemas/MarginPlanDecision" }
        steps_simulated: { type: integer }
        deficit: { $ref: "#/components/schemas/Quantity" }
        deficit_usd: { $ref: "#/components/schemas/USD" }
        insurance_fund_draw: { $ref: "#/components/schemas/Quantity" }
        insurance_fund_draw_usd: { $ref: "#/components/schemas/USD" }
    MarginStressRunSummary:
      type: object
      required: [id, margin_account_id, account_id, run_at, policy_version, policy_hash, input_hash, report_hash,
                 numeraire_asset_id, numeraire_decimals]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        run_at: { $ref: "#/components/schemas/Timestamp" }
        policy_version: { type: string }
        policy_hash: { type: string }
        input_hash: { type: string }
        report_hash: { type: string }
        numeraire_asset_id: { $ref: "#/components/schemas/UUID" }
        numeraire_decimals: { type: integer }
    MarginStressRun:
      allOf:
        - { $ref: "#/components/schemas/MarginStressRunSummary" }
        - type: object
          required: [value_domain, results]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            results: { type: array, items: { $ref: "#/components/schemas/MarginStressResult" } }
    MarginStressRunPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/MarginStressRunSummary" } }
    MarginCollateralResult:
      type: object
      required: [value_domain, margin_account_id, move_id, journal_transaction_id, effect_id, replayed, status]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        move_id: { $ref: "#/components/schemas/UUID" }
        intent_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        reservation_id: { $ref: "#/components/schemas/UUID" }
        replayed: { type: boolean, description: "the service found this operation already applied and posted nothing; no evaluation is reported" }
        status: { $ref: "#/components/schemas/MarginAccountStatus" }
        evaluation: { $ref: "#/components/schemas/MarginEvaluation" }
    MarginLoanAllocation:
      type: object
      required: [lot_id, interest, principal]
      properties:
        lot_id: { $ref: "#/components/schemas/UUID" }
        interest: { $ref: "#/components/schemas/Quantity" }
        principal: { $ref: "#/components/schemas/Quantity" }
    MarginLoanResult:
      type: object
      required: [value_domain, margin_account_id, intent_id, journal_transaction_id, effect_id, allocations, replayed, status]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        intent_id: { $ref: "#/components/schemas/UUID" }
        lot_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        allocations: { type: array, items: { $ref: "#/components/schemas/MarginLoanAllocation" } }
        replayed: { type: boolean }
        status: { $ref: "#/components/schemas/MarginAccountStatus" }
        evaluation: { $ref: "#/components/schemas/MarginEvaluation" }
    MarginLeveragedBuyResult:
      type: object
      required: [value_domain, margin_account_id, intent_id, cost, borrow_journal_transaction_id, trade_journal_transaction_id,
                 collateral_journal_transaction_id, replayed, status]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        intent_id: { $ref: "#/components/schemas/UUID" }
        lot_id: { $ref: "#/components/schemas/UUID" }
        mark: { $ref: "#/components/schemas/MarginPrice" }
        execution_price: { $ref: "#/components/schemas/MarginPrice", description: "mark × (1 + slippage_bps)" }
        slippage_bps: { $ref: "#/components/schemas/BPS" }
        cost: { $ref: "#/components/schemas/Quantity", description: "numeraire base units borrowed: quantity × execution price, rounded up" }
        borrow_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        trade_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        collateral_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        reservation_id: { $ref: "#/components/schemas/UUID" }
        replayed: { type: boolean }
        status: { $ref: "#/components/schemas/MarginAccountStatus" }
        evaluation: { $ref: "#/components/schemas/MarginEvaluation" }
    MarginFacility:
      type: object
      required: [id, kind, name, status, available]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string }
        name: { type: string }
        status: { type: string }
        available: { $ref: "#/components/schemas/Quantity", description: "sandbox-dollar base units the facility holds unlent (lending pool) or undrawn (insurance fund)" }
    MarginFacilities:
      type: object
      required: [value_domain, asset_id, asset_decimals, lending_pool, insurance_fund]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_decimals: { type: integer }
        lending_pool: { $ref: "#/components/schemas/MarginFacility" }
        insurance_fund: { $ref: "#/components/schemas/MarginFacility" }
    MarginFailure:
      type: object
      required: [code, detail]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        code: { type: string }
        detail: { type: string }
    MarginEvaluated:
      type: object
      required: [margin_account_id, account_id, previous_status, status, evaluation]
      properties:
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        previous_status: { $ref: "#/components/schemas/MarginAccountStatus" }
        status: { $ref: "#/components/schemas/MarginAccountStatus" }
        evaluation: { $ref: "#/components/schemas/MarginEvaluation" }
        call: { $ref: "#/components/schemas/MarginCall" }
    MarginMarkToMarketResult:
      type: object
      required: [value_domain, evaluated, failures]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        evaluated: { type: array, items: { $ref: "#/components/schemas/MarginEvaluated" } }
        failures: { type: array, items: { $ref: "#/components/schemas/MarginFailure" } }
    MarginQueueEntry:
      type: object
      required: [account, numeraire_decimals]
      properties:
        account: { $ref: "#/components/schemas/MarginAccount" }
        numeraire_decimals: { type: integer }
        evaluation: { $ref: "#/components/schemas/MarginEvaluation" }
        evaluation_error: { $ref: "#/components/schemas/MarginFailure" }
        open_call: { $ref: "#/components/schemas/MarginCall" }
        latest_case: { $ref: "#/components/schemas/MarginCase" }
    MarginQueue:
      type: object
      required: [value_domain, items]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        items: { type: array, items: { $ref: "#/components/schemas/MarginQueueEntry" } }
    MarginLiquidationOrder:
      type: object
      required: [action, asset_id, quantity, slippage_bps, proceeds, fee, repay, excess]
      properties:
        action: { $ref: "#/components/schemas/MarginStepAction" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        mark: { $ref: "#/components/schemas/MarginPrice" }
        execution_price: { $ref: "#/components/schemas/MarginPrice" }
        slippage_bps: { $ref: "#/components/schemas/BPS" }
        proceeds: { $ref: "#/components/schemas/Quantity" }
        fee: { $ref: "#/components/schemas/Quantity" }
        repay: { $ref: "#/components/schemas/Quantity" }
        excess: { $ref: "#/components/schemas/Quantity" }
    MarginPlan:
      type: object
      required: [decision, reason, target, steps_taken, target_units, deficit_units, hash, orders]
      properties:
        decision: { $ref: "#/components/schemas/MarginPlanDecision" }
        reason: { type: string }
        target: { $ref: "#/components/schemas/MarginLiquidationTarget" }
        steps_taken: { type: integer }
        target_units: { $ref: "#/components/schemas/Quantity" }
        deficit_units: { $ref: "#/components/schemas/Quantity" }
        hash: { type: string }
        orders: { type: array, items: { $ref: "#/components/schemas/MarginLiquidationOrder" } }
    MarginLiquidationResult:
      type: object
      required: [value_domain, margin_account_id, account_id, eligible, decision, reason, account_status, numeraire_decimals, replayed]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        eligible: { type: boolean, description: "false when the account needed no liquidation and no case was opened" }
        decision: { $ref: "#/components/schemas/MarginPlanDecision" }
        reason: { type: string }
        account_status: { $ref: "#/components/schemas/MarginAccountStatus" }
        numeraire_decimals: { type: integer }
        case: { $ref: "#/components/schemas/MarginCase" }
        step: { $ref: "#/components/schemas/MarginLiquidationStep" }
        plan: { $ref: "#/components/schemas/MarginPlan" }
        replayed: { type: boolean }
    MarginQueueRunResult:
      type: object
      required: [value_domain, results, failures]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        results: { type: array, items: { $ref: "#/components/schemas/MarginLiquidationResult" } }
        failures: { type: array, items: { $ref: "#/components/schemas/MarginFailure" } }
    MarginDeficitResult:
      type: object
      required: [value_domain, case_id, deficit, journal_transaction_id, replayed, case]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        case_id: { $ref: "#/components/schemas/UUID" }
        deficit: { $ref: "#/components/schemas/Quantity" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        replayed: { type: boolean }
        case: { $ref: "#/components/schemas/MarginCase" }

    # >>> advanced:derivatives schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:equities schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:orders schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:transfers schemas (insert this subsystem's schemas directly below; keep the marker)
    #
    # The enums carry x-enum-varnames so their Go constants can never collide
    # with another schema's (ALLOW and OPEN already exist unprefixed).
    AdvancedTransferStatus:
      type: string
      enum: [PENDING, COMPLETED, REJECTED, REVERSED]
      x-enum-varnames: [TransferStatusPending, TransferStatusCompleted, TransferStatusRejected, TransferStatusReversed]
      description: PENDING exists only inside the transaction that decides a transfer; a committed transfer is COMPLETED, REJECTED or REVERSED.
    AdvancedTransfer:
      type: object
      description: >-
        One customer-to-customer transfer of simulated value. What a reader
        sees depends on who they are: the sender sees their whole record but
        not the account id behind a handle they paid; a recipient sees a
        transfer once it moved value, without the sender's decision record or
        the reversal reason; an operator holding account:read_any sees
        everything.
      required: [id, intent_id, status, sender_account_id, asset_id, asset_symbol, asset_decimals, quantity, notional_usd,
                 mode, reason_codes, policy_version, policy_hash, created_at, updated_at, value_domain]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        intent_id: { $ref: "#/components/schemas/UUID" }
        status: { $ref: "#/components/schemas/AdvancedTransferStatus" }
        sender_account_id: { $ref: "#/components/schemas/UUID" }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string, description: The handle the sender named the recipient by (absent when named by account id) }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_symbol: { type: string }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        notional_usd: { $ref: "#/components/schemas/USD" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        memo: { type: string, description: Visible to the two parties only and never in a journal or an event or a notification }
        rejection_code: { type: string, description: The primary stable code of a REJECTED transfer }
        reason_codes: { type: array, items: { type: string }, description: Every code that applied to a REJECTED transfer with the primary first }
        policy_version: { type: string }
        policy_hash: { type: string }
        risk_decision_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        decided_at: { $ref: "#/components/schemas/Timestamp" }
        reversal_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        reversal_reason_code: { type: string }
        reversed_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedTransferPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items, value_domain]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdvancedTransfer" } }
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedTransferSendRequest:
      type: object
      description: >-
        Name the recipient by exactly one of recipient_handle or
        recipient_account_id, and the value by exactly one of amount (a plain
        decimal in whole units of the asset, never rounded: more fractional
        digits than the asset has is PRECISION_LOSS) or quantity (exact base
        units). asset_id defaults to the sandbox dollar.
      required: [account_id, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string, maxLength: 33, pattern: '^@?[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$' }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        amount: { type: string, maxLength: 64, pattern: '^[0-9]+(\.[0-9]+)?$' }
        quantity: { $ref: "#/components/schemas/Quantity" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        memo: { type: string, maxLength: 280, description: Printable text without surrounding whitespace; the transfer policy may bound it lower }
    AdvancedTransferReverseRequest:
      type: object
      required: [reason_code, reason]
      properties:
        reason_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$', examples: ["FRAUD_CONFIRMED"] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdvancedTransferHandleRequest:
      type: object
      required: [account_id, handle]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        handle:
          type: string
          maxLength: 33
          pattern: '^@?[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$'
          description: 3..32 characters of a-z, 0-9, '_', '.', '-' starting with a letter or digit; a leading '@' is dropped and the handle is lower-cased
    AdvancedTransferHandle:
      type: object
      required: [id, account_id, handle, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        handle: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    AdvancedTransferRecipientRuleKind:
      type: string
      enum: [ALLOW, BLOCK, CLEAR]
      x-enum-varnames: [TransferRuleAllow, TransferRuleBlock, TransferRuleClear]
    AdvancedTransferRecipientRuleRequest:
      type: object
      description: Name the recipient by exactly one of recipient_handle or recipient_account_id.
      required: [account_id, rule]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string, maxLength: 33, pattern: '^@?[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$' }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        rule: { $ref: "#/components/schemas/AdvancedTransferRecipientRuleKind" }
        reason: { type: string, maxLength: 500 }
    AdvancedTransferRecipientRule:
      type: object
      description: The rule as recorded; the recipient is named the way the request named it.
      required: [account_id, rule]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        rule: { $ref: "#/components/schemas/AdvancedTransferRecipientRuleKind" }
        reason: { type: string }
    AdvancedTransferSenderMode:
      type: string
      enum: [OPEN, ALLOWLIST_ONLY]
      x-enum-varnames: [TransferSenderOpen, TransferSenderAllowlistOnly]
    AdvancedTransferSenderModeRequest:
      type: object
      required: [account_id, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/AdvancedTransferSenderMode" }
    AdvancedTransferSenderModeSetting:
      type: object
      required: [account_id, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/AdvancedTransferSenderMode" }
    AdvancedTransferAssetIdentity:
      type: object
      description: >-
        The clearing identity of one asset: TRANSFER_OUT = TRANSFER_IN = the
        register's COMPLETED quantity, and the customer WALLET change over every
        transfer journal and reversal is zero.
      required: [asset_id, transfer_out, transfer_in, register_completed, wallet_delta]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        transfer_out: { $ref: "#/components/schemas/Quantity" }
        transfer_in: { $ref: "#/components/schemas/Quantity" }
        register_completed: { $ref: "#/components/schemas/Quantity" }
        wallet_delta: { $ref: "#/components/schemas/Quantity" }
    AdvancedTransferDiscrepancy:
      type: object
      required: [code, detail]
      properties:
        code: { type: string }
        transfer_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        detail: { type: string }
    AdvancedTransferReconciliation:
      type: object
      required: [checked_at, transfers, ok, assets, discrepancies, value_domain]
      properties:
        checked_at: { $ref: "#/components/schemas/Timestamp" }
        transfers: { type: integer, description: Transfers in scope whatever their status }
        ok: { type: boolean }
        assets: { type: array, items: { $ref: "#/components/schemas/AdvancedTransferAssetIdentity" } }
        discrepancies: { type: array, items: { $ref: "#/components/schemas/AdvancedTransferDiscrepancy" } }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedFaucetGrantRequest:
      type: object
      description: >-
        The value is exactly one of amount (a plain decimal in whole sandbox
        dollars, never rounded) or quantity (exact base units; the sandbox
        dollar has 6 decimals).
      required: [account_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        amount: { type: string, maxLength: 64, pattern: '^[0-9]+(\.[0-9]+)?$' }
        quantity: { $ref: "#/components/schemas/Quantity" }
    AdvancedFaucetGrant:
      type: object
      required: [id, account_id, asset_id, asset_symbol, asset_decimals, quantity, policy_version, policy_hash, environment,
                 effect_id, journal_transaction_id, granted_at, value_domain]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_symbol: { type: string }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        policy_version: { type: string }
        policy_hash: { type: string }
        environment: { type: string }
        effect_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        granted_at: { $ref: "#/components/schemas/Timestamp" }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedFaucetAllowance:
      type: object
      description: >-
        cap is the faucet policy's per-account limit for the rolling window,
        used is what the account was granted inside it, and remaining is
        cap - used (never below zero), all in base units of the sandbox dollar.
      required: [account_id, asset_id, asset_symbol, asset_decimals, cap, used, remaining, window_ms, policy_version,
                 policy_hash, environment, value_domain]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_symbol: { type: string }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        cap: { $ref: "#/components/schemas/Quantity" }
        used: { $ref: "#/components/schemas/Quantity" }
        remaining: { $ref: "#/components/schemas/Quantity" }
        window_ms: { type: integer, format: int64 }
        policy_version: { type: string }
        policy_hash: { type: string }
        environment: { type: string }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }

    # >>> advanced:treasury schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:stable schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:bridge schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:predmarket schemas (insert this subsystem's schemas directly below; keep the marker)
    PredictionMarketStatus:
      type: string
      description: >-
        One of DRAFT, OPEN, CLOSED, RESOLVING, RESOLVED, DISPUTED, SETTLED, VOIDED. DRAFT → OPEN → CLOSED →
        RESOLVING → RESOLVED → SETTLED; RESOLVED → DISPUTED → RESOLVED or VOIDED; any state but SETTLED and
        VOIDED → VOIDED. Declared without an enum on purpose: its values are shared with other schemas' enums,
        and a shared enum value renames the generated constants of every schema that holds it.
    PredictionMarketMode:
      type: string
      enum: [PAPER, SANDBOX]
    PredictionActor:
      type: object
      required: [actor_type, actor_id]
      properties:
        actor_type: { type: string }
        actor_id: { type: string }
    PredictionOutcome:
      type: object
      required: [index, symbol, share_asset_id, instrument_id]
      properties:
        index: { type: integer }
        symbol: { type: string }
        share_asset_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID", description: The outcome's EVENT_OUTCOME instrument for the internal order book }
    PredictionMarket:
      type: object
      required: [value_domain, id, symbol, question, mode, status, facility_id, instrument_id, collateral_asset_id, collateral_symbol,
                 collateral_decimals, unit_quantity, share_decimals, outcomes, open_at, close_at, dispute_window_ms, oracle_source,
                 oracle_public_key, definition_hash, created_by, created_at, updated_at]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        symbol: { type: string }
        question: { type: string }
        mode: { $ref: "#/components/schemas/PredictionMarketMode" }
        status: { $ref: "#/components/schemas/PredictionMarketStatus" }
        facility_id: { $ref: "#/components/schemas/UUID", description: The PREDICTION_MARKET facility whose books are the market's escrow }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        collateral_asset_id: { $ref: "#/components/schemas/UUID" }
        collateral_symbol: { type: string }
        collateral_decimals: { type: integer }
        unit_quantity: { $ref: "#/components/schemas/Quantity", description: Collateral base units one complete set costs and one winning share pays }
        share_decimals: { type: integer }
        outcomes: { type: array, items: { $ref: "#/components/schemas/PredictionOutcome" } }
        open_at: { $ref: "#/components/schemas/Timestamp" }
        close_at: { $ref: "#/components/schemas/Timestamp" }
        dispute_window_ms: { type: integer, format: int64 }
        oracle_source: { type: string }
        oracle_public_key: { type: string, description: hex Ed25519 public key the market accepts reports from }
        definition_hash: { type: string, description: hex sha256 of the canonical definition }
        current_resolution_id: { $ref: "#/components/schemas/UUID" }
        created_by: { $ref: "#/components/schemas/PredictionActor" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    PredictionMarketList:
      type: object
      required: [value_domain, status, items]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        status: { $ref: "#/components/schemas/PredictionMarketStatus" }
        items: { type: array, items: { $ref: "#/components/schemas/PredictionMarket" } }
    PredictionResolutionKind:
      type: string
      enum: [ORACLE, DISPUTE_UPHELD, DISPUTE_OVERTURNED]
    PredictionResolution:
      type: object
      required: [id, market_id, kind, outcome_index, outcome_symbol, evidence_ref, evidence_sha256, accepted_by, reason, accepted_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        market_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/PredictionResolutionKind" }
        outcome_index: { type: integer }
        outcome_symbol: { type: string }
        supersedes_id: { $ref: "#/components/schemas/UUID" }
        dispute_id: { $ref: "#/components/schemas/UUID" }
        report_hash: { type: string, description: hex sha256 of the verified report's signed bytes and signature }
        report_source: { type: string }
        report_observed_at: { $ref: "#/components/schemas/Timestamp" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        accepted_by: { $ref: "#/components/schemas/PredictionActor" }
        reason: { type: string }
        accepted_at: { $ref: "#/components/schemas/Timestamp" }
    PredictionDispute:
      type: object
      required: [id, market_id, resolution_id, raised_by, reason, evidence_ref, evidence_sha256, raised_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        market_id: { $ref: "#/components/schemas/UUID" }
        resolution_id: { $ref: "#/components/schemas/UUID" }
        raised_by: { $ref: "#/components/schemas/PredictionActor" }
        reason: { type: string }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        raised_at: { $ref: "#/components/schemas/Timestamp" }
    PredictionSettlementKind:
      type: string
      description: PAYOUT (a resolved market paid its winners) or REFUND (a void refunded every share); no enum, see PredictionMarketStatus
    PredictionRoundingPolicy:
      type: string
      enum: [EXACT, FLOOR_PER_HOLDER]
    PredictionSettlement:
      type: object
      required: [id, market_id, kind, outcome_count, unit_quantity, rounding_policy, escrow_before, total_paid, residual, holder_count,
                 evidence_ref, evidence_sha256, settled_by, settled_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        market_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/PredictionSettlementKind" }
        resolution_id: { $ref: "#/components/schemas/UUID" }
        winning_outcome_index: { type: integer }
        winning_outcome_symbol: { type: string }
        outcome_count: { type: integer }
        unit_quantity: { $ref: "#/components/schemas/Quantity" }
        refund_rate_per_share: { $ref: "#/components/schemas/Quantity" }
        rounding_policy: { $ref: "#/components/schemas/PredictionRoundingPolicy" }
        escrow_before: { $ref: "#/components/schemas/Quantity" }
        total_paid: { $ref: "#/components/schemas/Quantity" }
        residual: { $ref: "#/components/schemas/Quantity", description: "What the escrow keeps; zero after a payout, disclosed after a refund" }
        holder_count: { type: integer }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        settled_by: { $ref: "#/components/schemas/PredictionActor" }
        settled_at: { $ref: "#/components/schemas/Timestamp" }
    PredictionMarketDetail:
      type: object
      required: [value_domain, market, resolutions, disputes]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market: { $ref: "#/components/schemas/PredictionMarket" }
        resolutions: { type: array, items: { $ref: "#/components/schemas/PredictionResolution" }, description: Oldest first }
        disputes: { type: array, items: { $ref: "#/components/schemas/PredictionDispute" }, description: Oldest first }
        settlement: { $ref: "#/components/schemas/PredictionSettlement", description: Absent until the market settles or is voided }
    PredictionBookOutcome:
      type: object
      required: [index, symbol, share_asset_id, shares_issued, shares_outstanding, held_by_customers]
      properties:
        index: { type: integer }
        symbol: { type: string }
        share_asset_id: { $ref: "#/components/schemas/UUID" }
        shares_issued: { $ref: "#/components/schemas/Quantity" }
        shares_outstanding: { $ref: "#/components/schemas/Quantity" }
        held_by_customers: { $ref: "#/components/schemas/Quantity" }
    PredictionEscrowBooks:
      type: object
      required: [value_domain, market_id, market_status, collateral_asset_id, collateral_symbol, collateral_decimals, share_decimals,
                 escrow, collateral, residual, outcomes, reconciles, violations]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market_id: { $ref: "#/components/schemas/UUID" }
        market_status: { $ref: "#/components/schemas/PredictionMarketStatus" }
        collateral_asset_id: { $ref: "#/components/schemas/UUID" }
        collateral_symbol: { type: string }
        collateral_decimals: { type: integer }
        share_decimals: { type: integer }
        escrow: { $ref: "#/components/schemas/Quantity" }
        collateral: { $ref: "#/components/schemas/Quantity" }
        residual: { $ref: "#/components/schemas/Quantity", description: The residual the market's settlement record discloses; zero without one }
        outcomes: { type: array, items: { $ref: "#/components/schemas/PredictionBookOutcome" } }
        reconciles: { type: boolean, description: True when the books satisfy escrow = collateral = outstanding(i) + residual and issued(i) = outstanding(i) = held(i) }
        violations: { type: array, items: { type: string } }
    PredictionPosition:
      type: object
      required: [outcome_index, outcome_symbol, share_asset_id, quantity, as_of]
      properties:
        outcome_index: { type: integer }
        outcome_symbol: { type: string }
        share_asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        as_of: { $ref: "#/components/schemas/Timestamp" }
    PredictionPositionList:
      type: object
      required: [value_domain, market_id, account_id, share_decimals, items]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        share_decimals: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/PredictionPosition" } }
    PredictionSetRequest:
      type: object
      required: [account_id, quantity]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity", description: "Complete sets in share base units, a positive multiple of the market's unit_quantity" }
    PredictionSetAction:
      type: string
      enum: [ISSUE, REDEEM]
    PredictionSetResult:
      type: object
      required: [value_domain, market_id, account_id, action, quantity, replay, intent]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        action: { $ref: "#/components/schemas/PredictionSetAction" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        replay: { type: boolean, description: True when the economic intent already existed; nothing new happened }
        intent: { $ref: "#/components/schemas/EconomicIntent" }
        effect: { $ref: "#/components/schemas/EconomicEffect" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        risk_decision_hash: { type: string }
    CreatePredictionMarketRequest:
      type: object
      required: [symbol, question, outcomes, mode, open_at, close_at, dispute_window_ms, oracle_source, oracle_public_key]
      properties:
        symbol: { type: string, description: "1..32 of A-Z 0-9 _ -, starting alphanumeric" }
        question: { type: string }
        outcomes: { type: array, items: { type: string }, description: "2..64 distinct symbols of 1..24 of A-Z 0-9 _ -" }
        mode: { $ref: "#/components/schemas/PredictionMarketMode" }
        open_at: { $ref: "#/components/schemas/Timestamp" }
        close_at: { $ref: "#/components/schemas/Timestamp" }
        dispute_window_ms: { type: integer, format: int64, description: Whole milliseconds within 0..30 days }
        oracle_source: { type: string }
        oracle_public_key: { type: string, description: hex Ed25519 public key (64 hex characters) }
    PredictionOracle:
      type: object
      required: [kind, source, public_key]
      properties:
        kind: { type: string, enum: [SANDBOX] }
        source: { type: string }
        public_key: { type: string, description: hex Ed25519 public key }
    PredictionOracleObservationRequest:
      type: object
      required: [outcome, observed_at, evidence]
      properties:
        outcome: { type: string }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
        evidence: { type: string, description: The source document the oracle saw (1..16384 bytes); its sha256 is signed }
    PredictionOracleReport:
      type: object
      required: [market_id, outcome, source, observed_at, evidence, signature]
      properties:
        market_id: { type: string }
        outcome: { type: string }
        source: { type: string }
        observed_at: { type: string, description: RFC 3339 in UTC }
        evidence: { type: string, description: standard base64 }
        signature: { type: string, description: standard base64 Ed25519 signature }
    PredictionOracleObservation:
      type: object
      required: [value_domain, report, report_hash]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        report: { $ref: "#/components/schemas/PredictionOracleReport" }
        report_hash: { type: string }
    PredictionResolveRequest:
      type: object
      properties:
        reason: { type: string }
    PredictionResolutionResult:
      type: object
      required: [value_domain, market, resolution, replay]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market: { $ref: "#/components/schemas/PredictionMarket" }
        resolution: { $ref: "#/components/schemas/PredictionResolution" }
        replay: { type: boolean, description: True when the report had already been accepted; nothing changed }
    PredictionDisputeRequest:
      type: object
      required: [reason, evidence]
      properties:
        reason: { type: string, description: 8..2000 characters }
        evidence: { type: object, additionalProperties: true }
    PredictionDisputeResult:
      type: object
      required: [value_domain, market, dispute]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market: { $ref: "#/components/schemas/PredictionMarket" }
        dispute: { $ref: "#/components/schemas/PredictionDispute" }
    PredictionRulingRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: 8..2000 characters }
        evidence: { type: object, additionalProperties: true }
    PredictionVoidRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: 8..2000 characters }
        evidence: { type: object, additionalProperties: true }
    PredictionShareCount:
      type: object
      required: [outcome_symbol, quantity]
      properties:
        outcome_symbol: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
    PredictionPayoutLine:
      type: object
      required: [account_id, amount, shares, intent_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        amount: { $ref: "#/components/schemas/Quantity" }
        shares: { type: array, items: { $ref: "#/components/schemas/PredictionShareCount" } }
        intent_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
    PredictionSettlementResult:
      type: object
      required: [value_domain, market, settlement, lines, replay]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market: { $ref: "#/components/schemas/PredictionMarket" }
        settlement: { $ref: "#/components/schemas/PredictionSettlement" }
        lines: { type: array, items: { $ref: "#/components/schemas/PredictionPayoutLine" }, description: "What this call paid, one line per holder; empty on a replay" }
        replay: { type: boolean, description: True when the market had already settled (or been voided); nothing was paid }
    PredictionEscrowReconciliation:
      type: object
      required: [value_domain, id, kind, mode, scope_type, scope_id, status, material, blocks_new_risk, expected, observed, difference, opened_at]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string, description: PREDICTION_ESCROW }
        mode: { type: string, description: "EVENT_DRIVEN, PERIODIC or FULL" }
        scope_type: { type: string }
        scope_id: { type: string }
        status: { type: string, description: "OPEN, MATCHED, MISMATCH, INVESTIGATING, RESOLVED_AUTOMATIC, RESOLVED_MANUAL or ESCALATED" }
        material: { type: boolean }
        blocks_new_risk: { type: boolean }
        expected: { type: object, additionalProperties: true }
        observed: { type: object, additionalProperties: true }
        difference: { type: object, additionalProperties: true }
        opened_at: { $ref: "#/components/schemas/Timestamp" }
        matched_at: { $ref: "#/components/schemas/Timestamp" }

