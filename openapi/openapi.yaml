        status: { $ref: "#/components/schemas/MarginAccountStatus" }
        evaluation: { $ref: "#/components/schemas/MarginEvaluation" }
    MarginLeveragedBuyResult:
      type: object
      required: [value_domain, margin_account_id, intent_id, cost, borrow_journal_transaction_id, trade_journal_transaction_id,
                 collateral_journal_transaction_id, replayed, status]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        intent_id: { $ref: "#/components/schemas/UUID" }
        lot_id: { $ref: "#/components/schemas/UUID" }
        mark: { $ref: "#/components/schemas/MarginPrice" }
        execution_price: { $ref: "#/components/schemas/MarginPrice", description: "mark × (1 + slippage_bps)" }
        slippage_bps: { $ref: "#/components/schemas/BPS" }
        cost: { $ref: "#/components/schemas/Quantity", description: "numeraire base units borrowed: quantity × execution price, rounded up" }
        borrow_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        trade_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        collateral_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        reservation_id: { $ref: "#/components/schemas/UUID" }
        replayed: { type: boolean }
        status: { $ref: "#/components/schemas/MarginAccountStatus" }
        evaluation: { $ref: "#/components/schemas/MarginEvaluation" }
    MarginFacility:
      type: object
      required: [id, kind, name, status, available]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string }
        name: { type: string }
        status: { type: string }
        available: { $ref: "#/components/schemas/Quantity", description: "sandbox-dollar base units the facility holds unlent (lending pool) or undrawn (insurance fund)" }
    MarginFacilities:
      type: object
      required: [value_domain, asset_id, asset_decimals, lending_pool, insurance_fund]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_decimals: { type: integer }
        lending_pool: { $ref: "#/components/schemas/MarginFacility" }
        insurance_fund: { $ref: "#/components/schemas/MarginFacility" }
    MarginFailure:
      type: object
      required: [code, detail]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        code: { type: string }
        detail: { type: string }
    MarginEvaluated:
      type: object
      required: [margin_account_id, account_id, previous_status, status, evaluation]
      properties:
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        previous_status: { $ref: "#/components/schemas/MarginAccountStatus" }
        status: { $ref: "#/components/schemas/MarginAccountStatus" }
        evaluation: { $ref: "#/components/schemas/MarginEvaluation" }
        call: { $ref: "#/components/schemas/MarginCall" }
    MarginMarkToMarketResult:
      type: object
      required: [value_domain, evaluated, failures]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        evaluated: { type: array, items: { $ref: "#/components/schemas/MarginEvaluated" } }
        failures: { type: array, items: { $ref: "#/components/schemas/MarginFailure" } }
    MarginQueueEntry:
      type: object
      required: [account, numeraire_decimals]
      properties:
        account: { $ref: "#/components/schemas/MarginAccount" }
        numeraire_decimals: { type: integer }
        evaluation: { $ref: "#/components/schemas/MarginEvaluation" }
        evaluation_error: { $ref: "#/components/schemas/MarginFailure" }
        open_call: { $ref: "#/components/schemas/MarginCall" }
        latest_case: { $ref: "#/components/schemas/MarginCase" }
    MarginQueue:
      type: object
      required: [value_domain, items]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        items: { type: array, items: { $ref: "#/components/schemas/MarginQueueEntry" } }
    MarginLiquidationOrder:
      type: object
      required: [action, asset_id, quantity, slippage_bps, proceeds, fee, repay, excess]
      properties:
        action: { $ref: "#/components/schemas/MarginStepAction" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        mark: { $ref: "#/components/schemas/MarginPrice" }
        execution_price: { $ref: "#/components/schemas/MarginPrice" }
        slippage_bps: { $ref: "#/components/schemas/BPS" }
        proceeds: { $ref: "#/components/schemas/Quantity" }
        fee: { $ref: "#/components/schemas/Quantity" }
        repay: { $ref: "#/components/schemas/Quantity" }
        excess: { $ref: "#/components/schemas/Quantity" }
    MarginPlan:
      type: object
      required: [decision, reason, target, steps_taken, target_units, deficit_units, hash, orders]
      properties:
        decision: { $ref: "#/components/schemas/MarginPlanDecision" }
        reason: { type: string }
        target: { $ref: "#/components/schemas/MarginLiquidationTarget" }
        steps_taken: { type: integer }
        target_units: { $ref: "#/components/schemas/Quantity" }
        deficit_units: { $ref: "#/components/schemas/Quantity" }
        hash: { type: string }
        orders: { type: array, items: { $ref: "#/components/schemas/MarginLiquidationOrder" } }
    MarginLiquidationResult:
      type: object
      required: [value_domain, margin_account_id, account_id, eligible, decision, reason, account_status, numeraire_decimals, replayed]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        margin_account_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        eligible: { type: boolean, description: "false when the account needed no liquidation and no case was opened" }
        decision: { $ref: "#/components/schemas/MarginPlanDecision" }
        reason: { type: string }
        account_status: { $ref: "#/components/schemas/MarginAccountStatus" }
        numeraire_decimals: { type: integer }
        case: { $ref: "#/components/schemas/MarginCase" }
        step: { $ref: "#/components/schemas/MarginLiquidationStep" }
        plan: { $ref: "#/components/schemas/MarginPlan" }
        replayed: { type: boolean }
    MarginQueueRunResult:
      type: object
      required: [value_domain, results, failures]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        results: { type: array, items: { $ref: "#/components/schemas/MarginLiquidationResult" } }
        failures: { type: array, items: { $ref: "#/components/schemas/MarginFailure" } }
    MarginDeficitResult:
      type: object
      required: [value_domain, case_id, deficit, journal_transaction_id, replayed, case]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        case_id: { $ref: "#/components/schemas/UUID" }
        deficit: { $ref: "#/components/schemas/Quantity" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        replayed: { type: boolean }
        case: { $ref: "#/components/schemas/MarginCase" }

    # >>> advanced:derivatives schemas (insert this subsystem's schemas directly below; keep the marker)
    #
    # Futures, perpetuals and options (internal/derivatives). The enums carry
    # x-enum-varnames so their Go constants never collide with another
    # schema's (OPEN, PAPER, CALL and BUY already exist unprefixed).
    DerivativeKind:
      type: string
      enum: [FUTURE, PERPETUAL, OPTION]
      x-enum-varnames: [DerivativeKindFuture, DerivativeKindPerpetual, DerivativeKindOption]
    DerivativeSide:
      type: string
      enum: [LONG, SHORT]
      x-enum-varnames: [DerivativeSideLong, DerivativeSideShort]
    DerivativePositionStatus:
      type: string
      enum: [OPEN, CLOSED, SETTLED]
      x-enum-varnames: [DerivativePositionOpen, DerivativePositionClosed, DerivativePositionSettled]
    DerivativeFlowKind:
      type: string
      enum: [REALIZED, VARIATION_MARGIN, FUNDING, FUTURE_SETTLEMENT, OPTION_PREMIUM, OPTION_EXERCISE, OPTION_ASSIGNMENT]
      x-enum-varnames: [DerivativeFlowRealized, DerivativeFlowVariationMargin, DerivativeFlowFunding, DerivativeFlowFutureSettlement,
                        DerivativeFlowOptionPremium, DerivativeFlowOptionExercise, DerivativeFlowOptionAssignment]
    DerivativeFundingDirection:
      type: string
      enum: [PAY, RECEIVE]
      x-enum-varnames: [DerivativeFundingPay, DerivativeFundingReceive]
    DerivativeFillSide:
      type: string
      enum: [BUY, SELL]
      x-enum-varnames: [DerivativeFillBuy, DerivativeFillSell]
    DerivativeFillSource:
      type: string
      enum: [PAPER, BOOK, EXERCISE, ASSIGNMENT, EXPIRY]
      x-enum-varnames: [DerivativeFillSourcePaper, DerivativeFillSourceBook, DerivativeFillSourceExercise,
                        DerivativeFillSourceAssignment, DerivativeFillSourceExpiry]
    DerivativeSettlementKind:
      type: string
      enum: [FUTURE, OPTION]
      x-enum-varnames: [DerivativeSettlementFuture, DerivativeSettlementOption]
    DerivativeValuationStatus:
      type: string
      description: >-
        VALUED: valuation is present. REFUSED: the service could not value the
        account's open book and valuation_refusal says why; no figure is given
        in its place. NOT_APPLICABLE: the position is not open. NOT_COMPUTED:
        this answer (a trade result) does not value the position; read it to.
      enum: [VALUED, REFUSED, NOT_APPLICABLE, NOT_COMPUTED]
      x-enum-varnames: [DerivativeValuationValued, DerivativeValuationRefused, DerivativeValuationNotApplicable,
                        DerivativeValuationNotComputed]
    DerivativeBookStatus:
      type: string
      enum: [VALUED, REFUSED]
      x-enum-varnames: [DerivativeBookValued, DerivativeBookRefused]
    DerivativeRunKind:
      type: string
      enum: [VARIATION_MARGIN, FUNDING]
      x-enum-varnames: [DerivativeRunVariationMargin, DerivativeRunFunding]
    DerivativeDecimal:
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?$'
      description: A non-negative decimal written out exactly. It is never rounded; one that is not exact where it is used is refused.
      examples: ["2500.50"]
    DerivativeModelDecimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: A model value as an exact decimal string (rounded half-even to 18 places by the model where it says so)
    DerivativeAsset:
      type: object
      description: The asset amounts are counted in, so base units can be read as the decimal they denote.
      required: [id, symbol, decimals]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        symbol: { type: string }
        decimals: { type: integer }
    DerivativeRefusal:
      type: object
      required: [code, detail]
      properties:
        code: { type: string, description: The stable code the service refused with }
        detail: { type: string }
    DerivativeClassRates:
      type: object
      required: [risk_class, initial_bps, maintenance_bps]
      properties:
        risk_class: { type: string }
        initial_bps: { type: integer, format: int64 }
        maintenance_bps: { type: integer, format: int64 }
    DerivativePolicy:
      type: object
      required: [version, hash, linear, funding_buffer_intervals, max_funding_rate_e8, funding_rate_scale, option_shocks_bps,
                 option_min_margin_bps, option_maintenance_ratio_bps, expiry_gap_window_ms, expiry_gap_shock_bps,
                 paper_slippage_bps, variation_margin_interval_ms]
      properties:
        version: { type: string }
        hash: { type: string, description: hex sha256 of the policy's canonical JSON }
        linear:
          type: array
          description: Initial and maintenance rates of futures and perpetuals by the underlying's risk class; an unlisted class cannot be traded
          items: { $ref: "#/components/schemas/DerivativeClassRates" }
        funding_buffer_intervals: { type: integer, format: int64 }
        max_funding_rate_e8: { type: integer, format: int64, description: Funding is clamped to plus or minus this many 10^-8 per interval }
        funding_rate_scale: { type: integer, format: int64, description: "The denominator of every *_e8 rate (10^8)" }
        option_shocks_bps:
          type: array
          description: The scenario grid a written option's worst loss is computed over
          items: { type: integer, format: int64 }
        option_min_margin_bps: { type: integer, format: int64 }
        option_maintenance_ratio_bps: { type: integer, format: int64 }
        expiry_gap_window_ms: { type: integer, format: int64 }
        expiry_gap_shock_bps: { type: integer, format: int64 }
        paper_slippage_bps: { type: integer, format: int64, description: A paper buy fills this far above the mark and a sell this far below, then onto the tick grid against the customer }
        variation_margin_interval_ms: { type: integer, format: int64 }
    DerivativeMark:
      type: object
      required: [value_domain, id, instrument_id, mark_mantissa, price_scale, has_index, source, observed_at, recorded_at]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        mark_mantissa: { $ref: "#/components/schemas/Quantity" }
        price_scale: { type: integer, description: The mark is mark_mantissa at this many decimal places (the contract's price scale) }
        has_index: { type: boolean, description: False when the mark was recorded without an index (the underlying's spot) }
        index_mantissa: { $ref: "#/components/schemas/Quantity" }
        index_scale: { type: integer }
        index_source: { type: string }
        source: { type: string }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
        recorded_at: { $ref: "#/components/schemas/Timestamp" }
    DerivativeMarkPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items, value_domain]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/DerivativeMark" } }
    DerivativeMarkRequest:
      type: object
      required: [mark, source]
      properties:
        mark: { $ref: "#/components/schemas/DerivativeDecimal" }
        index: { $ref: "#/components/schemas/DerivativeDecimal" }
        source: { type: string, minLength: 1, maxLength: 100 }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
    DerivativeSettlement:
      type: object
      required: [id, kind, price_mantissa, price_scale, price_source, positions, settled_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/DerivativeSettlementKind" }
        price_mantissa: { $ref: "#/components/schemas/Quantity", description: "A future's final price, or the underlying's price an option settled at" }
        price_scale: { type: integer }
        price_source: { type: string }
        positions: { type: integer }
        settled_at: { $ref: "#/components/schemas/Timestamp" }
    DerivativeContract:
      type: object
      required: [value_domain, id, kind, canonical_name, status, risk_class, terms_version, terms_hash, terms, settlement_asset, marked, settled]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/DerivativeKind" }
        canonical_name: { type: string }
        status: { type: string }
        risk_class: { type: string }
        terms_version: { type: integer }
        terms_hash: { type: string, description: hex sha256 of the canonical terms in force }
        terms: { $ref: "#/components/schemas/InstrumentTerms" }
        settlement_asset: { $ref: "#/components/schemas/DerivativeAsset" }
        marked: { type: boolean, description: False when the contract has never been marked; latest_mark is then absent }
        latest_mark: { $ref: "#/components/schemas/DerivativeMark" }
        settled: { type: boolean, description: True once the contract has been finally settled; settlement is then present }
        settlement: { $ref: "#/components/schemas/DerivativeSettlement" }
    DerivativeContractList:
      type: object
      required: [value_domain, items]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        items: { type: array, items: { $ref: "#/components/schemas/DerivativeContract" } }
    DerivativeRequirement:
      type: object
      description: The margin requirement at the mark, in base units of the settlement asset (every rounding up)
      required: [notional, initial, maintenance, scenario_loss, funding_buffer]
      properties:
        notional: { $ref: "#/components/schemas/Quantity" }
        initial: { $ref: "#/components/schemas/Quantity" }
        maintenance: { $ref: "#/components/schemas/Quantity" }
        scenario_loss: { $ref: "#/components/schemas/Quantity" }
        funding_buffer: { $ref: "#/components/schemas/Quantity" }
    DerivativePositionValuation:
      type: object
      required: [mark_id, mark_mantissa, mark_observed_at, average_entry_price_mantissa, unrealized_pnl, equity_adjustment, requirement]
      properties:
        mark_id: { $ref: "#/components/schemas/UUID" }
        mark_mantissa: { $ref: "#/components/schemas/Quantity" }
        mark_observed_at: { $ref: "#/components/schemas/Timestamp" }
        average_entry_price_mantissa: { $ref: "#/components/schemas/Quantity", description: "Exact cost over quantity at the price scale, rounded half-even once (display only)" }
        unrealized_pnl: { $ref: "#/components/schemas/Quantity", description: "Quantity times the contract value at the mark, less the cost value" }
        equity_adjustment: { $ref: "#/components/schemas/Quantity", description: What the position adds to equity beyond the ledger balances buying power counts }
        requirement: { $ref: "#/components/schemas/DerivativeRequirement" }
    DerivativePosition:
      type: object
      required: [id, account_id, instrument_id, symbol, kind, status, quantity, price_scale, settlement_asset, cost_value, settled_value,
                 realized_pnl, funding_pnl, margin_posted, shortfall, version, opened_at, valuation_status]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        symbol: { type: string }
        kind: { $ref: "#/components/schemas/DerivativeKind" }
        status: { $ref: "#/components/schemas/DerivativePositionStatus" }
        side: { $ref: "#/components/schemas/DerivativeSide", description: Absent once the position is flat }
        quantity: { $ref: "#/components/schemas/Quantity", description: "Signed contracts: long > 0, short < 0" }
        price_scale: { type: integer }
        settlement_asset: { $ref: "#/components/schemas/DerivativeAsset" }
        cost_value: { $ref: "#/components/schemas/Quantity" }
        settled_value: { $ref: "#/components/schemas/Quantity" }
        realized_pnl: { $ref: "#/components/schemas/Quantity" }
        funding_pnl: { $ref: "#/components/schemas/Quantity", description: "Funding received (> 0) or paid (< 0) over the position's life" }
        margin_posted: { $ref: "#/components/schemas/Quantity" }
        shortfall: { $ref: "#/components/schemas/Quantity" }
        version: { type: integer, format: int64 }
        opened_at: { $ref: "#/components/schemas/Timestamp" }
        closed_at: { $ref: "#/components/schemas/Timestamp" }
        valuation_status: { $ref: "#/components/schemas/DerivativeValuationStatus" }
        valuation: { $ref: "#/components/schemas/DerivativePositionValuation" }
        valuation_refusal: { $ref: "#/components/schemas/DerivativeRefusal" }
    DerivativeBook:
      type: object
      description: The account's open derivative book as the service values it, in USD of the valuation asset with conservative rounding
      required: [as_of, policy_version, policy_hash, quote_asset, gross_notional, initial_margin, maintenance_margin, unrealized_pnl,
                 equity_adjustment, max_initial_bps, positions]
      properties:
        as_of: { $ref: "#/components/schemas/Timestamp" }
        policy_version: { type: string }
        policy_hash: { type: string }
        quote_asset: { $ref: "#/components/schemas/DerivativeAsset" }
        gross_notional: { $ref: "#/components/schemas/USD" }
        initial_margin: { $ref: "#/components/schemas/USD" }
        maintenance_margin: { $ref: "#/components/schemas/USD" }
        unrealized_pnl: { $ref: "#/components/schemas/USD" }
        equity_adjustment: { $ref: "#/components/schemas/USD" }
        max_initial_bps: { type: integer, format: int64 }
        positions: { type: integer, description: Open positions valued }
    DerivativePositionPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items, value_domain, book_status]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/DerivativePosition" } }
            book_status: { $ref: "#/components/schemas/DerivativeBookStatus" }
            book: { $ref: "#/components/schemas/DerivativeBook" }
            book_refusal: { $ref: "#/components/schemas/DerivativeRefusal" }
    DerivativeOpenRequest:
      type: object
      required: [account_id, instrument_id, side, quantity, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        side: { $ref: "#/components/schemas/DerivativeSide" }
        quantity: { $ref: "#/components/schemas/Quantity", description: Contracts; positive and a whole number of lots }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
    DerivativeCloseRequest:
      type: object
      required: [mode]
      properties:
        quantity: { $ref: "#/components/schemas/Quantity", description: Contracts to close; absent closes the position }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
    DerivativeExerciseRequest:
      type: object
      required: [mode]
      properties:
        quantity: { $ref: "#/components/schemas/Quantity", description: Contracts to exercise; absent exercises every one held }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
    DerivativeFill:
      type: object
      required: [id, position_id, account_id, instrument_id, source, side, quantity, price_mantissa, price_scale, value, realized_pnl,
                 amount_settled, slippage_bps, occurred_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        position_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        source: { $ref: "#/components/schemas/DerivativeFillSource" }
        side: { $ref: "#/components/schemas/DerivativeFillSide" }
        quantity: { $ref: "#/components/schemas/Quantity", description: Signed contracts the fill moved the position by }
        price_mantissa: { $ref: "#/components/schemas/Quantity" }
        price_scale: { type: integer }
        value: { $ref: "#/components/schemas/Quantity" }
        realized_pnl: { $ref: "#/components/schemas/Quantity" }
        amount_settled: { $ref: "#/components/schemas/Quantity", description: "What the customer received (> 0) or paid (< 0) the clearing house for this fill" }
        mark_id: { $ref: "#/components/schemas/UUID" }
        slippage_bps: { type: integer, format: int64 }
        intent_id: { $ref: "#/components/schemas/UUID" }
        risk_decision_id: { $ref: "#/components/schemas/UUID" }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
    DerivativeTradeResult:
      type: object
      required: [value_domain, intent, replay, journal_transaction_ids]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        intent: { $ref: "#/components/schemas/EconomicIntent" }
        replay: { type: boolean, description: True when the service had already carried out this idempotency key; nothing was written this time }
        risk_decision_id: { $ref: "#/components/schemas/UUID" }
        fill: { $ref: "#/components/schemas/DerivativeFill" }
        position: { $ref: "#/components/schemas/DerivativePosition" }
        exercise_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
    DerivativeFlow:
      type: object
      required: [id, position_id, account_id, instrument_id, symbol, kind, amount, shortfall, settlement_asset, reference_type, reference_id, occurred_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        position_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        symbol: { type: string }
        kind: { $ref: "#/components/schemas/DerivativeFlowKind" }
        amount: { $ref: "#/components/schemas/Quantity", description: "Signed from the customer's side: > 0 received from the clearing house, < 0 paid to it" }
        shortfall: { $ref: "#/components/schemas/Quantity", description: What the customer owed and could not pay; the clearing house absorbed it }
        settlement_asset: { $ref: "#/components/schemas/DerivativeAsset" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        reference_type: { type: string }
        reference_id: { type: string }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
    DerivativeFlowPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
