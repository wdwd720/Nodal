    # >>> advanced:margin schemas (insert this subsystem's schemas directly below; keep the marker)
    MarginMode:
      type: string
      enum: [CASH, ISOLATED, CROSS]
      description: CASH takes no leverage; ISOLATED margins one risky asset; CROSS shares the collateral across positions.
    MarginAccountStatus:
      type: string
      enum: [NORMAL, WARNING, MARGIN_CALL, LIQUIDATING, BANKRUPT, CLOSED]
    MarginCallStatus:
      type: string
      enum: [OPEN, MET, LIQUIDATED]
    MarginCaseStatus:
      type: string
      enum: [AWAITING_PRICE, AWAITING_VENUE, IN_PROGRESS, COMPLETED, BANKRUPT, MANUAL_REVIEW]
    MarginLiquidationTarget:
      type: string
      enum: [INITIAL_MARGIN, MAINTENANCE_PLUS_BUFFER]
    MarginPlanDecision:
      type: string
      enum: [COMPLETE, AWAIT_PRICE, AWAIT_VENUE, SELL, SELL_ALL, APPLY_COLLATERAL, BANKRUPT, MANUAL_REVIEW]
    MarginStepAction:
      type: string
      enum: [SELL, APPLY_COLLATERAL]
    MarginStressScenario:
      type: string
      enum: [GAP_DOWN_5, GAP_DOWN_10, GAP_DOWN_25, GAP_DOWN_50, GAP_UP_5, GAP_UP_10, GAP_UP_25, GAP_UP_50,
             ORACLE_UNAVAILABLE, VENUE_UNAVAILABLE, PARTIAL_FILL, EXTREME_SPREAD, BRIDGE_DELAYED, COLLATERAL_DEPEG]
    MarginPrice:
      type: object
      required: [mantissa, scale]
      description: The price of one whole unit in the numeraire, exactly mantissa × 10^-scale.
      properties:
        mantissa: { $ref: "#/components/schemas/Quantity" }
        scale: { type: integer }
        source: { type: string }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
    MarginOpenRequest:
      type: object
      required: [account_id, margin_mode, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        margin_mode: { $ref: "#/components/schemas/MarginMode" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        isolated_asset_id: { $ref: "#/components/schemas/UUID" }
    MarginAccountRef:
      type: object
      required: [account_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
    MarginCollateralRequest:
      type: object
      required: [account_id, asset_id, quantity]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
    MarginAmountRequest:
      type: object
      required: [account_id, amount]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        amount: { $ref: "#/components/schemas/Quantity" }
    MarginLeveragedBuyRequest:
      type: object
      required: [account_id, asset_id, quantity]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
    MarginSeedRequest:
      type: object
      required: [pool_amount, fund_amount]
      properties:
        pool_amount: { $ref: "#/components/schemas/Quantity" }
        fund_amount: { $ref: "#/components/schemas/Quantity" }
    MarginBatchRequest:
      type: object
      properties:
        limit: { type: integer, minimum: 1 }
    MarginLiquidateRequest:
      type: object
      required: [account_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        expected_step: { type: integer, minimum: 0, description: "The step meant (1 for the first); 0 or absent means whatever step is next. A step already executed is returned, not repeated." }
    MarginAccount:
      type: object
      required: [value_domain, id, account_id, margin_mode, mode, status, policy_version, numeraire_asset_id, lending_pool_id,
                 insurance_fund_id, opened_at]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        margin_mode: { $ref: "#/components/schemas/MarginMode" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        status: { $ref: "#/components/schemas/MarginAccountStatus" }
        policy_version: { type: string }
        numeraire_asset_id: { $ref: "#/components/schemas/UUID" }
        isolated_asset_id: { $ref: "#/components/schemas/UUID" }
        lending_pool_id: { $ref: "#/components/schemas/UUID" }
        insurance_fund_id: { $ref: "#/components/schemas/UUID" }
        opened_at: { $ref: "#/components/schemas/Timestamp" }
    MarginHaircut:
      type: object
      required: [volatility_bps, liquidity_bps, oracle_bps, venue_bps, concentration_bps, settlement_bps, cross_chain_bps, zero_value, total_bps]
      properties:
        volatility_bps: { $ref: "#/components/schemas/BPS" }
        liquidity_bps: { $ref: "#/components/schemas/BPS" }
        oracle_bps: { $ref: "#/components/schemas/BPS" }
        venue_bps: { $ref: "#/components/schemas/BPS" }
        concentration_bps: { $ref: "#/components/schemas/BPS" }
        settlement_bps: { $ref: "#/components/schemas/BPS" }
        cross_chain_bps: { $ref: "#/components/schemas/BPS" }
        zero_value: { type: boolean, description: "A stale, missing or future mark (or a delayed bridge) makes the collateral worthless." }
        total_bps: { $ref: "#/components/schemas/BPS" }
    MarginHolding:
      type: object
      required: [asset_id, numeraire, quantity, market_value, priced, fresh, concentration_share_bps, haircut, collateral_value,
                 exposure, initial_margin, maintenance_margin]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        numeraire: { type: boolean }
        quantity: { $ref: "#/components/schemas/Quantity", description: "base units of the asset" }
        market_value: { $ref: "#/components/schemas/Quantity" }
        priced: { type: boolean }
        fresh: { type: boolean }
        mark_at: { $ref: "#/components/schemas/Timestamp" }
        mark: { $ref: "#/components/schemas/MarginPrice", description: "the mark the evaluation used; present on reads" }
        concentration_share_bps: { $ref: "#/components/schemas/BPS" }
        haircut: { $ref: "#/components/schemas/MarginHaircut" }
        collateral_value: { $ref: "#/components/schemas/Quantity" }
        exposure: { $ref: "#/components/schemas/Quantity" }
        initial_margin: { $ref: "#/components/schemas/Quantity" }
        maintenance_margin: { $ref: "#/components/schemas/Quantity" }
    MarginEvaluationUSD:
      type: object
      description: The engine's cent rendering, rounded so the account can only look less healthy (assets and equity down, liabilities and requirements up).
      required: [eligible_collateral, borrow_liabilities, accrued_interest, equity, market_value, gross_exposure, initial_margin,
                 maintenance_margin, warning_threshold, margin_available, liquidation_buffer]
      properties:
        eligible_collateral: { $ref: "#/components/schemas/USD" }
        borrow_liabilities: { $ref: "#/components/schemas/USD" }
        accrued_interest: { $ref: "#/components/schemas/USD" }
        equity: { $ref: "#/components/schemas/USD" }
        market_value: { $ref: "#/components/schemas/USD" }
        gross_exposure: { $ref: "#/components/schemas/USD" }
        initial_margin: { $ref: "#/components/schemas/USD" }
        maintenance_margin: { $ref: "#/components/schemas/USD" }
        warning_threshold: { $ref: "#/components/schemas/USD" }
        margin_available: { $ref: "#/components/schemas/USD" }
        liquidation_buffer: { $ref: "#/components/schemas/USD" }
    MarginEvaluation:
      type: object
      description: >-
        The margin engine's deterministic evaluation. equity = eligible_collateral + realized_pnl + unrealized_pnl
        − borrow_liabilities − accrued_fees − accrued_interest; liquidation_buffer = equity − maintenance_margin
        (negative once eligible for liquidation). Quantities are numeraire base units.
      required: [at, policy_version, policy_hash, hash, numeraire_asset_id, numeraire_decimals, health, levered, liquidation_eligible,
                 prices_fresh, missing_marks, stale_assets, leverage_cap_bps, effective_leverage_bps, leverage_unbounded,
                 eligible_collateral, realized_pnl, unrealized_pnl, borrow_liabilities, accrued_fees, accrued_interest, equity,
                 market_value, net_asset_value, gross_exposure, net_exposure, initial_margin, maintenance_margin, warning_threshold,
                 liquidation_buffer, capacity, margin_available, usd, holdings]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        policy_version: { type: string }
        policy_hash: { type: string }
        hash: { type: string }
        numeraire_asset_id: { $ref: "#/components/schemas/UUID" }
        numeraire_decimals: { type: integer }
        health: { $ref: "#/components/schemas/MarginAccountStatus" }
        levered: { type: boolean }
        liquidation_eligible: { type: boolean }
        prices_fresh: { type: boolean }
        missing_marks: { type: boolean }
        stale_assets: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        oldest_mark_at: { $ref: "#/components/schemas/Timestamp" }
        newest_mark_at: { $ref: "#/components/schemas/Timestamp" }
        leverage_cap_bps: { type: integer, format: int64, description: "basis points of gross exposure over equity (50000 = 5x)" }
        effective_leverage_bps: { type: integer, format: int64, description: "basis points, rounded up" }
        leverage_unbounded: { type: boolean }
        eligible_collateral: { $ref: "#/components/schemas/Quantity" }
        realized_pnl: { $ref: "#/components/schemas/Quantity" }
        unrealized_pnl: { $ref: "#/components/schemas/Quantity" }
        borrow_liabilities: { $ref: "#/components/schemas/Quantity" }
        accrued_fees: { $ref: "#/components/schemas/Quantity" }
        accrued_interest: { $ref: "#/components/schemas/Quantity" }
        equity: { $ref: "#/components/schemas/Quantity" }
        market_value: { $ref: "#/components/schemas/Quantity" }
        net_asset_value: { $ref: "#/components/schemas/Quantity" }
        gross_exposure: { $ref: "#/components/schemas/Quantity" }
        net_exposure: { $ref: "#/components/schemas/Quantity" }
        initial_margin: { $ref: "#/components/schemas/Quantity" }
        maintenance_margin: { $ref: "#/components/schemas/Quantity" }
        warning_threshold: { $ref: "#/components/schemas/Quantity" }
        liquidation_buffer: { $ref: "#/components/schemas/Quantity" }
        capacity: { $ref: "#/components/schemas/Quantity" }
        margin_available: { $ref: "#/components/schemas/Quantity" }
        usd: { $ref: "#/components/schemas/MarginEvaluationUSD" }
        holdings: { type: array, items: { $ref: "#/components/schemas/MarginHolding" } }
    MarginLoan:
      type: object
      required: [lot_id, principal, interest, rate_bps, accrued_through]
      properties:
        lot_id: { $ref: "#/components/schemas/UUID" }
        principal: { $ref: "#/components/schemas/Quantity", description: "outstanding principal" }
        interest: { $ref: "#/components/schemas/Quantity", description: "interest posted (capitalized) and not yet repaid" }
        rate_bps: { type: integer, format: int64, description: "annual simple rate" }
        accrued_through: { $ref: "#/components/schemas/Timestamp" }
    MarginCall:
      type: object
      required: [id, margin_account_id, account_id, status, issued_at, equity, maintenance_margin, deficiency, evaluation_hash,
