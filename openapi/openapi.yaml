        limits: { $ref: "#/components/schemas/TreasuryLimitEvaluation" }
        input_hash: { type: string }
        decision_hash: { type: string }
        risk_policy_version: { type: string }
        evaluator_version: { type: string }
        treasury_policy_version: { type: integer }
        treasury_policy_hash: { type: string }
