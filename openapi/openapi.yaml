                 status, evidence_ref, booked_at, spread_line]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        disclosure_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        booking_mode: { $ref: "#/components/schemas/FeeBookingMode" }
        journal_kind: { type: string }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        intent_id: { $ref: "#/components/schemas/UUID" }
        charges: { $ref: "#/components/schemas/FeeCharges" }
        status: { $ref: "#/components/schemas/FeeBookingStatus" }
        evidence_ref: { type: string }
        booked_at: { $ref: "#/components/schemas/Timestamp" }
        reversal_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        reversal_effect_id: { $ref: "#/components/schemas/UUID" }
        reversal_reason_code: { type: string }
        reversed_at: { $ref: "#/components/schemas/Timestamp" }
        spread_line: { $ref: "#/components/schemas/FeeSpreadLine" }
    FeeBookingDetail:
      allOf:
        - { $ref: "#/components/schemas/FeeBooking" }
        - type: object
          required: [disclosure, verification]
          properties:
            disclosure: { $ref: "#/components/schemas/FeeDisclosure" }
            verification: { $ref: "#/components/schemas/FeeVerification" }
    FeeBookingPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/FeeBooking" } }
    FeeReverseRequest:
      type: object
      required: [reason_code, reason]
      properties:
        reason_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    FeeSpreadCharge:
      type: object
      required: [booking_id, disclosure_id, account_id, schedule_key, schedule_version, schedule_hash, disclosure_hash, side, base_quantity,
                 reference_price, execution_price, spread_bps, spread_amount, quote_asset_id, booking_mode, status, journal_transaction_id, booked_at]
      properties:
        booking_id: { $ref: "#/components/schemas/UUID" }
        disclosure_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        schedule_key: { type: string }
        schedule_version: { type: integer }
        schedule_hash: { type: string }
        disclosure_hash: { type: string }
        side: { $ref: "#/components/schemas/FeeSide" }
        base_quantity: { $ref: "#/components/schemas/Quantity" }
        reference_price: { $ref: "#/components/schemas/TreasuryPrice" }
        execution_price: { $ref: "#/components/schemas/TreasuryPrice" }
        spread_bps: { $ref: "#/components/schemas/BPS" }
        spread_amount: { $ref: "#/components/schemas/Quantity" }
        quote_asset_id: { $ref: "#/components/schemas/UUID" }
        booking_mode: { $ref: "#/components/schemas/FeeBookingMode" }
        status: { $ref: "#/components/schemas/FeeBookingStatus" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        reversal_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        booked_at: { $ref: "#/components/schemas/Timestamp" }
    FeeSpreadAudit:
      type: object
      required: [value_domain, items]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        items: { type: array, items: { $ref: "#/components/schemas/FeeSpreadCharge" } }
    FeeSpreadTotals:
      type: object
      required: [value_domain, quote_asset_id, booked, reversed]
      description: Booked less reversed is what SPREAD_REVENUE holds from the fee ledger's bookings.
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        quote_asset_id: { $ref: "#/components/schemas/UUID" }
        booked: { $ref: "#/components/schemas/Quantity" }
        reversed: { $ref: "#/components/schemas/Quantity" }
    FeePeriodTerms:
      type: object
      required: [account_ref, terms_version, period_start, period_end, opening_nav, prior_hwm, hurdle_annual_bps, fee_rate_bps, crystallization,
                 prior_accrued_fee]
      properties:
        account_ref: { type: string }
        terms_version: { type: string }
        period_start: { $ref: "#/components/schemas/Timestamp" }
        period_end: { $ref: "#/components/schemas/Timestamp" }
        opening_nav: { $ref: "#/components/schemas/USD" }
        prior_hwm: { $ref: "#/components/schemas/USD", description: "the high-water mark the period opened with" }
        hurdle_annual_bps: { type: integer, format: int64 }
        fee_rate_bps: { type: integer, format: int64 }
        crystallization: { type: string }
        prior_accrued_fee: { $ref: "#/components/schemas/USD" }
    FeeFlow:
      type: object
      required: [id, seq, at, amount, nav_before, actor_type, actor_id]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        seq: { type: integer }
        at: { $ref: "#/components/schemas/Timestamp" }
        amount: { $ref: "#/components/schemas/USD", description: "a deposit is positive, a withdrawal negative" }
        nav_before: { $ref: "#/components/schemas/USD" }
        actor_type: { type: string }
        actor_id: { type: string }
    FeePerformanceLine:
      type: object
      required: [id, seq, kind, at, nav, hwm_adjusted, hurdle_threshold, fee_base, amount, accrual_before, accrual_after, effect_id]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        seq: { type: integer }
        kind: { $ref: "#/components/schemas/FeeLineKind" }
        at: { $ref: "#/components/schemas/Timestamp" }
        nav: { $ref: "#/components/schemas/USD" }
        hwm_adjusted: { $ref: "#/components/schemas/USD" }
        hurdle_threshold: { $ref: "#/components/schemas/USD" }
        fee_base: { $ref: "#/components/schemas/USD", description: "what is above the high-water mark and the hurdle; nothing accrues on less" }
        amount: { $ref: "#/components/schemas/USD" }
        accrual_before: { $ref: "#/components/schemas/USD" }
        accrual_after: { $ref: "#/components/schemas/USD" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
    FeeStatementFlow:
      type: object
      required: [at, amount, nav_before, nav_after, hwm_before, hwm_after]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        amount: { $ref: "#/components/schemas/USD" }
        nav_before: { $ref: "#/components/schemas/USD" }
        nav_after: { $ref: "#/components/schemas/USD" }
        hwm_before: { $ref: "#/components/schemas/USD" }
        hwm_after: { $ref: "#/components/schemas/USD" }
    FeeAttribution:
      type: object
      required: [strategy, gross_pnl, eligible, fee_share, remainder_allocated]
      properties:
        strategy: { type: string }
        gross_pnl: { $ref: "#/components/schemas/USD" }
        eligible: { type: boolean }
        fee_share: { $ref: "#/components/schemas/USD" }
        remainder_allocated: { $ref: "#/components/schemas/USD" }
    FeeStatement:
      type: object
      required: [kind, mode, period_start, period_end, opening_nav, flows, net_flows, closing_nav_gross, gross_pnl, hwm_before, hwm_adjusted,
                 hurdle_annual_bps, hurdle_threshold, fee_base, fee_rate_bps, fee_amount, closing_nav_net, hwm_after, prior_accrued_fee,
                 attribution, rounding]
      description: The deterministic statement a crystallization stores with its hash.
      properties:
        kind: { type: string }
        mode: { type: string }
        period_start: { $ref: "#/components/schemas/Timestamp" }
        period_end: { $ref: "#/components/schemas/Timestamp" }
        opening_nav: { $ref: "#/components/schemas/USD" }
        flows: { type: array, items: { $ref: "#/components/schemas/FeeStatementFlow" } }
        net_flows: { $ref: "#/components/schemas/USD" }
        closing_nav_gross: { $ref: "#/components/schemas/USD" }
        gross_pnl: { $ref: "#/components/schemas/USD" }
        hwm_before: { $ref: "#/components/schemas/USD" }
        hwm_adjusted: { $ref: "#/components/schemas/USD" }
        hurdle_annual_bps: { type: integer, format: int64 }
        hurdle_threshold: { $ref: "#/components/schemas/USD" }
        fee_base: { $ref: "#/components/schemas/USD" }
        fee_rate_bps: { type: integer, format: int64 }
        fee_amount: { $ref: "#/components/schemas/USD" }
        closing_nav_net: { $ref: "#/components/schemas/USD" }
        hwm_after: { $ref: "#/components/schemas/USD", description: "the high-water mark the next period opens with" }
        prior_accrued_fee: { $ref: "#/components/schemas/USD" }
        attribution: { type: array, items: { $ref: "#/components/schemas/FeeAttribution" } }
        rounding:
          type: object
          additionalProperties: { type: string }
    FeePeriod:
      type: object
      required: [value_domain, id, account_id, strategy_ref, seq, mode, fee_asset_id, terms, terms_hash, status, accrued, flows, lines]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        strategy_ref: { type: string }
        seq: { type: integer }
        previous_period_id: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        fee_asset_id: { $ref: "#/components/schemas/UUID" }
        terms: { $ref: "#/components/schemas/FeePeriodTerms" }
        terms_hash: { type: string }
        status: { $ref: "#/components/schemas/FeePeriodStatus" }
        accrued: { $ref: "#/components/schemas/USD", description: "the running accrual of an open period" }
        last_valuation_at: { $ref: "#/components/schemas/Timestamp" }
        flows: { type: array, items: { $ref: "#/components/schemas/FeeFlow" } }
        lines: { type: array, items: { $ref: "#/components/schemas/FeePerformanceLine" } }
        statement: { $ref: "#/components/schemas/FeeStatement" }
        statement_hash: { type: string }
        crystallization_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        crystallization_effect_id: { $ref: "#/components/schemas/UUID" }
        crystallized_at: { $ref: "#/components/schemas/Timestamp" }
        reversal_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        reversal_reason_code: { type: string }
        reversed_at: { $ref: "#/components/schemas/Timestamp" }
        gross_return_bps: { type: integer, format: int64, description: "Modified Dietz return gross of the fee, rounded toward zero" }
        net_return_bps: { type: integer, format: int64 }
        verification: { $ref: "#/components/schemas/FeeVerification", description: "present on a read by id of a period with a statement" }
    FeePeriodPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/FeePeriod" } }
    FeeOpenPeriodRequest:
      type: object
      required: [account_id, strategy_ref, terms_version, period_end, hurdle_annual_bps, fee_rate_bps]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        strategy_ref: { type: string, minLength: 1, maxLength: 90, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,89}$' }
        mode: { $ref: "#/components/schemas/AdvancedMode", description: "PAPER (default) or SANDBOX" }
        fee_asset_id: { $ref: "#/components/schemas/UUID", description: "defaults to the sandbox dollar" }
        terms_version: { type: string, minLength: 1, maxLength: 100 }
        period_start: { $ref: "#/components/schemas/Timestamp", description: "the first period of a pair only" }
        period_end: { $ref: "#/components/schemas/Timestamp" }
        opening_nav: { $ref: "#/components/schemas/USD", description: "the first period of a pair only" }
        hurdle_annual_bps: { type: integer, format: int64, minimum: 0 }
        fee_rate_bps: { type: integer, format: int64, minimum: 0, maximum: 10000 }
    FeeFlowRequest:
      type: object
      required: [at, amount, nav_before]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        amount: { $ref: "#/components/schemas/USD" }
        nav_before: { $ref: "#/components/schemas/USD" }
    FeeFlowResult:
      type: object
      required: [value_domain, period_id, flow]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        period_id: { $ref: "#/components/schemas/UUID" }
        flow: { $ref: "#/components/schemas/FeeFlow" }
    FeeAccrueRequest:
      type: object
      required: [at, nav]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        nav: { $ref: "#/components/schemas/USD", description: "the gross NAV at that instant, before any performance fee" }
    FeeLineResult:
      type: object
      required: [value_domain, period_id, line]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        period_id: { $ref: "#/components/schemas/UUID" }
        line: { $ref: "#/components/schemas/FeePerformanceLine" }
    FeeContribution:
      type: object
      required: [strategy, gross_pnl]
      properties:
        strategy: { type: string, minLength: 1, maxLength: 100 }
        gross_pnl: { $ref: "#/components/schemas/USD" }
    FeeCrystallizeRequest:
      type: object
      required: [closing_nav]
      properties:
        closing_nav: { $ref: "#/components/schemas/USD", description: "the gross closing NAV" }
        contributions: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/FeeContribution" } }
    FeeCancelPeriodRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    # >>> advanced:stable schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:bridge schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:predmarket schemas (insert this subsystem's schemas directly below; keep the marker)
    PredictionMarketStatus:
      type: string
      description: >-
        One of DRAFT, OPEN, CLOSED, RESOLVING, RESOLVED, DISPUTED, SETTLED, VOIDED. DRAFT → OPEN → CLOSED →
        RESOLVING → RESOLVED → SETTLED; RESOLVED → DISPUTED → RESOLVED or VOIDED; any state but SETTLED and
        VOIDED → VOIDED. Declared without an enum on purpose: its values are shared with other schemas' enums,
        and a shared enum value renames the generated constants of every schema that holds it.
    PredictionMarketMode:
      type: string
      enum: [PAPER, SANDBOX]
    PredictionActor:
      type: object
      required: [actor_type, actor_id]
      properties:
        actor_type: { type: string }
        actor_id: { type: string }
    PredictionOutcome:
      type: object
      required: [index, symbol, share_asset_id, instrument_id]
      properties:
        index: { type: integer }
        symbol: { type: string }
        share_asset_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID", description: The outcome's EVENT_OUTCOME instrument for the internal order book }
    PredictionMarket:
      type: object
      required: [value_domain, id, symbol, question, mode, status, facility_id, instrument_id, collateral_asset_id, collateral_symbol,
                 collateral_decimals, unit_quantity, share_decimals, outcomes, open_at, close_at, dispute_window_ms, oracle_source,
                 oracle_public_key, definition_hash, created_by, created_at, updated_at]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        symbol: { type: string }
        question: { type: string }
        mode: { $ref: "#/components/schemas/PredictionMarketMode" }
        status: { $ref: "#/components/schemas/PredictionMarketStatus" }
        facility_id: { $ref: "#/components/schemas/UUID", description: The PREDICTION_MARKET facility whose books are the market's escrow }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        collateral_asset_id: { $ref: "#/components/schemas/UUID" }
        collateral_symbol: { type: string }
        collateral_decimals: { type: integer }
        unit_quantity: { $ref: "#/components/schemas/Quantity", description: Collateral base units one complete set costs and one winning share pays }
        share_decimals: { type: integer }
        outcomes: { type: array, items: { $ref: "#/components/schemas/PredictionOutcome" } }
        open_at: { $ref: "#/components/schemas/Timestamp" }
        close_at: { $ref: "#/components/schemas/Timestamp" }
        dispute_window_ms: { type: integer, format: int64 }
        oracle_source: { type: string }
        oracle_public_key: { type: string, description: hex Ed25519 public key the market accepts reports from }
        definition_hash: { type: string, description: hex sha256 of the canonical definition }
        current_resolution_id: { $ref: "#/components/schemas/UUID" }
        created_by: { $ref: "#/components/schemas/PredictionActor" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    PredictionMarketList:
      type: object
      required: [value_domain, status, items]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        status: { $ref: "#/components/schemas/PredictionMarketStatus" }
        items: { type: array, items: { $ref: "#/components/schemas/PredictionMarket" } }
    PredictionResolutionKind:
      type: string
      enum: [ORACLE, DISPUTE_UPHELD, DISPUTE_OVERTURNED]
    PredictionResolution:
      type: object
      required: [id, market_id, kind, outcome_index, outcome_symbol, evidence_ref, evidence_sha256, accepted_by, reason, accepted_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        market_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/PredictionResolutionKind" }
        outcome_index: { type: integer }
        outcome_symbol: { type: string }
        supersedes_id: { $ref: "#/components/schemas/UUID" }
        dispute_id: { $ref: "#/components/schemas/UUID" }
        report_hash: { type: string, description: hex sha256 of the verified report's signed bytes and signature }
        report_source: { type: string }
        report_observed_at: { $ref: "#/components/schemas/Timestamp" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        accepted_by: { $ref: "#/components/schemas/PredictionActor" }
        reason: { type: string }
        accepted_at: { $ref: "#/components/schemas/Timestamp" }
    PredictionDispute:
      type: object
      required: [id, market_id, resolution_id, raised_by, reason, evidence_ref, evidence_sha256, raised_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        market_id: { $ref: "#/components/schemas/UUID" }
        resolution_id: { $ref: "#/components/schemas/UUID" }
        raised_by: { $ref: "#/components/schemas/PredictionActor" }
        reason: { type: string }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        raised_at: { $ref: "#/components/schemas/Timestamp" }
    PredictionSettlementKind:
      type: string
      description: PAYOUT (a resolved market paid its winners) or REFUND (a void refunded every share); no enum, see PredictionMarketStatus
    PredictionRoundingPolicy:
      type: string
      enum: [EXACT, FLOOR_PER_HOLDER]
    PredictionSettlement:
      type: object
      required: [id, market_id, kind, outcome_count, unit_quantity, rounding_policy, escrow_before, total_paid, residual, holder_count,
                 evidence_ref, evidence_sha256, settled_by, settled_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        market_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/PredictionSettlementKind" }
        resolution_id: { $ref: "#/components/schemas/UUID" }
        winning_outcome_index: { type: integer }
        winning_outcome_symbol: { type: string }
        outcome_count: { type: integer }
        unit_quantity: { $ref: "#/components/schemas/Quantity" }
        refund_rate_per_share: { $ref: "#/components/schemas/Quantity" }
        rounding_policy: { $ref: "#/components/schemas/PredictionRoundingPolicy" }
        escrow_before: { $ref: "#/components/schemas/Quantity" }
        total_paid: { $ref: "#/components/schemas/Quantity" }
        residual: { $ref: "#/components/schemas/Quantity", description: "What the escrow keeps; zero after a payout, disclosed after a refund" }
        holder_count: { type: integer }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        settled_by: { $ref: "#/components/schemas/PredictionActor" }
        settled_at: { $ref: "#/components/schemas/Timestamp" }
    PredictionMarketDetail:
      type: object
      required: [value_domain, market, resolutions, disputes]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market: { $ref: "#/components/schemas/PredictionMarket" }
        resolutions: { type: array, items: { $ref: "#/components/schemas/PredictionResolution" }, description: Oldest first }
        disputes: { type: array, items: { $ref: "#/components/schemas/PredictionDispute" }, description: Oldest first }
        settlement: { $ref: "#/components/schemas/PredictionSettlement", description: Absent until the market settles or is voided }
    PredictionBookOutcome:
      type: object
      required: [index, symbol, share_asset_id, shares_issued, shares_outstanding, held_by_customers]
      properties:
        index: { type: integer }
        symbol: { type: string }
        share_asset_id: { $ref: "#/components/schemas/UUID" }
        shares_issued: { $ref: "#/components/schemas/Quantity" }
        shares_outstanding: { $ref: "#/components/schemas/Quantity" }
        held_by_customers: { $ref: "#/components/schemas/Quantity" }
    PredictionEscrowBooks:
      type: object
      required: [value_domain, market_id, market_status, collateral_asset_id, collateral_symbol, collateral_decimals, share_decimals,
                 escrow, collateral, residual, outcomes, reconciles, violations]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market_id: { $ref: "#/components/schemas/UUID" }
        market_status: { $ref: "#/components/schemas/PredictionMarketStatus" }
        collateral_asset_id: { $ref: "#/components/schemas/UUID" }
        collateral_symbol: { type: string }
        collateral_decimals: { type: integer }
        share_decimals: { type: integer }
        escrow: { $ref: "#/components/schemas/Quantity" }
        collateral: { $ref: "#/components/schemas/Quantity" }
        residual: { $ref: "#/components/schemas/Quantity", description: The residual the market's settlement record discloses; zero without one }
        outcomes: { type: array, items: { $ref: "#/components/schemas/PredictionBookOutcome" } }
        reconciles: { type: boolean, description: True when the books satisfy escrow = collateral = outstanding(i) + residual and issued(i) = outstanding(i) = held(i) }
        violations: { type: array, items: { type: string } }
    PredictionPosition:
      type: object
      required: [outcome_index, outcome_symbol, share_asset_id, quantity, as_of]
      properties:
        outcome_index: { type: integer }
        outcome_symbol: { type: string }
        share_asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        as_of: { $ref: "#/components/schemas/Timestamp" }
    PredictionPositionList:
      type: object
      required: [value_domain, market_id, account_id, share_decimals, items]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        share_decimals: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/PredictionPosition" } }
    PredictionSetRequest:
      type: object
      required: [account_id, quantity]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity", description: "Complete sets in share base units, a positive multiple of the market's unit_quantity" }
    PredictionSetAction:
      type: string
      enum: [ISSUE, REDEEM]
    PredictionSetResult:
      type: object
      required: [value_domain, market_id, account_id, action, quantity, replay, intent]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        action: { $ref: "#/components/schemas/PredictionSetAction" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        replay: { type: boolean, description: True when the economic intent already existed; nothing new happened }
        intent: { $ref: "#/components/schemas/EconomicIntent" }
        effect: { $ref: "#/components/schemas/EconomicEffect" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        risk_decision_hash: { type: string }
    CreatePredictionMarketRequest:
      type: object
      required: [symbol, question, outcomes, mode, open_at, close_at, dispute_window_ms, oracle_source, oracle_public_key]
      properties:
        symbol: { type: string, description: "1..32 of A-Z 0-9 _ -, starting alphanumeric" }
        question: { type: string }
        outcomes: { type: array, items: { type: string }, description: "2..64 distinct symbols of 1..24 of A-Z 0-9 _ -" }
        mode: { $ref: "#/components/schemas/PredictionMarketMode" }
        open_at: { $ref: "#/components/schemas/Timestamp" }
        close_at: { $ref: "#/components/schemas/Timestamp" }
        dispute_window_ms: { type: integer, format: int64, description: Whole milliseconds within 0..30 days }
        oracle_source: { type: string }
        oracle_public_key: { type: string, description: hex Ed25519 public key (64 hex characters) }
    PredictionOracle:
      type: object
      required: [kind, source, public_key]
      properties:
        kind: { type: string, enum: [SANDBOX] }
        source: { type: string }
        public_key: { type: string, description: hex Ed25519 public key }
    PredictionOracleObservationRequest:
      type: object
      required: [outcome, observed_at, evidence]
      properties:
        outcome: { type: string }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
        evidence: { type: string, description: The source document the oracle saw (1..16384 bytes); its sha256 is signed }
    PredictionOracleReport:
      type: object
      required: [market_id, outcome, source, observed_at, evidence, signature]
      properties:
        market_id: { type: string }
        outcome: { type: string }
        source: { type: string }
        observed_at: { type: string, description: RFC 3339 in UTC }
        evidence: { type: string, description: standard base64 }
        signature: { type: string, description: standard base64 Ed25519 signature }
    PredictionOracleObservation:
      type: object
      required: [value_domain, report, report_hash]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        report: { $ref: "#/components/schemas/PredictionOracleReport" }
        report_hash: { type: string }
    PredictionResolveRequest:
      type: object
      properties:
        reason: { type: string }
    PredictionResolutionResult:
      type: object
      required: [value_domain, market, resolution, replay]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market: { $ref: "#/components/schemas/PredictionMarket" }
        resolution: { $ref: "#/components/schemas/PredictionResolution" }
        replay: { type: boolean, description: True when the report had already been accepted; nothing changed }
    PredictionDisputeRequest:
      type: object
      required: [reason, evidence]
      properties:
        reason: { type: string, description: 8..2000 characters }
        evidence: { type: object, additionalProperties: true }
    PredictionDisputeResult:
      type: object
      required: [value_domain, market, dispute]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market: { $ref: "#/components/schemas/PredictionMarket" }
        dispute: { $ref: "#/components/schemas/PredictionDispute" }
    PredictionRulingRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: 8..2000 characters }
        evidence: { type: object, additionalProperties: true }
    PredictionVoidRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: 8..2000 characters }
        evidence: { type: object, additionalProperties: true }
    PredictionShareCount:
      type: object
      required: [outcome_symbol, quantity]
      properties:
        outcome_symbol: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
    PredictionPayoutLine:
      type: object
      required: [account_id, amount, shares, intent_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        amount: { $ref: "#/components/schemas/Quantity" }
        shares: { type: array, items: { $ref: "#/components/schemas/PredictionShareCount" } }
        intent_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
    PredictionSettlementResult:
      type: object
      required: [value_domain, market, settlement, lines, replay]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        market: { $ref: "#/components/schemas/PredictionMarket" }
        settlement: { $ref: "#/components/schemas/PredictionSettlement" }
        lines: { type: array, items: { $ref: "#/components/schemas/PredictionPayoutLine" }, description: "What this call paid, one line per holder; empty on a replay" }
        replay: { type: boolean, description: True when the market had already settled (or been voided); nothing was paid }
    PredictionEscrowReconciliation:
      type: object
      required: [value_domain, id, kind, mode, scope_type, scope_id, status, material, blocks_new_risk, expected, observed, difference, opened_at]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string, description: PREDICTION_ESCROW }
        mode: { type: string, description: "EVENT_DRIVEN, PERIODIC or FULL" }
        scope_type: { type: string }
        scope_id: { type: string }
        status: { type: string, description: "OPEN, MATCHED, MISMATCH, INVESTIGATING, RESOLVED_AUTOMATIC, RESOLVED_MANUAL or ESCALATED" }
        material: { type: boolean }
        blocks_new_risk: { type: boolean }
        expected: { type: object, additionalProperties: true }
        observed: { type: object, additionalProperties: true }
        difference: { type: object, additionalProperties: true }
        opened_at: { $ref: "#/components/schemas/Timestamp" }
        matched_at: { $ref: "#/components/schemas/Timestamp" }

    # >>> advanced:marketplace schemas (insert this subsystem's schemas directly below; keep the marker)
    #
    # The enums carry x-enum-varnames so their Go constants can never collide
    # with another schema's (APPROVE, REJECT, ACTIVE and OK are common values).
    # Digests and hashes are lower-case hex sha256.
    StrategyDecimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: >-
        An exact decimal string with as many fraction digits as its scale (a
        price or an amount in simulated dollars). Never a JSON number, never
        rounded.
      examples: ["150.25"]
    StrategyVersionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, VALIDATED, IN_REVIEW, APPROVED, REJECTED, DEPRECATED]
      x-enum-varnames: [StrategyStatusDraft, StrategyStatusSubmitted, StrategyStatusValidated, StrategyStatusInReview,
                        StrategyStatusApproved, StrategyStatusRejected, StrategyStatusDeprecated]
    StrategyModeration:
      type: string
      enum: [UNREVIEWED, CLEARED, FLAGGED, TAKEN_DOWN]
      x-enum-varnames: [StrategyModerationUnreviewed, StrategyModerationCleared, StrategyModerationFlagged, StrategyModerationTakenDown]
    StrategyRiskClass:
      type: string
      enum: [CONSERVATIVE, MODERATE, AGGRESSIVE, SPECULATIVE]
      x-enum-varnames: [StrategyRiskConservative, StrategyRiskModerate, StrategyRiskAggressive, StrategyRiskSpeculative]
    StrategyIntentKind:
      type: string
      description: >-
        The only intent kinds a strategy may propose: taking and reducing
        exposure. Moving value out of an account is not a proposable kind.
      enum: [ACQUIRE_EXPOSURE, CLOSE_POSITION, OPEN_POSITION, REDUCE_EXPOSURE]
      x-enum-varnames: [StrategyKindAcquireExposure, StrategyKindClosePosition, StrategyKindOpenPosition, StrategyKindReduceExposure]
    StrategyValidationOutcome:
      type: string
      enum: [PASSED, FAILED]
      x-enum-varnames: [StrategyValidationPassed, StrategyValidationFailed]
    StrategyBuildFailure:
      type: string
      enum: [SCAN_REJECTED, COMPILE_FAILED, BUILD_TIMEOUT]
      x-enum-varnames: [StrategyBuildScanRejected, StrategyBuildCompileFailed, StrategyBuildTimeout]
    StrategyReviewDecision:
      type: string
      enum: [APPROVE, REJECT]
      x-enum-varnames: [StrategyReviewApprove, StrategyReviewReject]
    StrategyInstallStatus:
      type: string
      enum: [ACTIVE, REMOVED]
      x-enum-varnames: [StrategyInstallActive, StrategyInstallRemoved]
    StrategyFollowTrigger:
      type: string
      enum: [EXPLICIT, SCHEDULED]
      x-enum-varnames: [StrategyFollowExplicit, StrategyFollowScheduled]
    StrategyFollowOutcome:
      type: string
      enum: [DISPATCHED, RISK_REJECTED, ROUTE_REFUSED, DISPATCH_FAILED, DISPATCH_UNKNOWN]
      x-enum-varnames: [StrategyOutcomeDispatched, StrategyOutcomeRiskRejected, StrategyOutcomeRouteRefused,
                        StrategyOutcomeDispatchFailed, StrategyOutcomeDispatchUnknown]
    StrategyRunTermination:
      type: string
      enum: [OK, TIMEOUT, MEMORY_LIMIT, OUTPUT_LIMIT, TRAP, INVALID_OUTPUT, KILLED_BY_SWITCH, INVALID_MODULE]
      x-enum-varnames: [StrategyRunOk, StrategyRunTimeout, StrategyRunMemoryLimit, StrategyRunOutputLimit, StrategyRunTrap,
                        StrategyRunInvalidOutput, StrategyRunKilledBySwitch, StrategyRunInvalidModule]
    StrategyRunSource:
      type: string
      enum: [FOLLOW, SIMULATION]
      x-enum-varnames: [StrategyRunSourceFollow, StrategyRunSourceSimulation]
    StrategyEvaluationKind:
      type: string
      enum: [SIMULATION]
      x-enum-varnames: [StrategyEvaluationSimulation]

    # --- requests ---------------------------------------------------------
    StrategySource:
      type: object
      description: >-
        A strategy's source: plain file name to file text, one `package main`
        directory. At most 32 files of at most 65536 bytes each and 262144
        bytes in all; every file is scanned before anything is built.
      minProperties: 1
      maxProperties: 32
      additionalProperties: { type: string, maxLength: 65536 }
    StrategyFees:
      type: object
      description: Fee METADATA the creator states. Nothing in the marketplace charges a fee.
      required: [performance_fee_bps, management_fee_bps, high_water_mark]
      properties:
        performance_fee_bps: { $ref: "#/components/schemas/BPS" }
        management_fee_bps: { $ref: "#/components/schemas/BPS" }
        high_water_mark: { type: boolean }
    StrategyManifestInput:
      type: object
      description: >-
        The permissions a version is held to at run time. The server sorts and
        de-duplicates the lists; the manifest is then hashed and can never
        change.
      required: [allowed_intent_kinds, max_notional_per_intent, max_intents_per_run, min_interval_seconds]
      properties:
        schema: { type: string, description: "nodal.strategy.manifest/v1 when left out" }
        allowed_intent_kinds: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/StrategyIntentKind" } }
        allowed_instrument_ids: { type: array, maxItems: 256, items: { $ref: "#/components/schemas/UUID" } }
        allowed_instrument_kinds: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/InstrumentKind" } }
        max_notional_per_intent: { $ref: "#/components/schemas/StrategyDecimal" }
        max_intents_per_run: { type: integer, minimum: 1, maximum: 100 }
        min_interval_seconds: { type: integer, format: int64, minimum: 60, maximum: 31536000 }
    StrategyVersionInput:
      type: object
      description: >-
        The content of a version. A new listing and a new version need a
        manifest and source; a fork without them takes the parent's.
      required: [description, risk_class, source_commit]
      properties:
        description: { type: string, minLength: 1, maxLength: 4000 }
        risk_class: { $ref: "#/components/schemas/StrategyRiskClass" }
        supported_instrument_ids: { type: array, maxItems: 256, items: { $ref: "#/components/schemas/UUID" } }
        manifest: { $ref: "#/components/schemas/StrategyManifestInput" }
        source: { $ref: "#/components/schemas/StrategySource" }
        source_commit: { type: string, minLength: 1, maxLength: 100 }
        backtest_evidence_ref: { type: string, maxLength: 500 }
        data_dependencies: { type: array, maxItems: 64, items: { type: string } }
        fees: { $ref: "#/components/schemas/StrategyFees" }
        config:
          type: object
          maxProperties: 128
          additionalProperties: { type: string, maxLength: 1024 }
    StrategyListingCreateRequest:
      type: object
      required: [account_id, title, version]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        title: { type: string, minLength: 1, maxLength: 200 }
        version: { $ref: "#/components/schemas/StrategyVersionInput" }
    StrategyVersionCreateRequest:
      type: object
      required: [account_id, version]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        version: { $ref: "#/components/schemas/StrategyVersionInput" }
    StrategyForkRequest:
      type: object
      required: [account_id, title, version]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        title: { type: string, minLength: 1, maxLength: 200 }
        version: { $ref: "#/components/schemas/StrategyVersionInput" }
    StrategyAccountRequest:
      type: object
      required: [account_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
    StrategySnapshotInstrument:
      type: object
      required: [instrument_id, kind, base_decimals, quote_decimals, mark]
      properties:
        instrument_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/InstrumentKind" }
        base_decimals: { type: integer, minimum: 0, maximum: 18 }
        quote_decimals: { type: integer, minimum: 0, maximum: 18 }
        mark: { $ref: "#/components/schemas/StrategyDecimal" }
        best_bid: { $ref: "#/components/schemas/StrategyDecimal" }
        best_ask: { $ref: "#/components/schemas/StrategyDecimal" }
        closes: { type: array, maxItems: 4096, items: { $ref: "#/components/schemas/StrategyDecimal" } }
    StrategySnapshotPosition:
      type: object
      required: [instrument_id, quantity]
      properties:
        instrument_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
    StrategySnapshotPortfolio:
      type: object
      required: [balance, positions]
      properties:
        balance:
          $ref: "#/components/schemas/StrategyDecimal"
        positions: { type: array, maxItems: 1024, items: { $ref: "#/components/schemas/StrategySnapshotPosition" } }
    StrategySnapshot:
      type: object
      description: >-
        The market and portfolio snapshot a strategy runs on, supplied by the
        caller. Prices are simulated dollars per whole base unit; positions are
        base units; balance is the portfolio's uninvested simulated dollars.
        It is strategy input only: the risk kernel's sections are read from the
        database, never from it.
      required: [as_of, instruments, portfolio]
      properties:
        as_of: { $ref: "#/components/schemas/Timestamp" }
        instruments: { type: array, maxItems: 256, items: { $ref: "#/components/schemas/StrategySnapshotInstrument" } }
        portfolio: { $ref: "#/components/schemas/StrategySnapshotPortfolio" }
    StrategySimulationRequest:
      type: object
      required: [account_id, dataset_version, snapshots]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        dataset_version: { type: string, minLength: 1, maxLength: 100 }
        snapshots: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/StrategySnapshot" } }
    StrategyReviewRequest:
      type: object
      required: [reason_code]
      properties:
        reason_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        note: { type: string, maxLength: 2000 }
    StrategyModerationRequest:
      type: object
      required: [to, reason]
      properties:
        to: { $ref: "#/components/schemas/StrategyModeration" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    StrategyDeprecateRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    StrategyInstallRequest:
      type: object
      required: [account_id, version_id, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        version_id: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
    StrategyInstallRemoveRequest:
      type: object
      required: [account_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        reason: { type: string, maxLength: 1000 }
    StrategyFollowRequest:
      type: object
      required: [account_id, snapshot]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        snapshot: { $ref: "#/components/schemas/StrategySnapshot" }

    # --- responses --------------------------------------------------------
    StrategyVersionSummary:
      type: object
      required: [id, listing_id, number, status, moderation, risk_class, description, strategy_ref, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        listing_id: { $ref: "#/components/schemas/UUID" }
        number: { type: integer }
        status: { $ref: "#/components/schemas/StrategyVersionStatus" }
        moderation: { $ref: "#/components/schemas/StrategyModeration" }
        risk_class: { $ref: "#/components/schemas/StrategyRiskClass" }
        description: { type: string }
        strategy_ref: { type: string, description: "<listing id>@<version>, how intents name the version" }
        rejection_code: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    StrategyListing:
      type: object
      required: [id, title, created_at, latest_version]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        title: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        forked_from_version_id: { $ref: "#/components/schemas/UUID" }
        creator_account_id:
          $ref: "#/components/schemas/UUID"
        latest_version: { $ref: "#/components/schemas/StrategyVersionSummary" }
    StrategyListingPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/StrategyListing" } }
    StrategyManifest:
      type: object
      required: [schema, allowed_intent_kinds, allowed_instrument_ids, allowed_instrument_kinds, max_notional_per_intent,
                 max_intents_per_run, min_interval_seconds]
      properties:
        schema: { type: string }
        allowed_intent_kinds: { type: array, items: { $ref: "#/components/schemas/StrategyIntentKind" } }
        allowed_instrument_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        allowed_instrument_kinds: { type: array, items: { $ref: "#/components/schemas/InstrumentKind" } }
        max_notional_per_intent: { $ref: "#/components/schemas/StrategyDecimal" }
        max_intents_per_run: { type: integer }
        min_interval_seconds: { type: integer, format: int64 }
    StrategyVersion:
      type: object
      required: [value_domain, id, listing_id, number, status, moderation, description, risk_class, supported_instrument_ids,
                 manifest, manifest_hash, source_digest, source_commit, backtest_evidence_ref, data_dependencies, fees, config,
                 strategy_ref, created_by_actor_type, created_at, updated_at]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        listing_id: { $ref: "#/components/schemas/UUID" }
        number: { type: integer }
        status: { $ref: "#/components/schemas/StrategyVersionStatus" }
        moderation: { $ref: "#/components/schemas/StrategyModeration" }
        description: { type: string }
        risk_class: { $ref: "#/components/schemas/StrategyRiskClass" }
        supported_instrument_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        manifest: { $ref: "#/components/schemas/StrategyManifest" }
        manifest_hash: { type: string }
        source_digest: { type: string }
        source_commit: { type: string }
        backtest_evidence_ref: { type: string }
        data_dependencies: { type: array, items: { type: string } }
        fees: { $ref: "#/components/schemas/StrategyFees" }
        config: { type: object, additionalProperties: { type: string } }
        strategy_ref: { type: string }
        created_by_actor_type: { type: string }
        created_by_actor_id: { type: string, description: Shown to the creator's account and to operators only }
        rejection_code: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    StrategyValidation:
      type: object
      required: [outcome, scan_codes, toolchain_version, sdk_version, runtime_version]
      properties:
        outcome: { $ref: "#/components/schemas/StrategyValidationOutcome" }
        artifact_digest: { type: string }
        failure_reason: { $ref: "#/components/schemas/StrategyBuildFailure" }
        scan_codes: { type: array, items: { type: string } }
        toolchain_version: { type: string }
        sdk_version: { type: string }
        runtime_version: { type: string }
    StrategyReview:
      type: object
      required: [decision, reason_code, note, reviewer_actor_type, reviewed_at]
      properties:
        decision: { $ref: "#/components/schemas/StrategyReviewDecision" }
        reason_code: { type: string }
        note: { type: string }
        reviewer_actor_type: { type: string }
        reviewer_actor_id: { type: string, description: Shown to the creator's account and to operators only }
        reviewed_at: { $ref: "#/components/schemas/Timestamp" }
    StrategyForkAncestor:
      type: object
      required: [version_id, listing_id, number, source_digest, manifest_hash]
      properties:
        version_id: { $ref: "#/components/schemas/UUID" }
        listing_id: { $ref: "#/components/schemas/UUID" }
        number: { type: integer }
        source_digest: { type: string }
        manifest_hash: { type: string }
    StrategyProvenance:
      type: object
      required: [strategy_ref, source_commit, source_digest, manifest_hash, forked_from]
      properties:
        strategy_ref: { type: string }
        source_commit: { type: string }
        source_digest: { type: string }
        manifest_hash: { type: string }
        artifact_digest: { type: string }
        toolchain_version: { type: string }
        sdk_version: { type: string }
        runtime_version: { type: string }
        dataset_version: { type: string }
        evaluation_id: { $ref: "#/components/schemas/UUID" }
        forked_from:
          type: array
          description: The fork chain, nearest parent first
          items: { $ref: "#/components/schemas/StrategyForkAncestor" }
    StrategyEvaluationRun:
      type: object
      required: [seq, sandbox_run_id, as_of, input_digest, run_digest, termination, proposals, accepted, violations]
      properties:
        seq: { type: integer }
        sandbox_run_id: { $ref: "#/components/schemas/UUID" }
        as_of: { $ref: "#/components/schemas/Timestamp" }
        input_digest: { type: string }
        run_digest: { type: string }
        termination: { $ref: "#/components/schemas/StrategyRunTermination" }
        proposals: { type: integer }
        accepted: { type: integer }
        violations: { type: integer }
    StrategyEvaluation:
      type: object
      description: A simulation against a fixed snapshot set. Simulated results; nothing was proposed or executed.
      required: [value_domain, id, version_id, kind, dataset_version, snapshots_count, snapshots_digest, results_digest, runs_ok,
                 proposals_count, accepted_count, violations_count, evidence_ref, evidence_sha256]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        version_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/StrategyEvaluationKind" }
        dataset_version: { type: string }
        snapshots_count: { type: integer }
