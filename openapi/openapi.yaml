        "200":
          description: Decisions with their stable reason codes and hashes
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedRiskDecisionList" } } }
        "403": { $ref: "#/components/responses/Problem" }
  /advanced/buying-power:
    get:
      tags: [advanced]
      summary: Universal buying power V2 for an account's simulated holdings, with an explanation of every number
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: Buying power V2 (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/BuyingPowerV2" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  # >>> advanced:margin paths (insert this subsystem's paths directly below; keep the marker)
  #
  # Margin, leverage, borrowing and liquidation of SIMULATED positions
  # (internal/margin). A customer account has at most one margin account,
  # addressed by the customer account's id. Values named without _usd are
  # exact base units of the account's numeraire (the sandbox dollar,
  # numeraire_decimals) or of the asset named; *_usd figures are the margin
  # engine's own cent rendering. The margin service decides every refusal.
  /advanced/margin/account:
    get:
      tags: [advanced]
      summary: An account's margin account, evaluated by the margin engine at the instant of the read
      description: >-
        The read changes nothing: the stored status moves only when the account is
        marked to market or acted on, so `status` can lag `evaluation.health`. Loans
        are the open borrow lots; accrued interest since the last posted period is
        `evaluation.accrued_interest`. The engine reports no liquidation price.
        NOT_FOUND when the account has no margin account.
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: The margin account and its evaluation (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/MarginAccountDetail" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    post:
      tags: [advanced]
      summary: Open a margin account in PAPER or SANDBOX mode with the sandbox dollar as numeraire
      description: >-
        Opening the same account again on the same terms returns it unchanged; other
        terms are a CONFLICT. An ISOLATED account names its one risky asset.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarginOpenRequest" } } }
      responses:
        "200":
          description: The margin account
          content: { application/json: { schema: { $ref: "#/components/schemas/MarginAccount" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/margin/account/close:
    post:
      tags: [advanced]
      summary: Close a margin account that holds nothing and owes the lending pool nothing
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarginAccountRef" } } }
      responses:
        "200":
          description: The closed margin account
          content: { application/json: { schema: { $ref: "#/components/schemas/MarginAccount" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /advanced/margin/collateral/post:
    post:
      tags: [advanced]
      summary: Move collateral from the wallet into the margin account (MARGIN_COLLATERAL_MOVE)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarginCollateralRequest" } } }
      responses:
        "200":
          description: The collateral move and the account's evaluation after it
          content: { application/json: { schema: { $ref: "#/components/schemas/MarginCollateralResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/margin/collateral/release:
    post:
      tags: [advanced]
      summary: Release collateral from the margin account to the wallet (Risk Kernel V2 decides)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarginCollateralRequest" } } }
      responses:
        "200":
          description: The collateral move and the account's evaluation after it
          content: { application/json: { schema: { $ref: "#/components/schemas/MarginCollateralResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/margin/borrow:
    post:
      tags: [advanced]
      summary: Borrow the numeraire from the lending pool into the wallet (MARGIN_BORROW; Risk Kernel V2 decides)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarginAmountRequest" } } }
      responses:
        "200":
          description: The new borrow lot and the account's evaluation after it
          content: { application/json: { schema: { $ref: "#/components/schemas/MarginLoanResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/margin/repay:
    post:
      tags: [advanced]
      summary: Repay loans from the wallet, interest first and oldest lot first (MARGIN_REPAY)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarginAmountRequest" } } }
      responses:
        "200":
          description: The repayment, its allocation per lot and the account's evaluation after it
          content: { application/json: { schema: { $ref: "#/components/schemas/MarginLoanResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/margin/leveraged-buys:
    post:
      tags: [advanced]
      summary: Buy an asset entirely on margin at mark plus the disclosed paper slippage (Risk Kernel V2 decides)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MarginLeveragedBuyRequest" } } }
      responses:
        "200":
          description: The financed buy, its journals and the account's evaluation after it
          content: { application/json: { schema: { $ref: "#/components/schemas/MarginLeveragedBuyResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/margin/calls:
    get:
      tags: [advanced]
      summary: Margin calls of an account, newest first
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of margin calls (value domain SIMULATED)
