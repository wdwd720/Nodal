      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of economic effects
          content: { application/json: { schema: { $ref: "#/components/schemas/EconomicEffectPage" } } }
        "403": { $ref: "#/components/responses/Problem" }
  /advanced/risk/decisions:
    get:
      tags: [advanced]
      summary: Risk Kernel V2 decisions about an account's intents, newest first
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
