  # >>> advanced:derivatives paths (insert this subsystem's paths directly below; keep the marker)
  #
  # Futures, perpetuals and options in PAPER and SANDBOX mode
  # (internal/derivatives), cleared through one CLEARING_HOUSE facility. The
  # service decides every rule -- the settlement compiler's route, the
  # DERIVATIVES gate and kill switches, Risk Kernel V2 (instrument, oracle
  # freshness and mark/index divergence, margin after the trade), buying power,
  # the reservation of margin and premium, the paper fill at the mark plus the
  # disclosed slippage, variation margin, funding, final settlement, exercise
  # and assignment -- and these routes only carry its answers. Every figure is
  # value domain SIMULATED. Amounts are exact base units of the contract's
  # settlement asset (signed from the customer's side: > 0 received, < 0 paid);
  # prices are integer mantissas at the contract's price scale.
  /advanced/derivatives/policy:
    get:
      tags: [advanced]
      summary: The versioned margin, funding and paper-fill policy every derivative decision records
      responses:
        "200":
          description: The policy in force and its hash
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativePolicy" } } }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/contracts:
    get:
      tags: [advanced]
      summary: Derivative contracts with the canonical terms the service trades them on and their latest mark
      description: >-
        Futures, perpetuals and options of the canonical instrument model, ordered
        by canonical name. Without kind every derivative kind is listed, at most
        limit contracts in all.
      parameters:
        - { in: query, name: kind, schema: { $ref: "#/components/schemas/DerivativeKind" } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Contracts with their terms in force, latest mark and final settlement
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeContractList" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/contracts/{instrumentId}:
    get:
      tags: [advanced]
      summary: One derivative contract, its terms in force, latest mark and final settlement
      parameters:
        - { in: path, name: instrumentId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: The contract
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeContract" } } }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/contracts/{instrumentId}/marks:
    get:
      tags: [advanced]
      summary: The marks recorded for a contract, newest observation first
      parameters:
        - { in: path, name: instrumentId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of marks
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeMarkPage" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      tags: [advanced]
      summary: Record a sandbox mark for a contract (operator)
      description: >-
        The mark must be exact at the contract's price scale and lie on its tick
        grid; it is never rounded. Without index the service derives the index
        from the underlying's fresh spot price, or records the mark without one
        (and everything that needs an index then refuses). An index given here
        is recorded under the mark's source. The same observation (contract,
        source, observed_at) again returns the stored mark; a different mark or
        index for it is CONFLICT. Without observed_at the mark is observed now.
      parameters:
        - { in: path, name: instrumentId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeMarkRequest" } } }
      responses:
        "200":
          description: The mark as recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeMark" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/contracts/{instrumentId}/analytics:
    get:
      tags: [advanced]
      summary: Reference analytics of an option at its latest mark -- model values, never a quote
      description: >-
        Black-Scholes-Merton price, Greeks and implied volatility of the option
        at its latest mark, whose index is the spot and whose mark is the premium
        the implied volatility is solved from. Everything here is a reference
        model value labelled as such: it is not a quote, not a settlement price
        and never posted, and it is not advice. The inputs the model used are
        returned with it.
      parameters:
        - { in: path, name: instrumentId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - in: query
          name: vol_bps
          required: true
          description: Annualised volatility the model prices with, in basis points (1 to 100000)
          schema: { type: integer, format: int64 }
        - in: query
          name: rate_bps
          description: Continuously compounded rate in basis points (-10000 to 10000); 0 when absent
          schema: { type: integer, format: int64 }
        - in: query
          name: dividend_yield_bps
          description: Continuous dividend yield in basis points (-10000 to 10000); 0 when absent
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Reference model values and the inputs used
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeOptionAnalytics" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/contracts/{instrumentId}/variation-margin-runs:
    post:
      tags: [advanced]
      summary: Settle one variation-margin interval of a future or perpetual (operator; requires step-up)
      description: >-
        Every open position receives or pays the move of its value to the
        latest fresh mark through the clearing house. An interval is settled
        only after it ends, at most once, and never after a later one; a repeat
        writes nothing and says replay. A stale mark is refused
        (STALE_MARKET_DATA): variation margin is never settled on a stale price.
      parameters:
        - { in: path, name: instrumentId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeRunRequest" } } }
      responses:
        "200":
          description: What the run did (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeRunResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/contracts/{instrumentId}/funding-runs:
    post:
      tags: [advanced]
      summary: Charge one funding interval of a perpetual (operator; requires step-up)
      description: >-
        The premium index is the exact average of (mark - index) / index over
        the interval's marks that carry an index, clamped to the policy's
        maximum; every position open at the interval end pays (longs on a
        positive rate) or receives through the clearing house. Once per
        interval; a repeat writes nothing and says replay.
      parameters:
        - { in: path, name: instrumentId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeRunRequest" } } }
      responses:
        "200":
          description: What the run did (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeRunResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/contracts/{instrumentId}/settlement:
    post:
      tags: [advanced]
      summary: Settle an expired future or option once and for all (operator; requires step-up)
      description: >-
        Without price the service settles a future at the last fresh mark at or
        before expiry and an option at that mark's index (in-the-money longs are
        exercised automatically and assigned FIFO to writers). A given price
        must be exact on the contract's tick grid and names its source. Once per
        contract; a repeat returns the first settlement and says replay.
      parameters:
        - { in: path, name: instrumentId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeSettleRequest" } } }
      responses:
        "200":
          description: The settlement (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeSettlementResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/positions:
    get:
      tags: [advanced]
      summary: An account's derivative positions with the service's valuation of its open book, oldest first
      description: >-
        Each open position carries its average entry price, unrealized PnL and
        initial and maintenance requirement at its latest mark, exactly as the
        service values the account's book. The service values the book as a
        whole and fails closed: when any open position cannot be valued (a stale
        or missing mark) no position is valued and the refusal is returned
        instead (valuation_status REFUSED), never a figure that would understate
        the risk. Funding paid or received is funding_pnl; every interval is in
        /advanced/derivatives/funding-accruals.
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/DerivativePositionStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of positions with the book's valuation
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativePositionPage" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      tags: [advanced]
      summary: Open a position or add to one in one of your own accounts (paper fill at the mark plus disclosed slippage)
      description: >-
        A refusal the service reaches after recording the intent is RECORDED:
        the answer is the stable code (RISK_REJECTED, INSUFFICIENT_BUYING_POWER,
        CAPABILITY_NOT_APPROVED, FORBIDDEN, CONFLICT, ...) with fields intent_id,
        reasons and, for a risk refusal, risk_decision_id, and the intent stays
        readable as REJECTED at /advanced/intents/{intentId}. A stale or missing
        mark refuses a risk-increasing open.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeOpenRequest" } } }
      responses:
        "201":
          description: The position was opened or increased (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeTradeResult" } } }
        "200":
          description: Replay of an intent the service had already carried out
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeTradeResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/positions/{positionId}:
    get:
      tags: [advanced]
      summary: One derivative position, to its account's owner or an operator; anyone else is told it does not exist
      parameters:
        - { in: path, name: positionId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: The position, valued when it is open
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativePosition" } } }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/positions/{positionId}/close:
    post:
      tags: [advanced]
      summary: Reduce or close one of your own open positions (paper fill; never refused for a stale mark)
      description: >-
        Without quantity the whole position is closed. Closing never increases
        risk: a stale mark does not prevent it (it is priced at the last mark
        there is) and no margin is reserved. A refusal the service reaches is
        recorded and answered as for opening. Only the account's owner closes;
        anyone else is told the position does not exist.
      parameters:
        - { in: path, name: positionId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeCloseRequest" } } }
      responses:
        "200":
          description: The position after the close (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeTradeResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/positions/{positionId}/exercise:
    post:
      tags: [advanced]
      summary: Exercise held American options before expiry (settled at the fresh index, assigned FIFO to writers)
      description: >-
        Without quantity every held contract is exercised. A European option is
        exercised automatically at expiry and is refused here (UNSUPPORTED); an
        out-of-the-money option, an expired one or a stale index is refused and
        the refusal recorded. Only the account's owner exercises; anyone else is
        told the position does not exist.
      parameters:
        - { in: path, name: positionId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeExerciseRequest" } } }
      responses:
        "200":
          description: The holder's position after the exercise (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeTradeResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/flows:
    get:
      tags: [advanced]
      summary: The account's register of clearing-house flows (realized, variation margin, funding, premium, settlement), newest first
      description: >-
        The cash-flow register the clearing house's books reconcile against:
        every customer <-> clearing house flow, signed from the customer's side,
        with the journal transaction that posted it. A shortfall is an
        obligation the customer could not pay and the clearing house absorbed.
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { in: query, name: position_id, schema: { $ref: "#/components/schemas/UUID" } }
        - { in: query, name: kind, schema: { $ref: "#/components/schemas/DerivativeFlowKind" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of flows
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeFlowPage" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/funding-accruals:
    get:
      tags: [advanced]
      summary: Perpetual funding accrued to the account's positions, one row per position and interval, newest first
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { in: query, name: position_id, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of funding accruals
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeFundingAccrualPage" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/clearing-house/funding:
    post:
      tags: [advanced]
      summary: Capitalize the clearing house in a sandbox asset (operator; requires step-up)
      description: >-
        The clearing house is the counterparty of every paper trade, so a
        one-sided book is paid from its capital. Exactly once per Idempotency-Key
        and operator. Without asset_id the sandbox dollar is funded.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeClearingFundingRequest" } } }
      responses:
        "200":
          description: The funding journal (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeClearingFundingResult" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/derivatives/clearing-house/reconciliations:
    post:
      tags: [advanced]
      summary: Reconcile the clearing house's books against the flow register (operator; reconciliation kind CLEARING)
      description: >-
        CLEARING_RESULT must equal minus the register's net and the clearing
        house's books must balance. A difference opens (or refreshes) a material
        MISMATCH record, and while it is unresolved new derivative risk is
        refused (CLEARING_UNRECONCILED). It writes only that record, which is why
        it is a command. Without asset_id the sandbox dollar is reconciled.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeClearingReconcileRequest" } } }
      responses:
        "200":
          description: The reconciliation report
          content: { application/json: { schema: { $ref: "#/components/schemas/DerivativeClearingReport" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  # >>> advanced:equities paths (insert this subsystem's paths directly below; keep the marker)

  # >>> advanced:orders paths (insert this subsystem's paths directly below; keep the marker)

  # >>> advanced:transfers paths (insert this subsystem's paths directly below; keep the marker)
  #
  # Customer-to-customer transfers of simulated value (internal/transfers) and
  # the sandbox faucet (internal/sandboxfund). The transfer service decides
  # every rule itself -- eligibility, the P2P_TRANSFERS gate and kill
  # switches, step-up above its threshold, the versioned transfer policy,
  # Risk Kernel V2, the compliance screen, the reservation of the sender's
  # funds -- and these routes only carry its answer.
  /advanced/transfers:
    post:
      tags: [advanced]
      summary: Send simulated value from one of your own accounts to another customer
      description: >-
        A refusal the service reaches after accepting the request is RECORDED:
        the answer is the refusal's stable code (fields carry transfer_id,
        rejection_code and every reason_codes entry) and the transfer stays
        readable as a REJECTED row. A refusal before that (validation, an
        unknown recipient, a capability that is not enabled, step-up) writes
        nothing. Name the recipient by handle where you can: the handle is
        resolved on the server and the account id behind it is never returned
        to the sender.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferSendRequest" } } }
      responses:
        "201":
          description: The transfer is COMPLETED (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransfer" } } }
        "200":
          description: Idempotent replay of the original answer
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransfer" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      tags: [advanced]
      summary: Transfers an account sent or received, newest first
      description: >-
        A REJECTED attempt is the sender's record and is listed for the sender
        only; a received transfer is listed once it moved value (COMPLETED or
        REVERSED). A page can therefore hold fewer items than the limit while
        next_cursor is still set.
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of transfers
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferPage" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /advanced/transfers/{transferId}:
    get:
      tags: [advanced]
      summary: One transfer, to one of its parties; anyone else is told it does not exist
      parameters:
        - { in: path, name: transferId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: The transfer
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransfer" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /advanced/transfers/{transferId}/reverse:
    post:
      tags: [advanced]
      summary: Reverse a COMPLETED transfer with a compensating journal (operator correction; requires step-up)
      description: >-
        History is never edited: the reversal is a new COMPENSATION journal
        naming the original. It is refused (CONFLICT, rejection_code
        TRANSFER_REVERSAL_FUNDS_UNAVAILABLE) when the recipient no longer holds
        the funds, and reversing a REVERSED transfer returns it unchanged. The
        service also requires ledger:post_correction of the operator.
      parameters:
        - { in: path, name: transferId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferReverseRequest" } } }
      responses:
        "200":
          description: The transfer, REVERSED
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransfer" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /advanced/transfers/handles:
    post:
      tags: [advanced]
      summary: Register the handle other customers pay one of your accounts by
      description: >-
        An account has at most one handle and a handle names at most one
        account, for good: handles are never reassigned, so a payment to a
        handle can never reach a later holder. There is deliberately no route
        that resolves a handle to an account id.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferHandleRequest" } } }
      responses:
        "201":
          description: Handle registered
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferHandle" } } }
        "200":
          description: Idempotent replay of the original answer
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferHandle" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /advanced/transfers/recipient-rules:
    post:
      tags: [advanced]
      summary: Allow, block or clear one recipient for transfers from one of your accounts
      description: >-
        Rules are append-only and the latest one for a recipient is in force.
        ALLOW puts the recipient on the sender's allowlist, BLOCK refuses every
        transfer to it, CLEAR withdraws either.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferRecipientRuleRequest" } } }
      responses:
        "200":
          description: The rule is recorded and in force
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferRecipientRule" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /advanced/transfers/sender-mode:
    post:
      tags: [advanced]
      summary: Let one of your accounts pay anyone (OPEN) or only allowlisted recipients (ALLOWLIST_ONLY)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferSenderModeRequest" } } }
      responses:
        "200":
          description: The mode is recorded and in force
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferSenderModeSetting" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /advanced/transfers/reconciliation:
    get:
      tags: [advanced]
      summary: Reconcile the transfer register, its economic effects and the ledger (read-only)
      description: >-
        Proves from the database that no transfer is left PENDING, every
        settled transfer names the effect and journal it should, per party and
        asset TRANSFER_OUT and TRANSFER_IN equal the register, and the customer
        WALLET legs of every transfer journal cancel. Every discrepancy is a
        SEV1.
      parameters:
        - in: query
          name: asset_id
          schema: { $ref: "#/components/schemas/UUID" }
          description: Reconcile this asset only
      responses:
        "200":
          description: The reconciliation report
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedTransferReconciliation" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /advanced/transfers/faucet/grants:
    post:
      tags: [advanced]
      summary: Request sandbox dollars from the sandbox faucet into one of your own accounts
      description: >-
        Grants the sandbox dollar (SBX-USD, simulated, no economic value),
        within the faucet policy's rolling per-account cap (RATE_LIMITED
        beyond it). The faucet runs in LOCAL, TEST and DEV; anywhere else it
        answers CAPABILITY_NOT_APPROVED unless the deployment enables it.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedFaucetGrantRequest" } } }
      responses:
        "201":
          description: Granted (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedFaucetGrant" } } }
        "200":
          description: Idempotent replay of the original answer
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedFaucetGrant" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /advanced/transfers/faucet/allowance:
    get:
      tags: [advanced]
      summary: What the sandbox faucet would still grant an account in the current window
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: Cap, used and remaining, in base units of the sandbox dollar
          content: { application/json: { schema: { $ref: "#/components/schemas/AdvancedFaucetAllowance" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  # >>> advanced:treasury paths (insert this subsystem's paths directly below; keep the marker)
  #
  # The house book (internal/treasury) and the fee ledger (internal/feeledger),
  # SIMULATED value only. The treasury is the operator's: every route under
  # /advanced/treasury/books needs sandbox:operate, and anything that moves value,
  # changes a policy or a crossing rule a recent step-up. Two treasury reads are a
  # customer's as well: the crossing disclosures (what customers are told about
  # the house trading against them) and the trades in which a house book was the
  # caller's counterparty. Quantities are exact base units of the asset named;
  # house PnL figures are base units of the book's valuation asset. Prices in a
  # request are plain decimal strings in the book's valuation asset (or the fee
  # schedule's quote asset), taken exactly. A refused house action is recorded
  # by the treasury and answered with its stable code and reason codes.
  /advanced/treasury/books:
    get:
      tags: [advanced]
      summary: The registered house books, newest first
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: One page of house books (value domain SIMULATED)
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryBookPage" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [advanced]
      summary: Register a house book with its class, valuation asset and first signing policy
      description: >-
        The house book trades only its own house capital. The valuation asset defaults to the
        sandbox dollar and must be a SIMULATED, USD-pegged asset. A replay of the same name and
        key returns the book it created; another registration of the name is a CONFLICT.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryRegisterRequest" } } }
      responses:
        "200":
          description: The registered house book
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryBookDetail" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /advanced/treasury/books/{houseBookId}:
    get:
      tags: [advanced]
      summary: A house book with the signing policy and risk policy in force
      parameters:
        - { in: path, name: houseBookId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: The house book
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryBookDetail" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /advanced/treasury/books/{houseBookId}/actor-policy:
    post:
      tags: [advanced]
      summary: Record who may act for the book, the next version of its signing policy (it holds no keys; custody NONE_SANDBOX)
      parameters:
        - { in: path, name: houseBookId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TreasurySigningPolicyRequest" } } }
      responses:
        "200":
          description: The signing policy version recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasurySigningPolicy" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /advanced/treasury/books/{houseBookId}/limits:
    post:
      tags: [advanced]
      summary: Record the next version of the book's risk limits, stated in its valuation asset
      description: >-
        An asset with no inventory limit cannot be accumulated and an instrument with no exposure
        limit cannot be bought through: the limits fail closed. Neither stops a sale.
      parameters:
        - { in: path, name: houseBookId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryRiskPolicyRequest" } } }
      responses:
        "200":
          description: The risk policy version recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryRiskPolicy" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /advanced/treasury/books/{houseBookId}/fundings:
    post:
      tags: [advanced]
      summary: Inject simulated house capital into the book (HOUSE_FUNDING)
      description: Funding in any asset but the valuation asset enters the register at a fresh mark, and is refused without one.
      parameters:
        - { in: path, name: houseBookId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryFundRequest" } } }
      responses:
        "200":
          description: The funding, its journal and the action that recorded it
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryFunding" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/treasury/books/{houseBookId}/orders:
    post:
      tags: [advanced]
      summary: Place a house order on the internal book after every treasury control
      description: >-
        The signing policy, the capabilities, the risk policy's limits and Risk Kernel V2 decide
        under the book's lock; then the order book applies its own rules (house inventory
        reservations and the house-versus-customer crossing rule, refused by default). A refusal
        is recorded as a REJECTED action and answered with its code and reason codes.
      parameters:
        - { in: path, name: houseBookId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryOrderRequest" } } }
      responses:
        "200":
          description: The applied action, the order and the trades it made at once
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryOrderOutcome" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/treasury/books/{houseBookId}/orders/{orderId}/cancel:
    post:
      tags: [advanced]
      summary: Cancel a resting house order (never new risk; no kill switch stops it)
      parameters:
        - { in: path, name: houseBookId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/OrderId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: The applied cancel and the order after it
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryOrderOutcome" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /advanced/treasury/books/{houseBookId}/quotes:
    post:
      tags: [advanced]
      summary: Quote two-sided (a post-only GTC bid and ask, each its own house action)
      description: >-
        The bid is evaluated first, the ask against it. One leg can be refused while the other
        rests: each leg's action says APPLIED or REJECTED with its reason codes.
      parameters:
        - { in: path, name: houseBookId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryQuoteRequest" } } }
      responses:
        "200":
          description: Both legs
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryQuoteOutcome" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /advanced/treasury/books/{houseBookId}/hedges:
    post:
      tags: [advanced]
      summary: Hedge on the simulated paper venue (an immediate fill at a fresh mark, spread and fee disclosed)
      parameters:
        - { in: path, name: houseBookId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryHedgeRequest" } } }
      responses:
        "200":
          description: The applied action and the paper fill with its disclosure
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryPaperOutcome" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/treasury/books/{houseBookId}/conversions:
    post:
      tags: [advanced]
      summary: Treasury conversion between the valuation asset and one other sandbox asset
      parameters:
        - { in: path, name: houseBookId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryConvertRequest" } } }
      responses:
        "200":
          description: The applied action and the paper fill with its disclosure
          content: { application/json: { schema: { $ref: "#/components/schemas/TreasuryPaperOutcome" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /advanced/treasury/books/{houseBookId}/rebalances:
    post:
      tags: [advanced]
      summary: Move the book's holding of an asset to a target on the paper venue
      description: A holding already at its target needs no fill and records nothing (no_op).
      parameters:
        - { in: path, name: houseBookId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
