        reason: { type: string, minLength: 1, maxLength: 500 }
    TreasuryCrossingDisclosure:
      type: object
      required: [id, instrument_id, book_id, rule_version, allow, disclosure, reason, actor_type, actor_id, evidence_ref, evidence_sha256, disclosed_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        book_id: { $ref: "#/components/schemas/UUID" }
        rule_version: { type: integer }
        allow: { type: boolean }
        disclosure: { type: string }
        reason: { type: string }
        actor_type: { type: string }
        actor_id: { type: string }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        disclosed_at: { $ref: "#/components/schemas/Timestamp" }
    TreasuryCrossingDisclosureList:
      type: object
      required: [value_domain, instrument_id, items]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        items: { type: array, items: { $ref: "#/components/schemas/TreasuryCrossingDisclosure" } }
    TreasuryHouseTrade:
      type: object
      required: [trade_id, book_id, instrument_id, trade_seq, house_account_id, house_side, account_side, price, base_asset, quote_asset,
                 base_quantity, quote_notional, account_fee, crossing_rule_version, journal_transaction_id, traded_at]
      properties:
        trade_id: { $ref: "#/components/schemas/UUID" }
        book_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        trade_seq: { type: integer, format: int64 }
        house_account_id: { $ref: "#/components/schemas/UUID" }
        house_side: { $ref: "#/components/schemas/TreasurySide" }
        account_side: { $ref: "#/components/schemas/TreasurySide" }
        price: { $ref: "#/components/schemas/TreasuryPrice" }
        base_asset: { $ref: "#/components/schemas/TreasuryAssetRef" }
        quote_asset: { $ref: "#/components/schemas/TreasuryAssetRef" }
        base_quantity: { $ref: "#/components/schemas/Quantity" }
        quote_notional: { $ref: "#/components/schemas/Quantity" }
        account_fee: { $ref: "#/components/schemas/Quantity", description: "the fee the account paid on this trade, in the quote asset" }
        crossing_rule_version: { type: integer }
        disclosure: { type: string, description: "the customer disclosure recorded with that crossing rule version" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        traded_at: { $ref: "#/components/schemas/Timestamp" }
    TreasuryHouseTradePage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/TreasuryHouseTrade" } }
    FeeSide:
      type: string
      enum: [BUY, SELL]
      x-enum-varnames: [FeeSideBuy, FeeSideSell]
    FeeBookingMode:
      type: string
      enum: [POSTED, EMBEDDED]
      x-enum-varnames: [FeeBookingPosted, FeeBookingEmbedded]
      description: POSTED is the fee ledger's own journal; EMBEDDED charges were posted inside the trade's journal and verified.
    FeeBookingStatus:
      type: string
      enum: [BOOKED, REVERSED]
      x-enum-varnames: [FeeBookingBooked, FeeBookingReversed]
    FeePeriodStatus:
      type: string
      enum: [OPEN, CRYSTALLIZED, CANCELLED, REVERSED]
      x-enum-varnames: [FeePeriodOpen, FeePeriodCrystallized, FeePeriodCancelled, FeePeriodReversed]
    FeeLineKind:
      type: string
      enum: [ACCRUAL, REVERSAL, NO_CHANGE, CRYSTALLIZATION]
      x-enum-varnames: [FeeLineAccrual, FeeLineReversal, FeeLineNoChange, FeeLineCrystallization]
    FeeRounding:
      type: object
      required: [buy_notional, sell_notional, spread, percentage_fee, venue_pass_through, strategy_fee, fee_cap, slippage_reserve,
                 allow_platform_favourable]
      description: Every rounding mode the schedule uses (down, up, half_even, half_up, floor, ceil, exact).
      properties:
        buy_notional: { type: string }
        sell_notional: { type: string }
        spread: { type: string }
        percentage_fee: { type: string }
        venue_pass_through: { type: string }
        strategy_fee: { type: string }
        fee_cap: { type: string }
        slippage_reserve: { type: string }
        allow_platform_favourable: { type: boolean }
    FeeTier:
      type: object
      required: [min_trailing_volume_usd, overrides_percentage_fee, percentage_fee_bps, overrides_spread, spread_bps]
      properties:
        min_trailing_volume_usd: { $ref: "#/components/schemas/USD" }
        overrides_percentage_fee: { type: boolean }
        percentage_fee_bps: { $ref: "#/components/schemas/BPS" }
        overrides_spread: { type: boolean }
        spread_bps: { $ref: "#/components/schemas/BPS" }
    FeeSchedule:
      type: object
      required: [label, quote_asset_id, quote_decimals, spread_bps, fixed_fee, percentage_fee_bps, venue_pass_through_bps, network_fee_amount,
                 slippage_reserve_bps, subscription_discount_bps, tiers, strategy_fee_bps, max_total_fee_bps, max_total_fee, min_fee, rounding]
      description: >-
        One fee schedule, every component explicit. Amounts are base units of the quote asset (the
        network fee in its own asset); rates are basis points.
      properties:
        label: { type: string, minLength: 1, maxLength: 100, description: "the version label every quote records" }
        quote_asset_id: { $ref: "#/components/schemas/UUID" }
        quote_decimals: { type: integer, minimum: 0, maximum: 38 }
        spread_bps: { $ref: "#/components/schemas/BPS" }
        fixed_fee: { $ref: "#/components/schemas/Quantity" }
        percentage_fee_bps: { $ref: "#/components/schemas/BPS" }
        venue_pass_through_bps: { $ref: "#/components/schemas/BPS" }
        network_fee_asset_id: { $ref: "#/components/schemas/UUID" }
        network_fee_amount: { $ref: "#/components/schemas/Quantity" }
        slippage_reserve_bps: { $ref: "#/components/schemas/BPS" }
        subscription_discount_bps: { $ref: "#/components/schemas/BPS" }
        tiers: { type: array, items: { $ref: "#/components/schemas/FeeTier" } }
        strategy_fee_bps: { $ref: "#/components/schemas/BPS" }
        max_total_fee_bps: { $ref: "#/components/schemas/BPS" }
        max_total_fee: { $ref: "#/components/schemas/Quantity" }
        min_fee: { $ref: "#/components/schemas/Quantity" }
        rounding: { $ref: "#/components/schemas/FeeRounding" }
    FeeScheduleVersion:
      type: object
      required: [value_domain, id, key, version, schedule, schedule_hash, quote_asset, effective_from, published_at, actor_type, actor_id,
                 reason, in_force]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        key: { type: string }
        version: { type: integer, minimum: 1 }
        schedule: { $ref: "#/components/schemas/FeeSchedule" }
        schedule_hash: { type: string }
        quote_asset: { $ref: "#/components/schemas/TreasuryAssetRef" }
        effective_from: { $ref: "#/components/schemas/Timestamp" }
        published_at: { $ref: "#/components/schemas/Timestamp" }
        actor_type: { type: string }
        actor_id: { type: string }
        reason: { type: string }
        in_force: { type: boolean, description: "this version prices orders now" }
    FeeScheduleSummary:
      type: object
      required: [key, latest_version, version_count]
      properties:
        key: { type: string }
        latest_version: { type: integer }
        version_count: { type: integer }
        effective: { $ref: "#/components/schemas/FeeScheduleVersion", description: "the version in force now; absent when every version takes effect later" }
    FeeScheduleSummaryPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/FeeScheduleSummary" } }
    FeeScheduleHistory:
      type: object
      required: [value_domain, key, versions]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        key: { type: string }
        effective_version: { type: integer, description: "the version in force now; absent when none is yet" }
        versions: { type: array, items: { $ref: "#/components/schemas/FeeScheduleVersion" } }
    FeePublishRequest:
      type: object
      required: [key, schedule, reason]
      properties:
        key: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-z0-9][a-z0-9_.:/-]{0,127}$' }
        schedule: { $ref: "#/components/schemas/FeeSchedule" }
        effective_from: { $ref: "#/components/schemas/Timestamp", description: "now when absent; never in the past" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    FeePriceRecord:
      type: object
      required: [mantissa, scale, quote_asset, source, at]
      properties:
        mantissa: { $ref: "#/components/schemas/Quantity" }
        scale: { type: integer }
        quote_asset: { type: string }
        source: { type: string }
        at: { $ref: "#/components/schemas/Timestamp" }
    FeeDisclosedInput:
      type: object
      required: [side, base_qty, base_decimals, quote_decimals, reference_price, trailing_volume_usd, has_subscription, strategy_originated]
      properties:
        side: { $ref: "#/components/schemas/FeeSide" }
        base_qty: { $ref: "#/components/schemas/Quantity" }
        base_decimals: { type: integer }
        quote_decimals: { type: integer }
        reference_price: { $ref: "#/components/schemas/FeePriceRecord" }
        trailing_volume_usd: { $ref: "#/components/schemas/USD" }
        has_subscription: { type: boolean }
        strategy_originated: { type: boolean }
    FeeDisclosedFeeLine:
      type: object
      required: [component, rate_bps, discount_bps, fixed_amount, rounding, computed, cap_reduction, charged]
      properties:
        component: { type: string }
        rate_bps: { $ref: "#/components/schemas/BPS" }
        discount_bps: { $ref: "#/components/schemas/BPS" }
        fixed_amount: { $ref: "#/components/schemas/Quantity" }
        rounding: { type: string }
        computed: { $ref: "#/components/schemas/Quantity" }
        cap_reduction: { $ref: "#/components/schemas/Quantity" }
        charged: { $ref: "#/components/schemas/Quantity" }
    FeeDisclosedFees:
      type: object
      required: [lines, minimum_fee_top_up, computed_total, total, min_fee, max_total_fee_bps, max_total_fee_bps_amount,
                 max_total_fee_bps_rounding, max_total_fee, minimum_applied, max_bps_applied, max_absolute_applied]
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/FeeDisclosedFeeLine" } }
        minimum_fee_top_up: { $ref: "#/components/schemas/Quantity" }
        computed_total: { $ref: "#/components/schemas/Quantity" }
        total: { $ref: "#/components/schemas/Quantity" }
        min_fee: { $ref: "#/components/schemas/Quantity" }
        max_total_fee_bps: { $ref: "#/components/schemas/BPS" }
        max_total_fee_bps_amount: { $ref: "#/components/schemas/Quantity" }
        max_total_fee_bps_rounding: { type: string }
        max_total_fee: { $ref: "#/components/schemas/Quantity" }
        minimum_applied: { type: boolean }
        max_bps_applied: { type: boolean }
        max_absolute_applied: { type: boolean }
    FeeDisclosedMode:
      type: object
      required: [component, mode, favours_platform]
      properties:
        component: { type: string }
        mode: { type: string }
        favours_platform: { type: boolean }
    FeeDisclosure:
      type: object
      description: >-
        The canonical audit record of one quote: everything it charges, itemized, with the inputs
        and the rounding of every component. Quantities are base units of the quote asset (the
        network estimate in its own asset); the slippage reserve is held, never charged.
      required: [kind, schedule_version, schedule_hash, input, quote_asset, tier, reference_price, execution_price, notional_at_reference,
                 notional_at_execution, spread, fees, network, slippage_reserve, total_debit, total_credit, worst_case_total, effective_price,
                 rounding]
      properties:
        kind: { type: string }
        schedule_version: { type: string }
        schedule_hash: { type: string }
        input: { $ref: "#/components/schemas/FeeDisclosedInput" }
        quote_asset: { $ref: "#/components/schemas/UUID" }
        tier:
          type: object
          required: [index, min_trailing_volume_usd, percentage_fee_bps, spread_bps]
          properties:
            index: { type: integer, description: "-1 is the base schedule" }
            min_trailing_volume_usd: { $ref: "#/components/schemas/USD" }
            percentage_fee_bps: { $ref: "#/components/schemas/BPS" }
            spread_bps: { $ref: "#/components/schemas/BPS" }
        reference_price: { $ref: "#/components/schemas/FeePriceRecord" }
        execution_price: { $ref: "#/components/schemas/FeePriceRecord" }
        notional_at_reference: { $ref: "#/components/schemas/Quantity" }
        notional_at_execution: { $ref: "#/components/schemas/Quantity" }
        spread:
          type: object
          required: [bps, amount, rounding]
          properties:
            bps: { $ref: "#/components/schemas/BPS" }
            amount: { $ref: "#/components/schemas/Quantity" }
            rounding: { type: string }
        fees: { $ref: "#/components/schemas/FeeDisclosedFees" }
        network:
          type: object
          required: [asset, amount, in_quote_asset]
          properties:
            asset: { $ref: "#/components/schemas/UUID" }
            amount: { $ref: "#/components/schemas/Quantity" }
            in_quote_asset: { type: boolean }
        slippage_reserve:
          type: object
          required: [bps, amount, rounding, held_not_charged]
          properties:
            bps: { $ref: "#/components/schemas/BPS" }
            amount: { $ref: "#/components/schemas/Quantity" }
            rounding: { type: string }
            held_not_charged: { type: boolean }
        total_debit: { $ref: "#/components/schemas/Quantity" }
        total_credit: { $ref: "#/components/schemas/Quantity" }
        worst_case_total: { $ref: "#/components/schemas/Quantity" }
        effective_price: { $ref: "#/components/schemas/FeePriceRecord" }
        rounding:
          type: object
          required: [components, platform_favourable_allowed, any_favours_platform]
          properties:
            components: { type: array, items: { $ref: "#/components/schemas/FeeDisclosedMode" } }
            platform_favourable_allowed: { type: boolean }
            any_favours_platform: { type: boolean }
    FeeQuoteInput:
      type: object
      required: [schedule_key, side, base_quantity, base_decimals, reference_price]
      properties:
        schedule_key: { type: string, minLength: 1, maxLength: 128 }
        at: { $ref: "#/components/schemas/Timestamp", description: "the instant whose schedule prices the order; now when absent" }
        side: { $ref: "#/components/schemas/FeeSide" }
        base_quantity: { $ref: "#/components/schemas/Quantity" }
        base_decimals: { type: integer, minimum: 0, maximum: 38 }
        reference_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: "price of one whole base unit in the schedule's quote asset, exactly" }
        trailing_volume_usd: { $ref: "#/components/schemas/USD" }
        has_subscription: { type: boolean }
        strategy_originated: { type: boolean }
    FeeScheduleRef:
      type: object
      required: [id, key, version, label, schedule_hash, effective_from]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        key: { type: string }
        version: { type: integer }
        label: { type: string }
        schedule_hash: { type: string }
        effective_from: { $ref: "#/components/schemas/Timestamp" }
    FeeQuotePreview:
      type: object
      required: [value_domain, schedule, disclosure, disclosure_hash, charges, recorded]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        schedule: { $ref: "#/components/schemas/FeeScheduleRef" }
        disclosure: { $ref: "#/components/schemas/FeeDisclosure" }
        disclosure_hash: { type: string }
        charges: { $ref: "#/components/schemas/FeeCharges" }
        recorded: { type: boolean, description: "always false: a preview is never stored or charged" }
    FeeQuoteRecordRequest:
      allOf:
        - { $ref: "#/components/schemas/FeeQuoteInput" }
        - type: object
          required: [subsystem, mode]
          properties:
            subsystem: { type: string, description: "the subsystem the quote belongs to (ORDERS, TRANSFERS, ...)" }
            mode: { $ref: "#/components/schemas/AdvancedMode", description: "PAPER or SANDBOX" }
            account_id: { $ref: "#/components/schemas/UUID", description: "binds the quote to its payer: only that account can then be charged it" }
            base_asset_id: { $ref: "#/components/schemas/UUID" }
            source: { type: string, minLength: 1, maxLength: 100, description: "where the reference price came from" }
    FeeCharges:
      type: object
      required: [quote_asset_id, spread, platform, strategy, venue, network, network_in_quote]
      description: Everything a disclosure charges, component by component, as the ledger books it.
      properties:
        quote_asset_id: { $ref: "#/components/schemas/UUID" }
        spread: { $ref: "#/components/schemas/Quantity" }
        platform: { $ref: "#/components/schemas/Quantity", description: "fixed, percentage and minimum-fee top-up" }
        strategy: { $ref: "#/components/schemas/Quantity" }
        venue: { $ref: "#/components/schemas/Quantity" }
        network: { $ref: "#/components/schemas/Quantity" }
        network_asset_id: { $ref: "#/components/schemas/UUID" }
        network_in_quote: { type: boolean }
    FeeVerification:
      type: object
      required: [verified]
      properties:
        verified: { type: boolean }
        code: { type: string, description: "the stable error code when the record does not verify" }
        reason: { type: string }
        detail: { type: string }
    FeeQuoteRecord:
      type: object
      required: [value_domain, id, schedule_id, schedule_key, schedule_version, schedule_hash, subsystem, side, disclosure, disclosure_hash,
                 charges, quoted_at, valid_until]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        schedule_id: { $ref: "#/components/schemas/UUID" }
        schedule_key: { type: string }
        schedule_version: { type: integer }
        schedule_hash: { type: string }
        subsystem: { type: string }
        account_id: { $ref: "#/components/schemas/UUID" }
        base_asset_id: { $ref: "#/components/schemas/UUID" }
        side: { $ref: "#/components/schemas/FeeSide" }
        disclosure: { $ref: "#/components/schemas/FeeDisclosure" }
        disclosure_hash: { type: string }
        charges: { $ref: "#/components/schemas/FeeCharges" }
        quoted_at: { $ref: "#/components/schemas/Timestamp" }
        valid_until: { $ref: "#/components/schemas/Timestamp" }
        verification: { $ref: "#/components/schemas/FeeVerification", description: "present on a read by id" }
    FeeQuotePage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/FeeQuoteRecord" } }
    FeeSpreadLine:
      type: object
      required: [schedule_key, schedule_version, schedule_hash, disclosure_hash, side, base_quantity, reference_price, execution_price,
                 spread_bps, spread_amount, quote_asset_id]
