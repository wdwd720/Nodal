      properties:
        id: { $ref: "#/components/schemas/UUID" }
        funding_rate_id: { $ref: "#/components/schemas/UUID" }
        position_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        symbol: { type: string }
        interval_start: { $ref: "#/components/schemas/Timestamp" }
        interval_end: { $ref: "#/components/schemas/Timestamp" }
        quantity: { $ref: "#/components/schemas/Quantity", description: The position's signed contracts at the funding time (the interval end) }
        direction: { $ref: "#/components/schemas/DerivativeFundingDirection" }
        amount: { $ref: "#/components/schemas/Quantity", description: What the position paid or received for the interval (never negative; direction says which) }
        rate_e8: { type: integer, format: int64, description: The clamped funding rate in 10^-8 per interval }
        premium_index_e8: { type: integer, format: int64 }
        clamped: { type: boolean }
        per_contract_amount: { $ref: "#/components/schemas/Quantity" }
        mark_mantissa: { $ref: "#/components/schemas/Quantity", description: The last mark of the interval, which priced one contract's funding }
        price_scale: { type: integer }
        flow_id: { $ref: "#/components/schemas/UUID" }
        settlement_asset: { $ref: "#/components/schemas/DerivativeAsset" }
    DerivativeFundingAccrualPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items, value_domain]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/DerivativeFundingAccrual" } }
    DerivativeAnalyticsInputs:
      type: object
      required: [vol_bps, rate_bps, dividend_yield_bps]
      properties:
        vol_bps: { type: integer, format: int64 }
        rate_bps: { type: integer, format: int64 }
        dividend_yield_bps: { type: integer, format: int64 }
    DerivativeOptionAnalytics:
      type: object
      description: >-
        Reference values of a model, labelled as such by the service. Not a
        quote, not a settlement price, never posted, and not advice.
      required: [value_domain, label, model, instrument_id, right, style, regime, spot, strike, time_years, vol, price, delta, gamma,
                 theta_per_year, theta_per_day, vega, vega_per_vol_point, intrinsic, as_of, inputs, mark]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        label: { type: string, description: "The service's own label: a reference model value, not a quote" }
        model: { type: string }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        right: { type: string }
        style: { type: string }
        regime: { type: string }
        spot: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        strike: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        time_years: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        vol: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        price: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        delta: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        gamma: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        theta_per_year: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        theta_per_day: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        vega: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        vega_per_vol_point: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        intrinsic: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        time_value: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        implied_vol: { $ref: "#/components/schemas/DerivativeModelDecimal" }
        implied_vol_reason: { type: string, description: Why no implied volatility could be solved from the mark (a stable reason code) }
        as_of: { $ref: "#/components/schemas/Timestamp" }
        inputs: { $ref: "#/components/schemas/DerivativeAnalyticsInputs" }
        mark: { $ref: "#/components/schemas/DerivativeMark" }
    DerivativeRunRequest:
      type: object
      required: [interval_start]
      properties:
        interval_start: { $ref: "#/components/schemas/Timestamp", description: "On the interval grid: a whole number of intervals since the Unix epoch" }
    DerivativeRunResult:
      type: object
      required: [value_domain, kind, run_id, instrument_id, replay, interval_start, interval_end, settlement_asset, journal_transaction_ids]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        kind: { $ref: "#/components/schemas/DerivativeRunKind" }
        run_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        replay: { type: boolean, description: True when the interval had already been run; nothing was written and its flows are in the register }
        interval_start: { $ref: "#/components/schemas/Timestamp" }
        interval_end: { $ref: "#/components/schemas/Timestamp" }
        positions: { type: integer, description: Positions the run covered, when the service reported it }
        mark_id: { $ref: "#/components/schemas/UUID" }
        paid: { $ref: "#/components/schemas/Quantity", description: "Collected from payers; absent on a replay" }
        received: { $ref: "#/components/schemas/Quantity", description: "Paid to receivers; absent on a replay" }
        shortfall: { $ref: "#/components/schemas/Quantity", description: "What payers could not pay; absent on a replay" }
        premium_index_e8: { type: integer, format: int64 }
        rate_e8: { type: integer, format: int64 }
        clamped: { type: boolean }
        per_contract_amount: { $ref: "#/components/schemas/Quantity" }
        settlement_asset: { $ref: "#/components/schemas/DerivativeAsset" }
        journal_transaction_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
    DerivativeSettleRequest:
      type: object
      properties:
        price: { $ref: "#/components/schemas/DerivativeDecimal" }
        price_source: { type: string, description: Required with price }
    DerivativeSettlementResult:
      type: object
      required: [value_domain, settlement_id, instrument_id, kind, replay, price_mantissa, price_scale, positions, exercise_ids,
                 settlement_asset, journal_transaction_ids]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        settlement_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/DerivativeSettlementKind" }
        replay: { type: boolean }
        price_mantissa: { $ref: "#/components/schemas/Quantity" }
        price_scale: { type: integer }
        positions: { type: integer }
        paid: { $ref: "#/components/schemas/Quantity", description: "Absent on a replay" }
        received: { $ref: "#/components/schemas/Quantity", description: "Absent on a replay" }
        shortfall: { $ref: "#/components/schemas/Quantity", description: "Absent on a replay" }
        intrinsic_per_contract: { $ref: "#/components/schemas/Quantity", description: "Options only; absent on a replay" }
        exercise_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        settlement_asset: { $ref: "#/components/schemas/DerivativeAsset" }
        journal_transaction_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
    DerivativeClearingFundingRequest:
      type: object
      required: [quantity]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity", description: Base units of the asset; positive }
    DerivativeClearingFundingResult:
      type: object
      required: [value_domain, asset, quantity, journal_transaction_ids]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        asset: { $ref: "#/components/schemas/DerivativeAsset" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        journal_transaction_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
    DerivativeClearingReconcileRequest:
      type: object
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
    DerivativeOpenInterest:
      type: object
      required: [instrument_id, quantity]
      properties:
        instrument_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
    DerivativeClearingReport:
      type: object
      required: [value_domain, clearing_house_id, asset, holdings, capital, result, register_net, register_shortfall, flows,
                 expected_result, difference, net_open_interest, internally_matched, matched]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        clearing_house_id: { $ref: "#/components/schemas/UUID" }
        asset: { $ref: "#/components/schemas/DerivativeAsset" }
        holdings: { $ref: "#/components/schemas/Quantity", description: "The clearing house's CLEARING_CASH ledger balance" }
        capital: { $ref: "#/components/schemas/Quantity", description: "The clearing house's CLEARING_CAPITAL ledger balance" }
        result: { $ref: "#/components/schemas/Quantity", description: "The clearing house's CLEARING_RESULT ledger balance" }
        register_net: { $ref: "#/components/schemas/Quantity", description: "The sum of the register's customer-side amounts" }
        register_shortfall: { $ref: "#/components/schemas/Quantity" }
        flows: { type: integer, format: int64 }
        expected_result: { $ref: "#/components/schemas/Quantity", description: "Minus register_net: what CLEARING_RESULT must be" }
        difference: { $ref: "#/components/schemas/Quantity", description: "result minus expected_result" }
        net_open_interest: { type: array, items: { $ref: "#/components/schemas/DerivativeOpenInterest" } }
        internally_matched: { type: boolean }
        matched: { type: boolean, description: The books agree with the register and balance }
        record_id: { $ref: "#/components/schemas/UUID", description: The CLEARING reconciliation record opened or refreshed for a mismatch, or still unresolved }

    # >>> advanced:equities schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:orders schemas (insert this subsystem's schemas directly below; keep the marker)

    # >>> advanced:transfers schemas (insert this subsystem's schemas directly below; keep the marker)
    #
    # The enums carry x-enum-varnames so their Go constants can never collide
    # with another schema's (ALLOW and OPEN already exist unprefixed).
    AdvancedTransferStatus:
      type: string
      enum: [PENDING, COMPLETED, REJECTED, REVERSED]
      x-enum-varnames: [TransferStatusPending, TransferStatusCompleted, TransferStatusRejected, TransferStatusReversed]
      description: PENDING exists only inside the transaction that decides a transfer; a committed transfer is COMPLETED, REJECTED or REVERSED.
    AdvancedTransfer:
      type: object
      description: >-
        One customer-to-customer transfer of simulated value. What a reader
        sees depends on who they are: the sender sees their whole record but
        not the account id behind a handle they paid; a recipient sees a
        transfer once it moved value, without the sender's decision record or
        the reversal reason; an operator holding account:read_any sees
        everything.
      required: [id, intent_id, status, sender_account_id, asset_id, asset_symbol, asset_decimals, quantity, notional_usd,
                 mode, reason_codes, policy_version, policy_hash, created_at, updated_at, value_domain]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        intent_id: { $ref: "#/components/schemas/UUID" }
        status: { $ref: "#/components/schemas/AdvancedTransferStatus" }
        sender_account_id: { $ref: "#/components/schemas/UUID" }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string, description: The handle the sender named the recipient by (absent when named by account id) }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_symbol: { type: string }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        notional_usd: { $ref: "#/components/schemas/USD" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        memo: { type: string, description: Visible to the two parties only and never in a journal or an event or a notification }
        rejection_code: { type: string, description: The primary stable code of a REJECTED transfer }
        reason_codes: { type: array, items: { type: string }, description: Every code that applied to a REJECTED transfer with the primary first }
        policy_version: { type: string }
        policy_hash: { type: string }
        risk_decision_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        decided_at: { $ref: "#/components/schemas/Timestamp" }
        reversal_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        reversal_reason_code: { type: string }
        reversed_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedTransferPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items, value_domain]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdvancedTransfer" } }
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedTransferSendRequest:
      type: object
      description: >-
        Name the recipient by exactly one of recipient_handle or
        recipient_account_id, and the value by exactly one of amount (a plain
        decimal in whole units of the asset, never rounded: more fractional
        digits than the asset has is PRECISION_LOSS) or quantity (exact base
        units). asset_id defaults to the sandbox dollar.
      required: [account_id, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string, maxLength: 33, pattern: '^@?[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$' }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        amount: { type: string, maxLength: 64, pattern: '^[0-9]+(\.[0-9]+)?$' }
        quantity: { $ref: "#/components/schemas/Quantity" }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        memo: { type: string, maxLength: 280, description: Printable text without surrounding whitespace; the transfer policy may bound it lower }
    AdvancedTransferReverseRequest:
      type: object
      required: [reason_code, reason]
      properties:
        reason_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$', examples: ["FRAUD_CONFIRMED"] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdvancedTransferHandleRequest:
      type: object
      required: [account_id, handle]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        handle:
          type: string
          maxLength: 33
          pattern: '^@?[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$'
          description: 3..32 characters of a-z, 0-9, '_', '.', '-' starting with a letter or digit; a leading '@' is dropped and the handle is lower-cased
    AdvancedTransferHandle:
      type: object
      required: [id, account_id, handle, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        handle: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    AdvancedTransferRecipientRuleKind:
      type: string
      enum: [ALLOW, BLOCK, CLEAR]
      x-enum-varnames: [TransferRuleAllow, TransferRuleBlock, TransferRuleClear]
    AdvancedTransferRecipientRuleRequest:
      type: object
      description: Name the recipient by exactly one of recipient_handle or recipient_account_id.
      required: [account_id, rule]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string, maxLength: 33, pattern: '^@?[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$' }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        rule: { $ref: "#/components/schemas/AdvancedTransferRecipientRuleKind" }
        reason: { type: string, maxLength: 500 }
    AdvancedTransferRecipientRule:
      type: object
      description: The rule as recorded; the recipient is named the way the request named it.
      required: [account_id, rule]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        recipient_handle: { type: string }
        recipient_account_id: { $ref: "#/components/schemas/UUID" }
        rule: { $ref: "#/components/schemas/AdvancedTransferRecipientRuleKind" }
        reason: { type: string }
    AdvancedTransferSenderMode:
      type: string
      enum: [OPEN, ALLOWLIST_ONLY]
      x-enum-varnames: [TransferSenderOpen, TransferSenderAllowlistOnly]
    AdvancedTransferSenderModeRequest:
      type: object
      required: [account_id, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/AdvancedTransferSenderMode" }
    AdvancedTransferSenderModeSetting:
      type: object
      required: [account_id, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/AdvancedTransferSenderMode" }
    AdvancedTransferAssetIdentity:
      type: object
      description: >-
        The clearing identity of one asset: TRANSFER_OUT = TRANSFER_IN = the
        register's COMPLETED quantity, and the customer WALLET change over every
        transfer journal and reversal is zero.
      required: [asset_id, transfer_out, transfer_in, register_completed, wallet_delta]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        transfer_out: { $ref: "#/components/schemas/Quantity" }
        transfer_in: { $ref: "#/components/schemas/Quantity" }
        register_completed: { $ref: "#/components/schemas/Quantity" }
        wallet_delta: { $ref: "#/components/schemas/Quantity" }
    AdvancedTransferDiscrepancy:
      type: object
      required: [code, detail]
      properties:
        code: { type: string }
        transfer_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        detail: { type: string }
    AdvancedTransferReconciliation:
      type: object
      required: [checked_at, transfers, ok, assets, discrepancies, value_domain]
      properties:
        checked_at: { $ref: "#/components/schemas/Timestamp" }
        transfers: { type: integer, description: Transfers in scope whatever their status }
        ok: { type: boolean }
        assets: { type: array, items: { $ref: "#/components/schemas/AdvancedTransferAssetIdentity" } }
        discrepancies: { type: array, items: { $ref: "#/components/schemas/AdvancedTransferDiscrepancy" } }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedFaucetGrantRequest:
      type: object
      description: >-
        The value is exactly one of amount (a plain decimal in whole sandbox
        dollars, never rounded) or quantity (exact base units; the sandbox
        dollar has 6 decimals).
      required: [account_id]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        amount: { type: string, maxLength: 64, pattern: '^[0-9]+(\.[0-9]+)?$' }
        quantity: { $ref: "#/components/schemas/Quantity" }
    AdvancedFaucetGrant:
      type: object
      required: [id, account_id, asset_id, asset_symbol, asset_decimals, quantity, policy_version, policy_hash, environment,
                 effect_id, journal_transaction_id, granted_at, value_domain]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_symbol: { type: string }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        policy_version: { type: string }
        policy_hash: { type: string }
        environment: { type: string }
        effect_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        granted_at: { $ref: "#/components/schemas/Timestamp" }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
    AdvancedFaucetAllowance:
      type: object
      description: >-
        cap is the faucet policy's per-account limit for the rolling window,
        used is what the account was granted inside it, and remaining is
        cap - used (never below zero), all in base units of the sandbox dollar.
      required: [account_id, asset_id, asset_symbol, asset_decimals, cap, used, remaining, window_ms, policy_version,
                 policy_hash, environment, value_domain]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        asset_symbol: { type: string }
        asset_decimals: { type: integer, minimum: 0, maximum: 18 }
        cap: { $ref: "#/components/schemas/Quantity" }
        used: { $ref: "#/components/schemas/Quantity" }
        remaining: { $ref: "#/components/schemas/Quantity" }
        window_ms: { type: integer, format: int64 }
        policy_version: { type: string }
        policy_hash: { type: string }
        environment: { type: string }
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }

    # >>> advanced:treasury schemas (insert this subsystem's schemas directly below; keep the marker)
    #
    # The house book (internal/treasury) and the fee ledger (internal/feeledger).
    # Every enum carries x-enum-varnames so its Go constants never collide with
    # another schema's (BUY, OPEN, ACTIVE and REJECTED already exist unprefixed).
    TreasuryClass:
      type: string
      enum: [PRINCIPAL, TREASURY]
      x-enum-varnames: [TreasuryClassPrincipal, TreasuryClassTreasury]
      description: PRINCIPAL provides liquidity, makes markets and hedges; TREASURY rebalances inventory and converts.
    TreasuryStrategy:
      type: string
      enum: [LIQUIDITY_PROVISION, MARKET_MAKING, HEDGING, INVENTORY_REBALANCING, TREASURY_CONVERSION]
      x-enum-varnames: [TreasuryStrategyLiquidityProvision, TreasuryStrategyMarketMaking, TreasuryStrategyHedging,
                        TreasuryStrategyInventoryRebalancing, TreasuryStrategyTreasuryConversion]
    TreasuryBookStatus:
      type: string
      enum: [ACTIVE, KILLED, CLOSED]
      x-enum-varnames: [TreasuryBookActive, TreasuryBookKilled, TreasuryBookClosed]
    TreasuryActionKind:
      type: string
      enum: [REGISTER, SET_POLICY, SET_SIGNING_POLICY, FUND, PLACE_ORDER, CANCEL_ORDER, PAPER_FILL, MARK_TO_MARKET]
      x-enum-varnames: [TreasuryActionRegister, TreasuryActionSetPolicy, TreasuryActionSetSigningPolicy, TreasuryActionFund,
                        TreasuryActionPlaceOrder, TreasuryActionCancelOrder, TreasuryActionPaperFill, TreasuryActionMarkToMarket]
    TreasuryOutcome:
      type: string
      enum: [APPLIED, REJECTED]
      x-enum-varnames: [TreasuryOutcomeApplied, TreasuryOutcomeRejected]
    TreasurySide:
      type: string
      enum: [BUY, SELL]
      x-enum-varnames: [TreasurySideBuy, TreasurySideSell]
    TreasuryOrderType:
      type: string
      enum: [LIMIT, MARKET]
      x-enum-varnames: [TreasuryOrderLimit, TreasuryOrderMarket]
    TreasuryTimeInForce:
      type: string
      enum: [GTC, IOC, FOK]
      x-enum-varnames: [TreasuryTifGTC, TreasuryTifIOC, TreasuryTifFOK]
    TreasuryOrderStatus:
      type: string
      enum: [PENDING, OPEN, PARTIALLY_FILLED, FILLED, CANCELLED, REJECTED]
      x-enum-varnames: [TreasuryOrderPending, TreasuryOrderOpen, TreasuryOrderPartiallyFilled, TreasuryOrderFilled,
                        TreasuryOrderCancelled, TreasuryOrderRejected]
    TreasuryOwnerType:
      type: string
      enum: [CUSTOMER, HOUSE]
      x-enum-varnames: [TreasuryOwnerCustomer, TreasuryOwnerHouse]
    TreasuryEventKind:
      type: string
      enum: [FUNDING, BOOK_FILL, PAPER_FILL]
      x-enum-varnames: [TreasuryEventFunding, TreasuryEventBookFill, TreasuryEventPaperFill]
    TreasuryDirection:
      type: string
      enum: [INCREASE, DECREASE]
      x-enum-varnames: [TreasuryDirectionIncrease, TreasuryDirectionDecrease]
    TreasuryVerdict:
      type: string
      enum: [ALLOW, REJECT]
      x-enum-varnames: [TreasuryVerdictAllow, TreasuryVerdictReject]
    TreasuryLimitKind:
      type: string
      enum: [DAILY_LOSS, INVENTORY, INSTRUMENT_EXPOSURE]
      x-enum-varnames: [TreasuryLimitDailyLoss, TreasuryLimitInventory, TreasuryLimitInstrumentExposure]
    TreasuryAssetRef:
      type: object
      required: [asset_id, symbol, decimals]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0, maximum: 38 }
    TreasuryPrice:
      type: object
      required: [mantissa, scale]
      description: The price of one whole unit, exactly mantissa × 10^-scale, in the quote asset named by the record that carries it.
      properties:
        mantissa: { $ref: "#/components/schemas/Quantity" }
        scale: { type: integer }
        source: { type: string }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
    TreasurySigningPolicy:
      type: object
      required: [house_account_id, version, key_custody, service_actor_id, operators_allowed, policy_hash, actor_type, actor_id, reason, effective_at]
      properties:
        house_account_id: { $ref: "#/components/schemas/UUID" }
        version: { type: integer, minimum: 1 }
        key_custody: { type: string, description: "Always NONE_SANDBOX: a sandbox house book holds no keys." }
        service_actor_id: { type: string, description: "The one SERVICE actor that may act for the book." }
        operators_allowed: { type: boolean, description: "Whether operators may place orders and fills too (they may always cancel and administer)." }
        policy_hash: { type: string }
        actor_type: { type: string }
        actor_id: { type: string }
        reason: { type: string }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
    TreasuryAssetLimit:
      type: object
      required: [asset_id, max_quantity]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        max_quantity: { $ref: "#/components/schemas/Quantity", description: "base units of the asset, counting every working buy" }
    TreasuryInstrumentLimit:
      type: object
      required: [instrument_id, max_exposure]
      properties:
        instrument_id: { $ref: "#/components/schemas/UUID" }
        max_exposure: { $ref: "#/components/schemas/Quantity", description: "valuation-asset base units: the base held at a mark plus the working buy notional" }
    TreasuryRiskPolicy:
      type: object
      required: [house_account_id, version, label, policy_hash, valuation_asset_id, daily_loss_limit, max_mark_age_ms, max_inventory,
                 max_instrument_exposure, paper_spread_bps, paper_fee_bps, actor_type, actor_id, reason, effective_at]
      properties:
        house_account_id: { $ref: "#/components/schemas/UUID" }
        version: { type: integer, minimum: 1 }
        label: { type: string }
        policy_hash: { type: string }
        valuation_asset_id: { $ref: "#/components/schemas/UUID" }
        daily_loss_limit: { $ref: "#/components/schemas/Quantity" }
        max_mark_age_ms: { type: integer, format: int64 }
        max_inventory: { type: array, items: { $ref: "#/components/schemas/TreasuryAssetLimit" } }
        max_instrument_exposure: { type: array, items: { $ref: "#/components/schemas/TreasuryInstrumentLimit" } }
        paper_spread_bps: { $ref: "#/components/schemas/BPS" }
        paper_fee_bps: { $ref: "#/components/schemas/BPS" }
        actor_type: { type: string }
        actor_id: { type: string }
        reason: { type: string }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
    TreasuryBook:
      type: object
      required: [value_domain, house_account_id, name, strategy, class, status, valuation_asset, version, permitted_activities,
                 registered_by_actor_type, registered_by_actor_id, registered_at]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        house_account_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        strategy: { $ref: "#/components/schemas/TreasuryStrategy" }
        class: { $ref: "#/components/schemas/TreasuryClass" }
        status: { $ref: "#/components/schemas/TreasuryBookStatus" }
        valuation_asset: { $ref: "#/components/schemas/TreasuryAssetRef" }
        version: { type: integer, format: int64 }
        permitted_activities: { type: array, items: { $ref: "#/components/schemas/TreasuryStrategy" } }
        registered_by_actor_type: { type: string }
        registered_by_actor_id: { type: string }
        registered_at: { $ref: "#/components/schemas/Timestamp" }
    TreasuryBookDetail:
      allOf:
        - { $ref: "#/components/schemas/TreasuryBook" }
        - type: object
          required: [signing_policy]
          properties:
            signing_policy: { $ref: "#/components/schemas/TreasurySigningPolicy" }
            risk_policy: { $ref: "#/components/schemas/TreasuryRiskPolicy", description: "absent until a risk policy is recorded; without one every house order and fill is refused" }
    TreasuryBookPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/TreasuryBook" } }
    TreasuryRegisterRequest:
      type: object
      required: [name, strategy, service_actor_id, operators_allowed, reason]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        strategy: { $ref: "#/components/schemas/TreasuryStrategy" }
        valuation_asset_id: { $ref: "#/components/schemas/UUID", description: "defaults to the sandbox dollar" }
        service_actor_id: { type: string, minLength: 1, maxLength: 100 }
        operators_allowed: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 500 }
    TreasurySigningPolicyRequest:
      type: object
      required: [service_actor_id, operators_allowed, reason]
      properties:
        service_actor_id: { type: string, minLength: 1, maxLength: 100 }
        operators_allowed: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 500 }
    TreasuryRiskPolicyRequest:
      type: object
      required: [label, daily_loss_limit, max_mark_age_ms, max_inventory, max_instrument_exposure, paper_spread_bps, paper_fee_bps, reason]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        daily_loss_limit: { $ref: "#/components/schemas/Quantity" }
        max_mark_age_ms: { type: integer, format: int64, minimum: 1, maximum: 86400000 }
        max_inventory: { type: array, maxItems: 256, items: { $ref: "#/components/schemas/TreasuryAssetLimit" } }
        max_instrument_exposure: { type: array, maxItems: 256, items: { $ref: "#/components/schemas/TreasuryInstrumentLimit" } }
        paper_spread_bps: { $ref: "#/components/schemas/BPS" }
        paper_fee_bps: { $ref: "#/components/schemas/BPS" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    TreasuryAction:
      type: object
      required: [id, house_account_id, kind, outcome, reason_codes, actor_type, actor_id, signing_policy_version, idempotency_key, occurred_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        house_account_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/TreasuryActionKind" }
        activity: { $ref: "#/components/schemas/TreasuryStrategy" }
        outcome: { $ref: "#/components/schemas/TreasuryOutcome" }
        rejection_code: { type: string }
        reason_codes: { type: array, items: { type: string } }
        actor_type: { type: string }
        actor_id: { type: string }
        signing_policy_version: { type: integer }
        risk_policy_version: { type: integer }
        idempotency_key: { type: string }
        risk_decision_id: { $ref: "#/components/schemas/UUID" }
        order_id: { $ref: "#/components/schemas/UUID" }
        paper_fill_id: { $ref: "#/components/schemas/UUID" }
        funding_id: { $ref: "#/components/schemas/UUID" }
        policy_id: { $ref: "#/components/schemas/UUID" }
        signing_policy_id: { $ref: "#/components/schemas/UUID" }
        snapshot_id: { $ref: "#/components/schemas/UUID" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        evidence_sha256: { type: string }
        correlation_id: { type: string }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
    TreasuryActionList:
      type: object
      required: [value_domain, items]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        items: { type: array, items: { $ref: "#/components/schemas/TreasuryAction" } }
    TreasuryFundRequest:
      type: object
      required: [asset_id, quantity, reason]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        mode: { $ref: "#/components/schemas/AdvancedMode", description: "PAPER (default) or SANDBOX" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    TreasuryFunding:
      type: object
      required: [value_domain, id, house_account_id, asset, quantity, cost_basis, effect_id, journal_transaction_id, evidence_ref, funded_at, action]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        house_account_id: { $ref: "#/components/schemas/UUID" }
        asset: { $ref: "#/components/schemas/TreasuryAssetRef" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        cost_basis: { $ref: "#/components/schemas/Quantity", description: "valuation-asset base units the funding entered the register at" }
        mark: { $ref: "#/components/schemas/TreasuryPrice" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        funded_at: { $ref: "#/components/schemas/Timestamp" }
        action: { $ref: "#/components/schemas/TreasuryAction" }
    TreasuryOrderRequest:
      type: object
      required: [instrument_id, activity, side, order_type, time_in_force, price, quantity]
      properties:
        instrument_id: { $ref: "#/components/schemas/UUID" }
        activity: { $ref: "#/components/schemas/TreasuryStrategy" }
        side: { $ref: "#/components/schemas/TreasurySide" }
        order_type: { $ref: "#/components/schemas/TreasuryOrderType" }
        time_in_force: { $ref: "#/components/schemas/TreasuryTimeInForce" }
        price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: "the limit price (or a market order's protection price) in the book's valuation asset, exactly" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        post_only: { type: boolean }
        reduce_only: { type: boolean }
        client_order_id: { type: string, minLength: 1, maxLength: 128 }
    TreasuryQuoteRequest:
      type: object
      required: [instrument_id, activity, bid_price, bid_quantity, ask_price, ask_quantity]
      properties:
        instrument_id: { $ref: "#/components/schemas/UUID" }
        activity: { $ref: "#/components/schemas/TreasuryStrategy", description: "MARKET_MAKING or LIQUIDITY_PROVISION" }
        bid_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        bid_quantity: { $ref: "#/components/schemas/Quantity" }
        ask_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        ask_quantity: { $ref: "#/components/schemas/Quantity" }
    TreasuryHouseOrder:
      type: object
      required: [id, book_id, instrument_id, house_account_id, side, order_type, time_in_force, post_only, reduce_only, mode, price,
                 quantity, filled_quantity, remaining_quantity, cancelled_quantity, status, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        book_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        house_account_id: { $ref: "#/components/schemas/UUID" }
        client_order_id: { type: string }
        side: { $ref: "#/components/schemas/TreasurySide" }
        order_type: { $ref: "#/components/schemas/TreasuryOrderType" }
        time_in_force: { $ref: "#/components/schemas/TreasuryTimeInForce" }
        post_only: { type: boolean }
        reduce_only: { type: boolean }
        mode: { $ref: "#/components/schemas/AdvancedMode" }
        price: { type: string, description: "the limit price as the book states it" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        filled_quantity: { $ref: "#/components/schemas/Quantity" }
        remaining_quantity: { $ref: "#/components/schemas/Quantity" }
        cancelled_quantity: { $ref: "#/components/schemas/Quantity" }
        status: { $ref: "#/components/schemas/TreasuryOrderStatus" }
        reject_reason: { type: string }
        cancel_reason: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    TreasuryTrade:
      type: object
      required: [id, book_id, trade_seq, price, base_quantity, quote_notional, maker_order_id, taker_order_id, maker_owner_type,
                 taker_owner_type, aggressor_side, maker_fee, taker_fee, crossing_rule_version, journal_transaction_id]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        book_id: { $ref: "#/components/schemas/UUID" }
        trade_seq: { type: integer, format: int64 }
        price: { $ref: "#/components/schemas/TreasuryPrice" }
        base_quantity: { $ref: "#/components/schemas/Quantity" }
        quote_notional: { $ref: "#/components/schemas/Quantity" }
        maker_order_id: { $ref: "#/components/schemas/UUID" }
        taker_order_id: { $ref: "#/components/schemas/UUID" }
        maker_owner_type: { $ref: "#/components/schemas/TreasuryOwnerType" }
        taker_owner_type: { $ref: "#/components/schemas/TreasuryOwnerType" }
        aggressor_side: { $ref: "#/components/schemas/TreasurySide" }
        maker_fee: { $ref: "#/components/schemas/Quantity" }
        taker_fee: { $ref: "#/components/schemas/Quantity" }
        crossing_rule_version: { type: integer, description: "0 when no house book traded with a customer" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
    TreasuryLimitEvaluation:
      type: object
      required: [risk_increasing, codes, circuit_breakers, loss_measure, daily_loss_limit, missing_marks, inventory_after]
      properties:
        risk_increasing: { type: boolean }
        codes: { type: array, items: { type: string } }
        circuit_breakers: { type: array, items: { type: string } }
        loss_measure: { $ref: "#/components/schemas/Quantity", description: "realized PnL of the UTC day plus every open loss (negative is a loss)" }
        daily_loss_limit: { $ref: "#/components/schemas/Quantity" }
        missing_marks: { type: array, items: { type: string } }
        inventory_after: { $ref: "#/components/schemas/Quantity" }
        inventory_cap: { $ref: "#/components/schemas/Quantity" }
        exposure_after: { $ref: "#/components/schemas/Quantity" }
        exposure_cap: { $ref: "#/components/schemas/Quantity" }
    TreasuryRiskDecision:
      type: object
      required: [id, verdict, reason_codes, treasury_codes, decision_hash, input_hash]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        verdict: { $ref: "#/components/schemas/TreasuryVerdict" }
        reason_codes: { type: array, items: { type: string } }
        treasury_codes: { type: array, items: { type: string } }
        decision_hash: { type: string }
        input_hash: { type: string }
        limits: { $ref: "#/components/schemas/TreasuryLimitEvaluation", description: "present when the decision was just made" }
    TreasuryOrderOutcome:
      type: object
      required: [value_domain, action, trades]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        action: { $ref: "#/components/schemas/TreasuryAction" }
        order: { $ref: "#/components/schemas/TreasuryHouseOrder" }
        trades: { type: array, items: { $ref: "#/components/schemas/TreasuryTrade" } }
        decision: { $ref: "#/components/schemas/TreasuryRiskDecision" }
    TreasuryQuoteOutcome:
      type: object
      required: [value_domain, bid, ask]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        bid: { $ref: "#/components/schemas/TreasuryOrderOutcome" }
        ask: { $ref: "#/components/schemas/TreasuryOrderOutcome" }
    TreasuryHedgeRequest:
      type: object
      required: [asset_id, side, quantity]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        side: { $ref: "#/components/schemas/TreasurySide" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        mode: { $ref: "#/components/schemas/AdvancedMode", description: "PAPER (default) or SANDBOX" }
    TreasuryPaperRequest:
      type: object
      required: [activity, asset_id, side, quantity]
      properties:
        activity: { $ref: "#/components/schemas/TreasuryStrategy" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        side: { $ref: "#/components/schemas/TreasurySide" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        mode: { $ref: "#/components/schemas/AdvancedMode", description: "PAPER (default) or SANDBOX" }
    TreasuryConvertRequest:
      type: object
      required: [from_asset_id, to_asset_id, quantity]
      properties:
        from_asset_id: { $ref: "#/components/schemas/UUID" }
        to_asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity", description: "base units of the asset that is not the valuation asset" }
        mode: { $ref: "#/components/schemas/AdvancedMode", description: "PAPER (default) or SANDBOX" }
    TreasuryRebalanceRequest:
      type: object
      required: [asset_id, target]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        target: { $ref: "#/components/schemas/Quantity", description: "the holding the book should end with, in base units" }
        mode: { $ref: "#/components/schemas/AdvancedMode", description: "PAPER (default) or SANDBOX" }
    TreasuryPaperFill:
      type: object
      required: [id, house_account_id, activity, venue_label, side, base_asset, quote_asset, base_quantity, reference_price,
                 notional_at_reference, spread_bps, spread_amount, fee_amount, total_quote, schedule_hash, disclosure_hash, disclosure,
                 effect_id, journal_transaction_id, evidence_ref, filled_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        house_account_id: { $ref: "#/components/schemas/UUID" }
        activity: { $ref: "#/components/schemas/TreasuryStrategy" }
        venue_label: { type: string, description: "Always SIMULATED_PAPER_VENUE." }
        side: { $ref: "#/components/schemas/TreasurySide" }
        base_asset: { $ref: "#/components/schemas/TreasuryAssetRef" }
        quote_asset: { $ref: "#/components/schemas/TreasuryAssetRef" }
        base_quantity: { $ref: "#/components/schemas/Quantity" }
        reference_price: { $ref: "#/components/schemas/TreasuryPrice" }
        notional_at_reference: { $ref: "#/components/schemas/Quantity" }
        spread_bps: { $ref: "#/components/schemas/BPS" }
        spread_amount: { $ref: "#/components/schemas/Quantity" }
        fee_amount: { $ref: "#/components/schemas/Quantity" }
        total_quote: { $ref: "#/components/schemas/Quantity" }
        schedule_hash: { type: string }
        disclosure_hash: { type: string }
        disclosure: { $ref: "#/components/schemas/FeeDisclosure" }
        effect_id: { $ref: "#/components/schemas/UUID" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        evidence_ref: { type: string }
        filled_at: { $ref: "#/components/schemas/Timestamp" }
    TreasuryPaperOutcome:
      type: object
      required: [value_domain, action]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        action: { $ref: "#/components/schemas/TreasuryAction" }
        fill: { $ref: "#/components/schemas/TreasuryPaperFill" }
        decision: { $ref: "#/components/schemas/TreasuryRiskDecision" }
    TreasuryRebalanceOutcome:
      type: object
      required: [value_domain, no_op]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        no_op: { type: boolean, description: "the holding was already at its target: nothing was filled or recorded" }
        action: { $ref: "#/components/schemas/TreasuryAction" }
        fill: { $ref: "#/components/schemas/TreasuryPaperFill" }
        decision: { $ref: "#/components/schemas/TreasuryRiskDecision" }
    TreasuryPaperFillPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [value_domain, items]
          properties:
            value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
            items: { type: array, items: { $ref: "#/components/schemas/TreasuryPaperFill" } }
    TreasurySyncResult:
      type: object
      required: [value_domain, house_account_id, ingested]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        house_account_id: { $ref: "#/components/schemas/UUID" }
        ingested: { type: integer, minimum: 0 }
    TreasuryAssetPnL:
      type: object
      required: [asset, quantity, cost, realized_total, realized_today]
      properties:
        asset: { $ref: "#/components/schemas/TreasuryAssetRef" }
        quantity: { $ref: "#/components/schemas/Quantity", description: "base units of the asset" }
        cost: { $ref: "#/components/schemas/Quantity", description: "remaining cost, valuation-asset base units" }
        mark: { $ref: "#/components/schemas/TreasuryPrice", description: "absent when no fresh mark exists" }
        market_value: { $ref: "#/components/schemas/Quantity" }
        unrealized: { $ref: "#/components/schemas/Quantity" }
        realized_total: { $ref: "#/components/schemas/Quantity" }
        realized_today: { $ref: "#/components/schemas/Quantity" }
    TreasuryLimitUse:
      type: object
      required: [kind, codes]
      properties:
        kind: { $ref: "#/components/schemas/TreasuryLimitKind" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        cap: { $ref: "#/components/schemas/Quantity" }
        used: { $ref: "#/components/schemas/Quantity", description: "DAILY_LOSS: the signed loss measure; INVENTORY: held plus working buys; INSTRUMENT_EXPOSURE: absent without a fresh mark" }
        codes: { type: array, items: { type: string }, description: "what new risk would meet now; empty means the limit leaves room" }
    TreasuryReport:
      type: object
      required: [value_domain, house_account_id, valuation_asset, at, trading_day, through_event_seq, assets, realized_total, realized_today,
                 unrealized_total, open_losses, loss_measure, missing_marks, rounding]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        house_account_id: { $ref: "#/components/schemas/UUID" }
        valuation_asset: { $ref: "#/components/schemas/TreasuryAssetRef" }
        at: { $ref: "#/components/schemas/Timestamp" }
        trading_day: { type: string }
        through_event_seq: { type: integer, format: int64 }
        assets: { type: array, items: { $ref: "#/components/schemas/TreasuryAssetPnL" } }
        realized_total: { $ref: "#/components/schemas/Quantity" }
        realized_today: { $ref: "#/components/schemas/Quantity" }
        unrealized_total: { $ref: "#/components/schemas/Quantity" }
        open_losses: { $ref: "#/components/schemas/Quantity" }
        loss_measure: { $ref: "#/components/schemas/Quantity" }
        missing_marks: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        rounding:
          type: object
          additionalProperties: { type: string }
        risk_policy_version: { type: integer, description: "absent when the book has no risk policy (then limits is empty)" }
        limits: { type: array, items: { $ref: "#/components/schemas/TreasuryLimitUse" } }
    TreasurySnapshot:
      type: object
      required: [value_domain, id, document_hash, report, action]
      properties:
        value_domain: { $ref: "#/components/schemas/ValueDomainSimulated" }
        id: { $ref: "#/components/schemas/UUID" }
        document_hash: { type: string }
        report: { $ref: "#/components/schemas/TreasuryReport" }
        action: { $ref: "#/components/schemas/TreasuryAction" }
    TreasuryVenueFlow:
      type: object
      required: [bought, sold]
      properties:
        bought: { $ref: "#/components/schemas/Quantity" }
        sold: { $ref: "#/components/schemas/Quantity" }
    TreasuryBalance:
      type: object
      required: [asset, inventory, reserved, available, funded, internal_book, paper_venue, working_buys, working_sells]
      properties:
        asset: { $ref: "#/components/schemas/TreasuryAssetRef" }
        inventory: { $ref: "#/components/schemas/Quantity" }
        reserved: { $ref: "#/components/schemas/Quantity" }
        available: { $ref: "#/components/schemas/Quantity" }
        funded: { $ref: "#/components/schemas/Quantity" }
        internal_book: { $ref: "#/components/schemas/TreasuryVenueFlow" }
