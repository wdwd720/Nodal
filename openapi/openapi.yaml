openapi: 3.1.0
info:
  title: Financial Control Plane API
  version: 1.0.0-alpha
  description: |
    Versioned REST API (PART 108). Commands are POST with an `Idempotency-Key` header (PART 36);
    queries are GET with cursor pagination. Errors are `application/problem+json` with a stable
    machine-readable `code` (PART 37). Every money field is a decimal string in USD (`"1234.56"`) or an
    exact base-unit integer string for asset quantities; no JSON numbers carry financial values.
    Timestamps are RFC 3339 UTC. Realtime updates are delivered over SSE and are never authoritative
    (PART 109): clients refetch canonical REST state after a stream gap.
servers:
  - url: /v1
tags:
  - name: auth
  - name: accounts
  - name: markets
  - name: trading
  - name: funding
  - name: withdrawals
  - name: activity
  - name: admin
  - name: system

security:
  - sessionCookie: []

paths:
  /auth/login:
    get:
      tags: [auth]
      security: []
      summary: Begin OIDC login (authorization-code + PKCE); redirects to the identity provider
      parameters:
        - in: query
          name: step_up
          schema: { type: boolean }
          description: Request strong authentication (MFA/passkey) for a sensitive action
      responses:
        "302": { description: Redirect to the identity provider }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/callback:
    get:
      tags: [auth]
      security: []
      summary: OIDC callback; establishes a server-side session cookie
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirect to the application }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204": { description: Session revoked }
  /me:
    get:
      tags: [auth]
      summary: Current principal and the accounts it may act on
      responses:
        "200":
          description: Principal
          content: { application/json: { schema: { $ref: "#/components/schemas/Principal" } } }
        "401": { $ref: "#/components/responses/Problem" }
  /sessions:
    get:
      tags: [auth]
      summary: List the caller's sessions (device listing)
      responses:
        "200":
          description: Sessions
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SessionSummary" } } } }
  /sessions/{sessionId}:
    delete:
      tags: [auth]
      summary: Revoke one of the caller's sessions
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Problem" }

  /accounts:
    get:
      tags: [accounts]
      summary: Accounts owned by the caller
      responses:
        "200":
          description: Accounts
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Account" } } } }
  /accounts/{accountId}:
    get:
      tags: [accounts]
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200":
          description: Account
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}/buying-power:
    get:
      tags: [accounts]
      summary: Buying power computed now by the backend (PART 25); never cached as truth
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - in: query
          name: purpose
          schema: { type: string, enum: [DISPLAY, TRADE, WITHDRAWAL] }
          description: Which restrictions are blocking; figures are identical for every purpose
      responses:
        "200":
          description: Buying power
          content: { application/json: { schema: { $ref: "#/components/schemas/BuyingPower" } } }
        "403": { $ref: "#/components/responses/Problem" }
  /accounts/{accountId}/holdings:
    get:
      tags: [accounts]
      summary: Holdings with units, USD mark, basis and unrealized P&L
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200":
          description: Holdings
          content: { application/json: { schema: { $ref: "#/components/schemas/HoldingsResponse" } } }
  /accounts/{accountId}/ledger/transactions:
    get:
      tags: [accounts]
      summary: Journal transactions for the account (append-only history), newest first
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of journal transactions
          content: { application/json: { schema: { $ref: "#/components/schemas/JournalTransactionPage" } } }
  /accounts/{accountId}/activity:
    get:
      tags: [activity]
      summary: Activity timeline (event → prediction → intent → eligibility → risk → execution → fill → reconciliation)
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of activity items
          content: { application/json: { schema: { $ref: "#/components/schemas/ActivityPage" } } }
  /accounts/{accountId}/export:
    get:
      tags: [activity]
      summary: Export journal transactions and fills as CSV or JSON (PART 202)
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { in: query, name: format, schema: { type: string, enum: [csv, json], default: json } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Export document
          content:
            application/json: { schema: { type: object } }
            text/csv: { schema: { type: string } }

  /assets:
    get:
      tags: [markets]
      summary: Registered assets with chain, mint, decimals and safety status
      responses:
        "200":
          description: Assets
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Asset" } } } }
  /instruments:
    get:
      tags: [markets]
      summary: Tradable instruments (V1 spot pairs) with status
      responses:
        "200":
          description: Instruments
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Instrument" } } } }
  /instruments/{instrumentId}:
    get:
      tags: [markets]
      parameters: [{ $ref: "#/components/parameters/InstrumentId" }]
      responses:
        "200":
          description: Instrument with venue listings
          content: { application/json: { schema: { $ref: "#/components/schemas/InstrumentDetail" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /quotes/preview:
    post:
      tags: [trading]
      summary: Non-binding quote preview with full fee disclosure (no money moves, no reservation)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/QuotePreviewRequest" } } }
      responses:
        "200":
          description: Quote disclosure
          content: { application/json: { schema: { $ref: "#/components/schemas/QuoteDisclosure" } } }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /intents:
    post:
      tags: [trading]
      summary: Submit a typed trade intent (manual trading entry point; PART 35)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SubmitIntentRequest" } } }
      responses:
        "202":
          description: Intent accepted and processing
          content: { application/json: { schema: { $ref: "#/components/schemas/TradeIntent" } } }
        "200":
          description: Idempotent replay of a previously accepted intent
          content: { application/json: { schema: { $ref: "#/components/schemas/TradeIntent" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      tags: [trading]
      summary: Intents for an account, newest first
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of intents
          content: { application/json: { schema: { $ref: "#/components/schemas/TradeIntentPage" } } }
  /intents/{intentId}:
    get:
      tags: [trading]
      parameters: [{ $ref: "#/components/parameters/IntentId" }]
      responses:
        "200":
          description: Intent with its decisions, plan, order and fills
          content: { application/json: { schema: { $ref: "#/components/schemas/TradeIntentDetail" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /intents/{intentId}/cancel:
    post:
      tags: [trading]
      summary: Request cancellation (CANCEL_REQUESTED; only external confirmation yields CANCELLED — PART 227)
      parameters:
        - { $ref: "#/components/parameters/IntentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: Cancellation requested
          content: { application/json: { schema: { $ref: "#/components/schemas/TradeIntent" } } }
        "409": { $ref: "#/components/responses/Problem" }
  /orders:
    get:
      tags: [trading]
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of orders
          content: { application/json: { schema: { $ref: "#/components/schemas/OrderPage" } } }
  /orders/{orderId}:
    get:
      tags: [trading]
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses:
        "200":
          description: Order with attempts and fills
          content: { application/json: { schema: { $ref: "#/components/schemas/OrderDetail" } } }
        "404": { $ref: "#/components/responses/Problem" }

  /funding/deposits:
    post:
      tags: [funding]
      summary: Start a fiat-to-USDC funding session (redirect success never credits money — PART 162)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartDepositRequest" } } }
      responses:
        "202":
          description: Deposit created with provider session
          content: { application/json: { schema: { $ref: "#/components/schemas/Deposit" } } }
        "200":
          description: Idempotent replay
          content: { application/json: { schema: { $ref: "#/components/schemas/Deposit" } } }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      tags: [funding]
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of deposits
          content: { application/json: { schema: { $ref: "#/components/schemas/DepositPage" } } }
  /funding/deposits/{depositId}:
    get:
      tags: [funding]
      parameters: [{ $ref: "#/components/parameters/DepositId" }]
      responses:
        "200":
          description: Deposit with transition history
          content: { application/json: { schema: { $ref: "#/components/schemas/DepositDetail" } } }
        "404": { $ref: "#/components/responses/Problem" }

  /withdrawals:
    post:
      tags: [withdrawals]
      summary: Request a withdrawal (requires step-up; the WITHDRAWALS capability is DISABLED in V1 — PART 94)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WithdrawalRequest" } } }
      responses:
        "202":
          description: Withdrawal requested
          content: { application/json: { schema: { $ref: "#/components/schemas/Withdrawal" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422":
          description: CAPABILITY_NOT_APPROVED while the gate is disabled
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /events/stream:
    get:
      tags: [activity]
      summary: Server-sent events for balances, orders, deposits and agent state (not authoritative)
      parameters:
        - in: header
          name: Last-Event-ID
          schema: { type: string }
          description: Resume cursor; on a gap the server sends a `resync` event and the client must refetch REST state
      responses:
        "200":
          description: text/event-stream of `Event` objects (`id`, `event`, `data` = JSON `StreamEvent`)
          content: { text/event-stream: { schema: { type: string } } }

  /webhooks/{provider}:
    post:
      tags: [system]
      security: []
      summary: Provider webhook ingestion (signature-verified, persisted before processing, idempotent — PART 30)
      parameters:
        # The value cmd/api registers the port under, which is
        # stripecredit.ProviderName. This said `stripe`, and nothing enforced
        # the enum at runtime -- no OpenAPI request validator is wired -- so a
        # delivery to the DOCUMENTED path reached the handler, found no
        # provider in the map and answered 404, indistinguishable from an
        # invented provider. Confirmed against the deployment. Stripe retries a
        # 404 for a few days and then gives up, which is the failure
        # cmd/api/wire.go says it exists to avoid (F-124).
        - { in: path, name: provider, required: true, schema: { type: string, enum: [stripe_credit] } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Acknowledged (including duplicates) }
        "400": { description: Signature or replay validation failed }

  /admin/accounts:
    get:
      tags: [admin]
      summary: Search accounts (operator roles)
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Accounts
          content: { application/json: { schema: { $ref: "#/components/schemas/AccountPage" } } }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/accounts/{accountId}/status:
    post:
      tags: [admin]
      summary: Freeze / restrict / reactivate an account (reason required; audited; no balance editing exists)
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountStatusChange" } } }
      responses:
        "200":
          description: Updated account
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/gates:
    get:
      tags: [admin]
      summary: Production capability gates for this environment
      responses:
        "200":
          description: Gates
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CapabilityGate" } } } }
  /admin/gates/{capability}/{action}:
    post:
      tags: [admin]
      summary: Propose / approve / activate / suspend / resume / revoke a gate (dual control; step-up), or sandbox / unsandbox it on a sandbox tier
      description: >-
        sandbox and unsandbox exist only on a sandbox tier (CP_API_LEGAL_POLICY=SANDBOX,
        never PROD). A SANDBOX gate carries no approval chain, cannot exist in PROD, and
        is read as active only by a sandbox tier. Everywhere else the action is refused.
      parameters:
        - { in: path, name: capability, required: true, schema: { $ref: "#/components/schemas/Capability" } }
        - { in: path, name: action, required: true, schema: { type: string, enum: [propose, approve, activate, suspend, resume, revoke, sandbox, unsandbox] } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/GateActionRequest" } } }
      responses:
        "200":
          description: Gate after the transition
          content: { application/json: { schema: { $ref: "#/components/schemas/CapabilityGate" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/kill-switches:
    get:
      tags: [admin]
      responses:
        "200":
          description: Active and inactive switches
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KillSwitch" } } } }
    post:
      tags: [admin]
      summary: Activate (fast, single operator) or release (step-up; SEVERE needs an approved admin action) a kill switch
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KillSwitchRequest" } } }
      responses:
        "200":
          description: Switch state
          content: { application/json: { schema: { $ref: "#/components/schemas/KillSwitch" } } }
        "403": { $ref: "#/components/responses/Problem" }
  /admin/actions:
    get:
      tags: [admin]
      summary: Pending and recent controlled administrative actions
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Actions
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminActionPage" } } }
    post:
      tags: [admin]
      summary: Propose a controlled action (reason required; step-up)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminActionProposal" } } }
      responses:
        "201":
          description: Proposed
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminAction" } } }
  /admin/actions/{actionId}/{decision}:
    post:
      tags: [admin]
      summary: Approve or reject a proposed action (approver ≠ proposer; step-up)
      parameters:
        - { in: path, name: actionId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { in: path, name: decision, required: true, schema: { type: string, enum: [approve, reject, execute] } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        "200":
          description: Action after the decision
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminAction" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/reconciliation/records:
    get:
      tags: [admin]
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: account_id, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Reconciliation records
          content: { application/json: { schema: { $ref: "#/components/schemas/ReconciliationRecordPage" } } }
  /admin/reconciliation/records/{recordId}/resolve:
    post:
      tags: [admin]
      summary: Resolve a mismatch (reason + evidence; material resolutions require an approved admin action; corrections post a compensating journal transaction)
      parameters:
        - { in: path, name: recordId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReconciliationResolution" } } }
      responses:
        "200":
          description: Record after resolution
          content: { application/json: { schema: { $ref: "#/components/schemas/ReconciliationRecord" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/instruments/{instrumentId}/status:
    post:
      tags: [admin]
      summary: Change instrument status (ACTIVE / CLOSE_ONLY / RESTRICTED / HALTED / DELISTING / DELISTED)
      parameters:
        - { $ref: "#/components/parameters/InstrumentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StatusChange" } } }
      responses:
        "200":
          description: Instrument
          content: { application/json: { schema: { $ref: "#/components/schemas/Instrument" } } }
  /admin/providers:
    get:
      tags: [admin]
      summary: Provider health and verification labels
      responses:
        "200":
          description: Providers
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProviderStatus" } } } }

  # ---------------------------------------------------------------------
  # Nodal-native economy (gola.md PARTS XII-XXI). Every command here is
  # idempotent and every one is separately capability-gated: an endpoint
  # existing says only that the system knows how to answer, never that this
  # deployment permits it. A capability that is not ACTIVE produces 422
  # CAPABILITY_NOT_APPROVED with the capability named.
  # ---------------------------------------------------------------------
  /credits/balance:
    get:
      tags: [credits]
      summary: Credit balance broken down by what may and may not be withdrawn (PART XX)
      description: >-
        Never returns a single number. A balance is gross, spendable, frozen and
        payout-eligible, with the reasons the remainder is not, because
        "18,450 Credits" does not answer "how much may I withdraw".
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
      responses:
        "200":
          description: Credit balance breakdown
          content: { application/json: { schema: { $ref: "#/components/schemas/CreditBalance" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /credits/pricing:
    get:
      tags: [credits]
      summary: The rate at which money buys Credits, and the bounds on one purchase
      description: >-
        Exists so a funding page can show the rate without deriving it. A second
        implementation of this arithmetic in the browser would eventually
        disagree with the server, and the server is the one that issues.
      responses:
        "200":
          description: The pricing policy in force
          content: { application/json: { schema: { $ref: "#/components/schemas/CreditPricing" } } }

  /payments:
    post:
      tags: [credits]
      summary: Start a payment that buys Credits (PART XI, pgf Sections 5-7)
      description: >-
        The request says how much MONEY the customer will pay. It cannot say how
        many Credits to issue, because there is no such field: the quantity is
        derived server-side from the named pricing policy version. The response
        carries a provider client secret exactly once, on creation, and never on
        an idempotent replay -- a second browser must not be able to resume
        somebody else's payment form.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateCreditPurchaseRequest" } } }
      responses:
        "201":
          description: Purchase started; complete the payment with the provider using client_secret
          content: { application/json: { schema: { $ref: "#/components/schemas/CreditPurchase" } } }
        "200":
          description: Idempotent replay. No client_secret is returned
          content: { application/json: { schema: { $ref: "#/components/schemas/CreditPurchase" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /payments/{paymentId}:
    get:
      tags: [credits]
      summary: The state of one Credit purchase
      description: >-
        A funding page polls this rather than trusting a redirect. A provider
        redirect says the customer came back, not that the money arrived.
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
      responses:
        "200":
          description: Purchase state
          content: { application/json: { schema: { $ref: "#/components/schemas/CreditPurchase" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /native-assets:
    post:
      tags: [native-economy]
      summary: Create a Nodal-native asset in DRAFT, after content screening (PART XIII)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateNativeAssetRequest" } } }
      responses:
        "201":
          description: Asset created in DRAFT
          content: { application/json: { schema: { $ref: "#/components/schemas/NativeAsset" } } }
        "200":
          description: Idempotent replay
          content: { application/json: { schema: { $ref: "#/components/schemas/NativeAsset" } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422":
          description: Refused by content screening, with every finding named
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    get:
      tags: [native-economy]
      summary: Native assets that currently accept at least sells
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Page of native assets
          content: { application/json: { schema: { $ref: "#/components/schemas/NativeAssetPage" } } }

  /native-assets/{assetId}:
    get:
      tags: [native-economy]
      parameters: [{ $ref: "#/components/parameters/AssetId" }]
      responses:
        "200":
          description: Asset with its supply, policy profile and moderation state
          content: { application/json: { schema: { $ref: "#/components/schemas/NativeAsset" } } }
        "404": { $ref: "#/components/responses/Problem" }

  /native-assets/{assetId}/submit:
    post:
      tags: [native-economy]
      summary: Submit your own DRAFT asset for moderation review (PART XIII)
      description: >-
        Only the creator may submit, and only their own DRAFT. Submitting is
        what freezes the asset's economics for review: an operator must not be
        able to launch a draft its creator is still editing, so the creator's
        act and the operator's are kept apart.
      parameters:
        - { $ref: "#/components/parameters/AssetId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id]
              properties:
                account_id: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Asset is PENDING_REVIEW
          content: { application/json: { schema: { $ref: "#/components/schemas/NativeAsset" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /native-markets/{marketId}:
    get:
      tags: [native-economy]
      summary: Market state, curve, fees and holder concentration (PART LIV)
      parameters: [{ $ref: "#/components/parameters/MarketId" }]
      responses:
        "200":
          description: Market
          content: { application/json: { schema: { $ref: "#/components/schemas/NativeMarket" } } }
        "404": { $ref: "#/components/responses/Problem" }

  /native-markets/{marketId}/quotes:
    post:
      tags: [native-economy]
      summary: Price a hypothetical trade against current state (PART XIV)
      description: >-
        A quote is a record of what the market said at a version. It is not a
        promise: execution re-prices against current state, and the caller's
        protection is min_output on the order.
      parameters:
        - { $ref: "#/components/parameters/MarketId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NativeQuoteRequest" } } }
      responses:
        "200":
          description: Quote with full fee and slippage disclosure
          content: { application/json: { schema: { $ref: "#/components/schemas/NativeQuote" } } }
        "422": { $ref: "#/components/responses/Problem" }

  /native-markets/{marketId}/orders:
    post:
      tags: [native-economy]
      summary: Execute a trade against the internal market
      parameters:
        - { $ref: "#/components/parameters/MarketId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NativeOrderRequest" } } }
      responses:
        "201":
          description: Filled
          content: { application/json: { schema: { $ref: "#/components/schemas/NativeFill" } } }
        "200":
          description: Idempotent replay of a fill already executed
          content: { application/json: { schema: { $ref: "#/components/schemas/NativeFill" } } }
        "409":
          description: The market moved past the caller's minimum output
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "422": { $ref: "#/components/responses/Problem" }

  /payouts:
    post:
      tags: [payouts]
      summary: Request a payout of eligible value (PARTS XVIII-XXI)
      description: >-
        Eligibility is decided per unit of provenance, not per balance. The
        response states what was decided, under which policy version, and — when
        the only obstacle is identity — that verification would suffice.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreatePayoutRequest" } } }
      responses:
        "201":
          description: Payout request created; see state and decision for what happens next
          content: { application/json: { schema: { $ref: "#/components/schemas/PayoutRequest" } } }
        "200":
          description: Idempotent replay
          content: { application/json: { schema: { $ref: "#/components/schemas/PayoutRequest" } } }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      tags: [payouts]
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of payout requests
          content: { application/json: { schema: { $ref: "#/components/schemas/PayoutRequestPage" } } }

  /payouts/{payoutId}:
    get:
      tags: [payouts]
      parameters: [{ $ref: "#/components/parameters/PayoutId" }]
      responses:
        "200":
          description: Payout request
          content: { application/json: { schema: { $ref: "#/components/schemas/PayoutRequest" } } }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------------
  # Internal commerce: the creator economy (PART XVII).
  #
  # The product KIND decides the provenance of the seller's earning, so it is
  # required and closed: DATA sales become DATA_SALE_EARNING, agent services
  # become AGENT_SERVICE_EARNING, everything else becomes CREATOR_EARNING.
  # A client cannot choose the provenance, and no response invites it to.
  # ---------------------------------------------------------------------
  /payouts/{payoutId}/cancel:
    post:
      tags: [payouts]
      summary: Cancel your own payout request before it has been submitted
      description: >-
        Returns the reserved Credits to the exact lots they came from, with
        their provenance intact. A request that has been SUBMITTED cannot be
        cancelled: it may already have been paid, and the only honest way out of
        that is reconciliation.
      parameters:
        - { $ref: "#/components/parameters/PayoutId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, reason]
              properties:
                account_id: { $ref: "#/components/schemas/UUID" }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200":
          description: Request is REJECTED and the reservation is returned
          content: { application/json: { schema: { $ref: "#/components/schemas/PayoutRequest" } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: Already submitted; resolve it by reconciliation instead
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /internal-sellers:
    post:
      tags: [commerce]
      summary: Register the calling account as a seller (PART XVII)
      description: >-
        Selling is a separate act from holding an account because it is how
        earning provenance is minted. Registration is idempotent.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterSellerRequest" } } }
      responses:
        "200":
          description: Seller record
          content: { application/json: { schema: { $ref: "#/components/schemas/InternalSeller" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /internal-products:
    post:
      tags: [commerce]
      summary: Create a product in DRAFT
      description: >-
        A draft is not for sale. Its terms freeze on publication, so this is the
        only point at which price, fee and kind can still be changed.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateInternalProductRequest" } } }
      responses:
        "201":
          description: Product created in DRAFT
          content: { application/json: { schema: { $ref: "#/components/schemas/InternalProduct" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      tags: [commerce]
      summary: Products currently for sale
      parameters:
        - { in: query, name: kind, schema: { $ref: "#/components/schemas/InternalProductKind" } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of active products
          content: { application/json: { schema: { $ref: "#/components/schemas/InternalProductPage" } } }

  /internal-products/{productId}:
    get:
      tags: [commerce]
      parameters: [{ $ref: "#/components/parameters/ProductId" }]
      responses:
        "200":
          description: Product
          content: { application/json: { schema: { $ref: "#/components/schemas/InternalProduct" } } }
        "404": { $ref: "#/components/responses/Problem" }

  /internal-products/{productId}/status:
    post:
      tags: [commerce]
      summary: Publish, pause, resume or withdraw a product
      description: >-
        Publishing freezes price, fee and kind for that version. WITHDRAWN is
        terminal: a product that can come back is PAUSED, and the two mean
        different things to a buyer reading their purchase history.
      parameters:
        - { $ref: "#/components/parameters/ProductId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetInternalProductStatusRequest" } } }
      responses:
        "200":
          description: Product in its new status
          content: { application/json: { schema: { $ref: "#/components/schemas/InternalProduct" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /internal-products/{productId}/orders:
    post:
      tags: [commerce]
      summary: Buy a product with Credits
      description: >-
        The buyer states the price they were shown. A price that no longer
        matches is a 409 refusal rather than a surprise charge. An account can
        never buy from itself, directly or through a seller whose earnings are
        attributed back to it.
      parameters:
        - { $ref: "#/components/parameters/ProductId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseInternalProductRequest" } } }
      responses:
        "201":
          description: Purchased
          content: { application/json: { schema: { $ref: "#/components/schemas/InternalOrder" } } }
        "200":
          description: Idempotent replay of a purchase already made
          content: { application/json: { schema: { $ref: "#/components/schemas/InternalOrder" } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409":
          description: The price changed, or the product is no longer for sale
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "422": { $ref: "#/components/responses/Problem" }

  /internal-orders:
    get:
      tags: [commerce]
      summary: Orders an account bought or sold
      parameters:
        - { in: query, name: account_id, required: true, schema: { $ref: "#/components/schemas/UUID" } }
        - in: query
          name: role
          description: Whose side of the order to list. Defaults to BUYER.
          schema: { type: string, enum: [BUYER, SELLER] }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of orders
          content: { application/json: { schema: { $ref: "#/components/schemas/InternalOrderPage" } } }

  /healthz:
    get:
      tags: [system]
      security: []
      responses:
        "200": { description: Process is alive }
  /readyz:
    get:
      tags: [system]
      security: []
      summary: Ready when the database is reachable and configuration validated; never reports provider liveness as readiness
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /version:
    get:
      tags: [system]
      security: []
      summary: Build version and non-secret configuration hash (PART 222)
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                required: [build_version, config_hash, environment]
                properties:
                  build_version: { type: string }
                  config_hash: { type: string }
                  environment: { type: string }

  # ---- profile, terms and account lifecycle ----
  /me/profile:
    post:
      tags: [auth]
      summary: Update the caller own profile (display name, handle, locale, time zone)
      description: >-
        Every field is optional and only the ones present change; an empty
        handle clears it. There is no id in the path, so this route can reach no
        profile but the caller own.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileUpdate" } } }
      responses:
        "200":
          description: Updated profile
          content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /me/terms-acceptances:
    get:
      tags: [auth]
      summary: Legal documents, which of them the caller has accepted, and which are outstanding
      responses:
        "200":
          description: Acceptance state
          content: { application/json: { schema: { $ref: "#/components/schemas/TermsState" } } }
    post:
      tags: [auth]
      summary: Accept the named documents at the versions currently served
      description: >-
        The record names the document, its version and the sha256 of the exact
        bytes shown. Accepting the same bytes twice is idempotent and produces
        one record, not two.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TermsAcceptanceRequest" } } }
      responses:
        "200":
          description: Acceptance state after accepting
          content: { application/json: { schema: { $ref: "#/components/schemas/TermsState" } } }
        "400": { $ref: "#/components/responses/Problem" }
  /me/account:
    get:
      tags: [auth]
      summary: The standing of the caller own account, with any restrictions and open closure request
      responses:
        "200":
          description: Account standing
          content: { application/json: { schema: { $ref: "#/components/schemas/MyAccount" } } }
  /me/account/close:
    post:
      tags: [auth]
      summary: Ask for the caller own account to be closed (a request with a cooling-off period, never a deletion)
      description: >-
        Requires a recent strong authentication. The request waits out a
        cooling-off period during which the caller can cancel it, and is then
        effected by an operator. Nothing is deleted: financial and audit records
        are retained.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CloseAccountRequest" } } }
      responses:
        "200":
          description: Account standing, including the open request
          content: { application/json: { schema: { $ref: "#/components/schemas/MyAccount" } } }
        "409": { $ref: "#/components/responses/Problem" }
  /me/account/close/cancel:
    post:
      tags: [auth]
      summary: Cancel the caller own open closure request
      description: >-
        Deliberately does NOT require a step-up. Requesting closure is the
        dangerous direction and asks for one; stopping a request must never be
        harder than starting it.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Account standing after cancelling
          content: { application/json: { schema: { $ref: "#/components/schemas/MyAccount" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /me/security:
    get:
      tags: [auth]
      summary: What the system knows about the security of the caller own account
      description: >-
        Derived entirely from the session store and the claims of the current
        session. It holds no secret and creates nothing.
      responses:
        "200":
          description: Security summary
          content: { application/json: { schema: { $ref: "#/components/schemas/SecuritySummary" } } }
  /admin/users/{userId}:
    get:
      tags: [admin]
      summary: Operator support view of one user (read only)
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: Support view
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserView" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/users/{userId}/closure:
    post:
      tags: [admin]
      summary: Decide a user open closure request (cancel, refuse, or effect it after the cooling-off period)
      description: >-
        The only mutation the support surface offers, and it acts on a request
        the user themselves opened. EFFECT is refused before the cooling-off
        period has passed, by the database as well as by the service, and an
        operator may not decide a request of their own.
      parameters:
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClosureDecision" } } }
      responses:
        "200":
          description: Support view after the decision
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserView" } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cp_session
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      description: >-
        Same key + same body replays the original result; same key + different
        body → 409 INVALID_IDEMPOTENCY_REUSE. The key is opaque to the server but
        constrained to an unambiguous charset: it becomes part of a primary key,
        is echoed in responses, and is written to logs and audit records, so
        control characters and quoting metacharacters are refused at the edge
        rather than escaped correctly at every one of those sinks forever. Every
        legitimate key already satisfies this — newIdempotencyKey() returns a
        UUID.
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    AccountId: { in: path, name: accountId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    InstrumentId: { in: path, name: instrumentId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    IntentId: { in: path, name: intentId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    OrderId: { in: path, name: orderId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    DepositId: { in: path, name: depositId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    SessionId: { in: path, name: sessionId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    AssetId: { in: path, name: assetId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    MarketId: { in: path, name: marketId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    PayoutId: { in: path, name: payoutId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    PaymentId: { in: path, name: paymentId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    ProductId: { in: path, name: productId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
    UserId: { in: path, name: userId, required: true, schema: { $ref: "#/components/schemas/UUID" } }
  responses:
    Problem:
      description: Structured error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    UUID:
      type: string
      format: uuid
      description: UUIDv7 in canonical form
    USD:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      description: USD as a decimal string with exactly two fraction digits
      examples: ["1234.56"]
    Quantity:
      type: string
      pattern: '^-?[0-9]+$'
      description: Exact asset base units as an integer string
      examples: ["1500000000"]
    BPS:
      type: integer
      minimum: 0
      maximum: 10000
      description: Basis points; 10000 == 100%
    Timestamp:
      type: string
      format: date-time
    CreditOrigin:
      type: string
      description: >-
        Where a unit of Credits came from. This is the distinction the whole
        payout architecture rests on: earning a dataset sale and profiting from
        an internal market are different activities, and a policy that permits
        one must not thereby permit the other. It is closed, and never inferred
        from anything but the event that produced the units.
      enum: [PURCHASED, PROMOTIONAL, REFUND, CREATOR_EARNING, DATA_SALE_EARNING,
             AGENT_SERVICE_EARNING, MARKET_CREATOR_EARNING, MARKET_TRADING_PROCEEDS,
             COMPETITION_REWARD, ADMIN_ADJUSTMENT, PROVIDER_SETTLEMENT]
    # --- Nodal-native economy --------------------------------------------
    CreditBalance:
      type: object
      required: [account_id, gross, spendable, frozen, payout_eligible, ineligible, policy_version]
      description: >-
        The breakdown PART XX requires. gross is every remaining unit;
        payout_eligible is what the named policy version permits to be withdrawn
        right now. They are different numbers and the product must never show
        one where it means the other.
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        gross: { $ref: "#/components/schemas/Quantity" }
        spendable: { $ref: "#/components/schemas/Quantity" }
        frozen: { $ref: "#/components/schemas/Quantity" }
        reversed: { $ref: "#/components/schemas/Quantity" }
        payout_eligible: { $ref: "#/components/schemas/Quantity" }
        ineligible: { $ref: "#/components/schemas/Quantity" }
        by_origin:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Quantity" }
        by_finality:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Quantity" }
        ineligible_reasons:
          type: array
          items: { type: string }
          description: Why the ineligible remainder cannot be withdrawn
        policy_version: { type: string }
        policy_hash: { type: string }

    NativeSupply:
      type: object
      required: [max_supply, creator_allocation, treasury_allocation, pool_supply]
      properties:
        max_supply: { $ref: "#/components/schemas/Quantity" }
        creator_allocation: { $ref: "#/components/schemas/Quantity" }
        treasury_allocation: { $ref: "#/components/schemas/Quantity" }
        pool_supply: { $ref: "#/components/schemas/Quantity" }

    NativeAssetPolicy:
      type: object
      required: [internal_only, transferable, cashout_eligible, minimum_age]
      description: >-
        The stated position on this asset (PART XXXIV). Every field is a
        decision, never a default: "we never decided" and "we decided no" are
        different facts and the product must not conflate them.
      properties:
        internal_only: { type: boolean }
        transferable: { type: boolean }
        cashout_eligible: { type: boolean }
        creator_earning_eligible: { type: boolean }
        market_proceeds_eligible: { type: boolean }
        minimum_age: { type: integer }
        jurisdiction_policy: { type: string }
        marketing_restrictions: { type: string }

    NativeAsset:
      type: object
      required: [asset_id, creator_account_id, name, symbol, status, supply, policy, moderation_state]
      properties:
        asset_id: { $ref: "#/components/schemas/UUID" }
        creator_account_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        symbol: { type: string }
        description: { type: string }
        image_url: { type: string }
        status:
          type: string
          enum: [DRAFT, PENDING_REVIEW, ACTIVE, CLOSE_ONLY, HALTED, DELISTED, REJECTED]
        supply: { $ref: "#/components/schemas/NativeSupply" }
        policy: { $ref: "#/components/schemas/NativeAssetPolicy" }
        moderation_state:
          type: string
          enum: [PENDING, APPROVED, REJECTED, FLAGGED]
        moderation_notes: { type: string }
        economics_locked_at: { $ref: "#/components/schemas/Timestamp" }
        activated_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    NativeAssetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NativeAsset" }

    CreateNativeAssetRequest:
      type: object
      required: [account_id, name, symbol, max_supply]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string, minLength: 2, maxLength: 64 }
        symbol: { type: string, minLength: 2, maxLength: 10 }
        description: { type: string, maxLength: 2000 }
        image_url: { type: string, maxLength: 512 }
        max_supply: { $ref: "#/components/schemas/Quantity" }
        creator_allocation: { $ref: "#/components/schemas/Quantity" }
        decimals: { type: integer, minimum: 0, maximum: 18 }

    NativeMarket:
      type: object
      required: [market_id, asset_id, status, real_credit_reserve, asset_reserve, state_version, platform_fee_bps, creator_fee_bps]
      properties:
        market_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        status:
          type: string
          enum: [PENDING, ACTIVE, CLOSE_ONLY, HALTED, FROZEN, DELISTED]
        virtual_credit_reserve: { $ref: "#/components/schemas/Quantity" }
        initial_asset_reserve: { $ref: "#/components/schemas/Quantity" }
        real_credit_reserve: { $ref: "#/components/schemas/Quantity" }
        asset_reserve: { $ref: "#/components/schemas/Quantity" }
        circulating_supply: { $ref: "#/components/schemas/Quantity" }
        spot_price: { $ref: "#/components/schemas/Quantity" }
        price_scale:
          type: integer
          description: Scale of spot_price. This is the price scale, not the asset's.
        asset_decimals:
          type: integer
          minimum: 0
          maximum: 18
          description: >-
            Scale of every ASSET quantity here -- asset_reserve, initial_asset_reserve,
            circulating_supply and each top holder's quantity. It is a fact about the
            asset, fixed at creation, and it is NOT the Credit scale: a client that
            assumes one is right only while a creator happens to choose six decimals
            (F-44).
        platform_fee_bps: { $ref: "#/components/schemas/BPS" }
        creator_fee_bps: { $ref: "#/components/schemas/BPS" }
        state_version: { type: integer, format: int64 }
        top_holders:
          type: array
          description: Holder concentration, which is the number a buyer most needs to see
          items:
            type: object
            properties:
              account_id: { $ref: "#/components/schemas/UUID" }
              quantity: { $ref: "#/components/schemas/Quantity" }

    NativeQuoteRequest:
      type: object
      required: [account_id, side, amount]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        side: { type: string, enum: [BUY, SELL] }
        amount:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: Credits for a BUY, asset base units for a SELL

    NativeQuote:
      type: object
      required: [quote_id, market_id, side, input_amount, expected_output, state_version, expires_at]
      properties:
        quote_id: { $ref: "#/components/schemas/UUID" }
        market_id: { $ref: "#/components/schemas/UUID" }
        side: { type: string, enum: [BUY, SELL] }
        input_amount: { $ref: "#/components/schemas/Quantity" }
        expected_output: { $ref: "#/components/schemas/Quantity" }
        platform_fee: { $ref: "#/components/schemas/Quantity" }
        creator_fee: { $ref: "#/components/schemas/Quantity" }
        spot_price_before: { $ref: "#/components/schemas/Quantity" }
        effective_price: { $ref: "#/components/schemas/Quantity" }
        price_scale: { type: integer }
        asset_decimals:
          type: integer
          minimum: 0
          maximum: 18
          description: >-
            Scale of whichever of input_amount and expected_output is in asset units.
            On a BUY the input is Credits and the output is the asset; on a SELL it is
            the other way round. Fees and prices are always Credits, at price_scale.
        slippage_bps: { $ref: "#/components/schemas/BPS" }
        state_version: { type: integer, format: int64 }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    NativeOrderRequest:
      type: object
      required: [account_id, side, amount, min_output]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        side: { type: string, enum: [BUY, SELL] }
        amount: { $ref: "#/components/schemas/Quantity" }
        min_output:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: >-
            The trade is refused if it would return less than this. It is checked
            against a freshly computed fill, not against whatever a quote said,
            because this is the number the caller actually agreed to.
        quote_id: { $ref: "#/components/schemas/UUID" }

    NativeFill:
      type: object
      required: [fill_id, market_id, side, state_version_after]
      properties:
        fill_id: { $ref: "#/components/schemas/UUID" }
        market_id: { $ref: "#/components/schemas/UUID" }
        side: { type: string, enum: [BUY, SELL] }
        credits_in: { $ref: "#/components/schemas/Quantity" }
        credits_out: { $ref: "#/components/schemas/Quantity" }
        assets_in: { $ref: "#/components/schemas/Quantity" }
        assets_out: { $ref: "#/components/schemas/Quantity" }
        platform_fee: { $ref: "#/components/schemas/Quantity" }
        creator_fee: { $ref: "#/components/schemas/Quantity" }
        effective_price: { $ref: "#/components/schemas/Quantity" }
        price_scale: { type: integer }
        asset_decimals:
          type: integer
          minimum: 0
          maximum: 18
          description: >-
            Scale of the asset quantities here -- filled_quantity and
            asset_reserve_after. Credits (fees, reserves, prices) are not on it.
        slippage_bps: { $ref: "#/components/schemas/BPS" }
        real_credit_reserve_after: { $ref: "#/components/schemas/Quantity" }
        asset_reserve_after: { $ref: "#/components/schemas/Quantity" }
        state_version_after: { type: integer, format: int64 }
        alerts:
          type: array
          description: Surveillance findings this trade raised. They never block it.
          items:
            type: object
            properties:
              kind: { type: string }
              severity: { type: string, enum: [INFO, WARN, CRITICAL] }
              reason: { type: string }

    CreditPricing:
      type: object
      required: [version, currency, credits_per_major_unit, min_amount_minor, max_amount_minor]
      description: >-
        The versioned policy that converts money into Credits. version is
        recorded on every purchase, so a purchase made under one rate is still
        explicable after two more have replaced it.
      properties:
        version: { type: string, example: credit-pricing-v1 }
        currency: { type: string, minLength: 3, maxLength: 3, example: USD }
        credits_per_major_unit: { type: integer, format: int64, example: 100 }
        min_amount_minor: { type: integer, format: int64, example: 100 }
        max_amount_minor: { type: integer, format: int64, example: 1000000 }

    CreateCreditPurchaseRequest:
      type: object
      required: [account_id, amount_minor]
      description: >-
        Note the absence of a Credit quantity. A client that could state one
        could state nine million, and the only thing between that request and a
        ledger issuance would be a validation somebody remembered to write.
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        amount_minor:
          type: integer
          format: int64
          description: What the customer will pay, in minor units of the pricing currency.
          example: 10000
        currency: { type: string, minLength: 3, maxLength: 3, example: USD }

    CreditPurchase:
      type: object
      required: [purchase_id, account_id, state, credit_quantity, amount_minor, currency, pricing_version, provider]
      properties:
        purchase_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        state:
          type: string
          description: >-
            The funding lifecycle state. CAPTURED is not SETTLED and REVERSIBLE
            is not payout-eligible; the difference is a card dispute window that
            can run for months.
          enum: [CREATED, AUTHORIZATION_PENDING, AUTHORIZED, CAPTURE_PENDING, CAPTURED,
                 REVERSIBLE, SETTLED, REVERSED, REFUNDED, DISPUTED, FAILED, CANCELED, MANUAL_REVIEW]
        credit_quantity: { $ref: "#/components/schemas/Quantity" }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        pricing_version: { type: string }
        provider: { type: string }
        client_secret:
          type: string
          description: >-
            The provider secret that drives the payment UI. Returned exactly
            once, on creation. It is never persisted, never logged, and never
            returned on a replay or a read.
        reversible_at:
          type: string
          format: date-time
          description: When the reversibility window opened. The settlement window is measured from here.
        settled_at: { type: string, format: date-time }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }

    CreatePayoutRequest:
      type: object
      required: [account_id, amount]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        amount: { $ref: "#/components/schemas/Quantity" }
        destination_id: { $ref: "#/components/schemas/UUID" }

    PayoutRequest:
      type: object
      required: [payout_id, account_id, state, requested_quantity, reserved_quantity, policy_version]
      properties:
        payout_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        destination_id: { $ref: "#/components/schemas/UUID" }
        state:
          type: string
          enum: [DRAFT, ELIGIBILITY_CHECK, VERIFICATION_REQUIRED, VERIFICATION_PENDING, VERIFIED,
                 SUBMITTED, PROVIDER_PENDING, PAYOUT_STATUS_UNKNOWN, SETTLED, FAILED, REJECTED,
                 REVERSED, MANUAL_REVIEW]
        requested_quantity: { $ref: "#/components/schemas/Quantity" }
        reserved_quantity: { $ref: "#/components/schemas/Quantity" }
        settled_quantity: { $ref: "#/components/schemas/Quantity" }
        eligible_quantity:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: How much of the request the policy permitted, present on creation
        eligibility_reasons:
          type: array
          items: { type: string }
        verification_would_suffice:
          type: boolean
          description: >-
            True when the only obstacle is identity verification. It is a
            different answer from "no" and the product must present it as one.
        required_verification: { type: string }
        policy_version: { type: string }
        policy_hash: { type: string }
        failure_reason: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    PayoutRequestPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PayoutRequest" }

    InternalProductKind:
      type: string
      description: >-
        What is being sold. This is the ONLY input to the provenance decision,
        so it is closed rather than free text: a kind nobody has decided the
        payout treatment of must not be sellable.
      enum: [DATA, AGENT_SERVICE, COMPUTE, STRATEGY_TEMPLATE, RESEARCH, API_ACCESS,
             COMPETITION_ENTRY, CREATOR_PRODUCT]

    InternalProductStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, WITHDRAWN]

    RegisterSellerRequest:
      type: object
      required: [account_id, display_name]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        payout_account_id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: >-
            Where earnings are attributed. Omit for the selling account itself,
            which is the ordinary case.

    InternalSeller:
      type: object
      required: [account_id, display_name, status]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        display_name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        payout_account_id: { $ref: "#/components/schemas/UUID" }
        suspended_reason: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    CreateInternalProductRequest:
      type: object
      required: [account_id, kind, title, price]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/InternalProductKind" }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        price:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: In Credit base units. Fixed for this version once published.

    SetInternalProductStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/InternalProductStatus" }

    InternalProduct:
      type: object
      required: [product_id, seller_account_id, kind, title, price, version, status, earning_origin]
      properties:
        product_id: { $ref: "#/components/schemas/UUID" }
        seller_account_id: { $ref: "#/components/schemas/UUID" }
        kind: { $ref: "#/components/schemas/InternalProductKind" }
        title: { type: string }
        description: { type: string }
        price: { $ref: "#/components/schemas/Quantity" }
        platform_fee: { $ref: "#/components/schemas/Quantity" }
        seller_proceeds: { $ref: "#/components/schemas/Quantity" }
        platform_fee_bps: { $ref: "#/components/schemas/BPS" }
        version: { type: integer }
        status: { $ref: "#/components/schemas/InternalProductStatus" }
        earning_origin:
          allOf: [{ $ref: "#/components/schemas/CreditOrigin" }]
          description: >-
            The provenance a sale of this product produces. Shown because a
            seller is entitled to know which category their revenue lands in
            before they list, and it is decided by the kind alone.
        terms_frozen:
          type: boolean
          description: True once published; price, fee and kind can no longer change.
        published_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    InternalProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InternalProduct" }

    PurchaseInternalProductRequest:
      type: object
      required: [account_id, expected_price]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        expected_price:
          allOf: [{ $ref: "#/components/schemas/Quantity" }]
          description: >-
            What the buyer was shown. The purchase is refused if it no longer
            matches, so a stale listing is a refusal, never a surprise charge.

    InternalOrder:
      type: object
      required: [order_id, product_id, product_version, buyer_account_id, seller_account_id,
                 price, platform_fee, seller_proceeds, earning_origin]
      properties:
        order_id: { $ref: "#/components/schemas/UUID" }
        product_id: { $ref: "#/components/schemas/UUID" }
        product_version: { type: integer }
        buyer_account_id: { $ref: "#/components/schemas/UUID" }
        seller_account_id: { $ref: "#/components/schemas/UUID" }
        earning_account_id: { $ref: "#/components/schemas/UUID" }
        price: { $ref: "#/components/schemas/Quantity" }
        platform_fee: { $ref: "#/components/schemas/Quantity" }
        seller_proceeds: { $ref: "#/components/schemas/Quantity" }
        earning_origin: { $ref: "#/components/schemas/CreditOrigin" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    InternalOrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InternalOrder" }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable code (INSUFFICIENT_BUYING_POWER, ACCOUNT_FROZEN, ASSET_RESTRICTED, VENUE_UNAVAILABLE, QUOTE_EXPIRED, RISK_MAX_POSITION, RISK_DAILY_LOSS, ELIGIBILITY_JURISDICTION, CAPABILITY_NOT_APPROVED, SUBMISSION_STATE_UNKNOWN, RECONCILIATION_REQUIRED, PROVIDER_UNAVAILABLE, STALE_MARKET_DATA, INVALID_IDEMPOTENCY_REUSE, KILL_SWITCH_ACTIVE, NO_VALID_PLAN, …)
        fields: { type: object, additionalProperties: true }
        request_id: { type: string }
    Page:
      type: object
      required: [next_cursor]
      properties:
        next_cursor: { type: [string, "null"] }
    Principal:
      type: object
      required: [subject_id, actor_type, roles, account_ids, auth_time, amr]
      properties:
        subject_id: { $ref: "#/components/schemas/UUID" }
        actor_type: { type: string, enum: [USER, OPERATOR] }
        roles: { type: array, items: { type: string } }
        account_ids: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        auth_time: { $ref: "#/components/schemas/Timestamp" }
        amr: { type: array, items: { type: string } }
        step_up_valid_until: { $ref: "#/components/schemas/Timestamp" }
        # When a break-glass elevation is live, the instant it expires. The
        # session already carries it and the roles array already shows
        # BREAK_GLASS; omitting the expiry left an operator console unable to
        # say how long an elevation had left. Absent means no elevation.
        break_glass_until: { $ref: "#/components/schemas/Timestamp" }
        # Added by the product surfaces, additively: every field above is
        # unchanged and still required. Both are absent for a principal with
        # no profile row, so a client must treat them as optional.
        profile: { $ref: "#/components/schemas/UserProfile" }
        onboarding: { $ref: "#/components/schemas/Onboarding" }
    SessionSummary:
      type: object
      required: [id, created_at, last_seen_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        ip: { type: string }
        user_agent: { type: string }
        device_label: { type: string }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
        current: { type: boolean }
    Account:
      type: object
      required: [id, kind, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        # Read-only, and additive: the account already referenced a user in the
        # schema, and an operator surface that could list accounts but not reach
        # the person who owns one had to guess. It is the caller's own user id
        # on the customer routes, which they already have from /v1/me.
        owner_user_id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string, enum: [CUSTOMER, CANARY, PLATFORM] }
        status: { type: string, enum: [ACTIVE, RESTRICTED, FROZEN, CLOSED] }
        status_reason: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    AccountPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Account" } }
    AccountStatusChange:
      type: object
      required: [to, reason]
      properties:
        to: { type: string, enum: [ACTIVE, RESTRICTED, FROZEN, CLOSED] }
        reason: { type: string, minLength: 8 }
    BuyingPower:
      type: object
      required: [portfolio_value, buying_power, available_now, reserved, pending, withdrawable, underlying_balances, haircuts, restrictions, policy_version, as_of, purpose]
      properties:
        portfolio_value: { $ref: "#/components/schemas/USD" }
        buying_power: { $ref: "#/components/schemas/USD" }
        available_now: { $ref: "#/components/schemas/USD" }
        reserved: { $ref: "#/components/schemas/USD" }
        pending: { $ref: "#/components/schemas/USD" }
        withdrawable: { $ref: "#/components/schemas/USD" }
        underlying_balances:
          type: array
          items:
            type: object
            required: [asset, symbol, decimals, quantity, usd_value, price_ref, status]
            properties:
              asset: { $ref: "#/components/schemas/UUID" }
              symbol: { type: string }
              decimals: { type: integer }
              quantity: { $ref: "#/components/schemas/Quantity" }
              usd_value: { $ref: "#/components/schemas/USD" }
              price_ref: { type: string }
              status: { type: string }
        haircuts:
          type: array
          items:
            type: object
            required: [asset, factor_bps, reason]
            properties:
              asset: { $ref: "#/components/schemas/UUID" }
              factor_bps: { $ref: "#/components/schemas/BPS" }
              reason: { type: string }
        restrictions:
          type: array
          items:
            type: object
            required: [code, detail, scope, blocking]
            properties:
              code: { type: string }
              detail: { type: string }
              asset: { $ref: "#/components/schemas/UUID" }
              scope: { type: string, enum: [ACCOUNT, WITHDRAWAL, ASSET] }
              blocking: { type: boolean }
        policy_version: { type: string }
        as_of: { $ref: "#/components/schemas/Timestamp" }
        purpose: { type: string, enum: [DISPLAY, TRADE, WITHDRAWAL, AGENT_DEPLOY] }
    HoldingsResponse:
      type: object
      required: [holdings, as_of]
      properties:
        as_of: { $ref: "#/components/schemas/Timestamp" }
        holdings:
          type: array
          items:
            type: object
            required: [asset, symbol, decimals, quantity, usd_mark, cost_basis_usd, unrealized_pnl_usd, location]
            properties:
              asset: { $ref: "#/components/schemas/UUID" }
              symbol: { type: string }
              chain: { type: string }
              mint_address: { type: string }
              decimals: { type: integer }
              quantity: { $ref: "#/components/schemas/Quantity" }
              usd_mark: { $ref: "#/components/schemas/USD" }
              price_ref: { type: string }
              cost_basis_usd: { $ref: "#/components/schemas/USD" }
              unrealized_pnl_usd: { $ref: "#/components/schemas/USD" }
              realized_pnl_usd: { $ref: "#/components/schemas/USD" }
              location: { type: string, description: "custody location, e.g. embedded wallet address" }
    JournalTransaction:
      type: object
      required: [id, kind, reference, effective_at, posted_at, entries, content_hash]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string }
        reference: { type: object, required: [type, id], properties: { type: { type: string }, id: { type: string } } }
        reversal_of: { $ref: "#/components/schemas/UUID" }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
        posted_at: { $ref: "#/components/schemas/Timestamp" }
        description: { type: string }
        reason_code: { type: string }
        content_hash: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [seq, account_code, asset, side, quantity]
            properties:
              seq: { type: integer }
              account_code: { type: string }
              asset: { $ref: "#/components/schemas/UUID" }
              side: { type: string, enum: [DEBIT, CREDIT] }
              quantity: { $ref: "#/components/schemas/Quantity" }
              usd_value: { $ref: "#/components/schemas/USD" }
    JournalTransactionPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/JournalTransaction" } }
    ActivityItem:
      type: object
      required: [id, kind, occurred_at, summary]
      properties:
        id: { type: string }
        kind: { type: string, enum: [DATA_EVENT, PREDICTION, INTENT, ELIGIBILITY, RISK, PLAN, EXECUTION, FILL, RECONCILIATION, LEDGER, FUNDING, SECURITY] }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        summary: { type: string }
        correlation_id: { type: string }
        references: { type: object, additionalProperties: { type: string } }
        detail: { type: object, additionalProperties: true }
    ActivityPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/ActivityItem" } }
    Asset:
      type: object
      required: [id, chain, mint_address, kind, symbol, name, decimals, is_stablecoin, risk_class, status]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        chain: { type: string }
        mint_address: { type: string }
        kind: { type: string, enum: [NATIVE, SPL_TOKEN, SPL_TOKEN_2022, FIAT] }
        symbol: { type: string }
        name: { type: string }
        decimals: { type: integer }
        is_stablecoin: { type: boolean }
        peg_currency: { type: string }
        risk_class: { type: string }
        status: { type: string, enum: [ACTIVE, CLOSE_ONLY, RESTRICTED, HALTED, DELISTING, DELISTED] }
        token_extensions: { type: array, items: { type: string } }
    Instrument:
      type: object
      required: [id, type, canonical_name, settlement_asset, risk_class, status, active_from]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        type: { type: string, enum: [SPOT_PAIR, EVENT_OUTCOME] }
        canonical_name: { type: string }
        base_asset: { $ref: "#/components/schemas/UUID" }
        quote_asset: { $ref: "#/components/schemas/UUID" }
        settlement_asset: { $ref: "#/components/schemas/UUID" }
        risk_class: { type: string }
        status: { type: string, enum: [ACTIVE, CLOSE_ONLY, RESTRICTED, HALTED, DELISTING, DELISTED] }
        active_from: { $ref: "#/components/schemas/Timestamp" }
        active_until: { $ref: "#/components/schemas/Timestamp" }
    VenueListing:
      type: object
      required: [id, venue, venue_status, status, network, base_precision, quote_precision, min_notional_quote]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        venue: { type: string }
        venue_status: { type: string, enum: [ACTIVE, DEGRADED, DISABLED] }
        status: { type: string, enum: [ACTIVE, DEGRADED, DISABLED] }
        network: { type: string }
        base_mint: { type: string }
        quote_mint: { type: string }
        base_precision: { type: integer }
        quote_precision: { type: integer }
        min_notional_quote: { $ref: "#/components/schemas/Quantity" }
        max_notional_quote: { $ref: "#/components/schemas/Quantity" }
    InstrumentDetail:
      allOf:
        - { $ref: "#/components/schemas/Instrument" }
        - type: object
          required: [base, quote, listings]
          properties:
            base: { $ref: "#/components/schemas/Asset" }
            quote: { $ref: "#/components/schemas/Asset" }
            listings: { type: array, items: { $ref: "#/components/schemas/VenueListing" } }
    IntentAction:
      type: string
      enum: [ACQUIRE_NOTIONAL, REDUCE_NOTIONAL, CLOSE_POSITION, TARGET_EXPOSURE]
    IntentConstraints:
      type: object
      properties:
        max_slippage_bps: { $ref: "#/components/schemas/BPS" }
        max_fee_bps: { $ref: "#/components/schemas/BPS" }
        max_price_impact_bps: { $ref: "#/components/schemas/BPS" }
        min_receive: { $ref: "#/components/schemas/Quantity" }
        allowed_venues: { type: array, items: { type: string } }
        quote_freshness_ms: { type: integer, minimum: 100 }
        execution_deadline: { $ref: "#/components/schemas/Timestamp" }
    QuotePreviewRequest:
      type: object
      required: [account_id, instrument_id, action]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        action: { $ref: "#/components/schemas/IntentAction" }
        notional_usd: { $ref: "#/components/schemas/USD" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        constraints: { $ref: "#/components/schemas/IntentConstraints" }
    QuoteDisclosure:
      type: object
      required: [quote_id, provider, venue, input_asset, input_quantity, output_asset, expected_output, minimum_output, price_impact_bps, slippage_bps, venue_fee, network_fee_estimate, platform_fee, platform_fee_bps, total_estimated_cost_usd, received_at, expires_at, route]
      properties:
        quote_id: { $ref: "#/components/schemas/UUID" }
        provider: { type: string }
        venue: { type: string }
        input_asset: { $ref: "#/components/schemas/UUID" }
        input_quantity: { $ref: "#/components/schemas/Quantity" }
        output_asset: { $ref: "#/components/schemas/UUID" }
        expected_output: { $ref: "#/components/schemas/Quantity" }
        minimum_output: { $ref: "#/components/schemas/Quantity" }
        effective_price: { type: string, description: "decimal string, quote per base" }
        price_impact_bps: { $ref: "#/components/schemas/BPS" }
        slippage_bps: { $ref: "#/components/schemas/BPS" }
        venue_fee: { $ref: "#/components/schemas/Quantity" }
        venue_fee_asset: { $ref: "#/components/schemas/UUID" }
        network_fee_estimate: { $ref: "#/components/schemas/Quantity" }
        network_fee_asset: { $ref: "#/components/schemas/UUID" }
        platform_fee: { $ref: "#/components/schemas/Quantity" }
        platform_fee_bps: { $ref: "#/components/schemas/BPS" }
        fee_policy_version: { type: string }
        total_estimated_cost_usd: { $ref: "#/components/schemas/USD" }
        received_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        route: { type: array, items: { type: object, additionalProperties: true } }
    SubmitIntentRequest:
      type: object
      required: [account_id, instrument_id, action, mode]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        action: { $ref: "#/components/schemas/IntentAction" }
        notional_usd: { $ref: "#/components/schemas/USD" }
        target_exposure_usd: { $ref: "#/components/schemas/USD" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        constraints: { $ref: "#/components/schemas/IntentConstraints" }
        deadline: { $ref: "#/components/schemas/Timestamp" }
        mode: { type: string, enum: [PAPER, LIVE], description: "Manual trades are PAPER until LIVE_MANUAL_TRADING is ACTIVE" }
        quote_id: { $ref: "#/components/schemas/UUID", description: "Preview quote the user saw; the planner re-quotes and validates freshness" }
    TradeIntent:
      type: object
      required: [id, account_id, actor_type, action, instrument_id, status, mode, requested_at, received_at, correlation_id]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        actor_type: { type: string, enum: [USER, AGENT, OPERATOR] }
        agent_id: { $ref: "#/components/schemas/UUID" }
        action: { $ref: "#/components/schemas/IntentAction" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        notional_usd: { $ref: "#/components/schemas/USD" }
        target_exposure_usd: { $ref: "#/components/schemas/USD" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        constraints: { $ref: "#/components/schemas/IntentConstraints" }
        status: { type: string, enum: [RECEIVED, ELIGIBILITY_CHECKED, RISK_CHECKED, RESERVED, PLANNED, EXECUTING, COMPLETED, REJECTED, EXPIRED, CANCELLED, FAILED, NO_VALID_PLAN] }
        rejection_code: { type: string }
        mode: { type: string, enum: [BACKTEST, PAPER, SHADOW, CANARY, LIMITED, LIVE] }
        requested_at: { $ref: "#/components/schemas/Timestamp" }
        received_at: { $ref: "#/components/schemas/Timestamp" }
        deadline: { $ref: "#/components/schemas/Timestamp" }
        terminal_at: { $ref: "#/components/schemas/Timestamp" }
        correlation_id: { type: string }
        order_id: { $ref: "#/components/schemas/UUID" }
        plan_id: { $ref: "#/components/schemas/UUID" }
    TradeIntentPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/TradeIntent" } }
    Decision:
      type: object
      required: [id, decision, policy_version, reason_codes, evaluated_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        decision: { type: string }
        policy_version: { type: string }
        reason_codes: { type: array, items: { type: string } }
        evaluated_at: { $ref: "#/components/schemas/Timestamp" }
    TradeIntentDetail:
      allOf:
        - { $ref: "#/components/schemas/TradeIntent" }
        - type: object
          properties:
            eligibility: { $ref: "#/components/schemas/Decision" }
            risk: { $ref: "#/components/schemas/Decision" }
            reservation: { type: object, additionalProperties: true }
            plan: { type: object, additionalProperties: true }
            order: { $ref: "#/components/schemas/Order" }
            transitions:
              type: array
              items:
                type: object
                required: [from, to, occurred_at]
                properties:
                  from: { type: string }
                  to: { type: string }
                  reason: { type: string }
                  occurred_at: { $ref: "#/components/schemas/Timestamp" }
    Order:
      type: object
      required: [id, intent_id, account_id, instrument_id, side, mode, status, input_asset, input_quantity, output_asset, min_output_quantity, filled_input_quantity, filled_output_quantity, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        intent_id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        instrument_id: { $ref: "#/components/schemas/UUID" }
        side: { type: string, enum: [BUY, SELL] }
        mode: { type: string }
        status: { type: string, enum: [CREATED, VALIDATED, CAPITAL_RESERVED, PLANNED, SUBMITTING, SUBMITTED, ACKNOWLEDGED, PARTIALLY_FILLED, FILLED, SETTLING, SETTLED, REJECTED, EXPIRED, CANCEL_REQUESTED, CANCELLED, SUBMISSION_UNKNOWN, RECONCILIATION_REQUIRED, FAILED_FINAL] }
        input_asset: { $ref: "#/components/schemas/UUID" }
        input_quantity: { $ref: "#/components/schemas/Quantity" }
        output_asset: { $ref: "#/components/schemas/UUID" }
        min_output_quantity: { $ref: "#/components/schemas/Quantity" }
        filled_input_quantity: { $ref: "#/components/schemas/Quantity" }
        filled_output_quantity: { $ref: "#/components/schemas/Quantity" }
        rejection_code: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        terminal_at: { $ref: "#/components/schemas/Timestamp" }
    OrderPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Order" } }
    Fill:
      type: object
      required: [id, venue, external_fill_id, input_quantity, output_quantity, finality, observed_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        venue: { type: string }
        external_fill_id: { type: string }
        tx_signature: { type: string }
        slot: { type: integer }
        input_quantity: { $ref: "#/components/schemas/Quantity" }
        output_quantity: { $ref: "#/components/schemas/Quantity" }
        network_fee_quantity: { $ref: "#/components/schemas/Quantity" }
        venue_fee_quantity: { $ref: "#/components/schemas/Quantity" }
        platform_fee_quantity: { $ref: "#/components/schemas/Quantity" }
        finality: { type: string, enum: [OBSERVED, CONFIRMED, FINALIZED] }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
        journal_transaction_id: { $ref: "#/components/schemas/UUID" }
    OrderDetail:
      allOf:
        - { $ref: "#/components/schemas/Order" }
        - type: object
          properties:
            attempts:
              type: array
              items:
                type: object
                required: [id, attempt_no, status, created_at]
                properties:
                  id: { $ref: "#/components/schemas/UUID" }
                  attempt_no: { type: integer }
                  status: { type: string }
                  finality: { type: string }
                  tx_signature: { type: string }
                  submitted_at: { $ref: "#/components/schemas/Timestamp" }
                  confirmed_at: { $ref: "#/components/schemas/Timestamp" }
                  finalized_at: { $ref: "#/components/schemas/Timestamp" }
                  created_at: { $ref: "#/components/schemas/Timestamp" }
            fills: { type: array, items: { $ref: "#/components/schemas/Fill" } }
    StartDepositRequest:
      type: object
      required: [account_id, fiat_amount, fiat_currency]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        fiat_amount: { type: string, pattern: '^[0-9]+\.[0-9]{2}$' }
        fiat_currency: { type: string, enum: [USD] }
        funding_source_id: { $ref: "#/components/schemas/UUID" }
    Deposit:
      type: object
      required: [id, account_id, provider, status, expected_asset, buying_power_eligible, withdrawal_eligible, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        provider: { type: string }
        provider_session_id: { type: string }
        client_secret_ref: { type: string, description: "Provider client secret for the embedded/hosted onramp UI, returned once at creation" }
        status: { type: string, enum: [CREATED, SESSION_CREATED, CUSTOMER_ACTION_REQUIRED, PROVIDER_PROCESSING, PROVIDER_CONFIRMED, SETTLEMENT_OBSERVED, RECONCILED, AVAILABLE, FAILED, EXPIRED, CANCELLED, REVERSED, REVIEW_REQUIRED] }
        fiat_amount: { type: string }
        fiat_currency: { type: string }
        expected_asset: { $ref: "#/components/schemas/UUID" }
        expected_quantity: { $ref: "#/components/schemas/Quantity" }
        observed_quantity: { $ref: "#/components/schemas/Quantity" }
        tx_signature: { type: string }
        buying_power_eligible: { type: boolean }
        withdrawal_eligible: { type: boolean }
        reversible_until: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        available_at: { $ref: "#/components/schemas/Timestamp" }
    DepositPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Deposit" } }
    DepositDetail:
      allOf:
        - { $ref: "#/components/schemas/Deposit" }
        - type: object
          properties:
            transitions:
              type: array
              items:
                type: object
                required: [from, to, occurred_at]
                properties:
                  from: { type: string }
                  to: { type: string }
                  reason: { type: string }
                  occurred_at: { $ref: "#/components/schemas/Timestamp" }
            journal_transaction_id: { $ref: "#/components/schemas/UUID" }
    WithdrawalRequest:
      type: object
      required: [account_id, asset_id, quantity, destination_address]
      properties:
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        destination_address: { type: string }
    Withdrawal:
      type: object
      required: [id, account_id, asset_id, quantity, destination_address, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        destination_address: { type: string }
        status: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    StreamEvent:
      type: object
      required: [id, type, occurred_at]
      properties:
        id: { type: string, description: "cursor; monotonically increasing per connection" }
        type: { type: string, enum: [buying_power.changed, order.transitioned, intent.transitioned, deposit.transitioned, agent.state, resync] }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        resource_id: { type: string }
        data: { type: object, additionalProperties: true }
    Capability:
      type: string
      enum: [LIVE_FUNDING, LIVE_MANUAL_TRADING, LIVE_AGENT_TRADING, WITHDRAWALS, SOCIAL_DATA_PERSISTENCE, MARKETPLACE, CROSS_CHAIN, PREDICTION_MARKETS, SECURITIES, CEX_TRADING]
    CapabilityGate:
      type: object
      required: [capability, environment, state, approval_version, active]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        environment: { type: string }
        state: { type: string, enum: [DISABLED, PENDING_APPROVAL, APPROVED, ACTIVE, SUSPENDED, REVOKED, EXPIRED, SANDBOX] }
        active: { type: boolean, description: "Result of the five-condition activation check, not just the row state" }
        sandbox: { type: boolean, description: "True when active came from a SANDBOX row on a sandbox tier rather than from dual control. Show the word; an active sandbox gate is not an approval." }
        inactive_reason: { type: string }
        approval_version: { type: integer }
        legal_review_ref: { type: string }
        provider_contract_ref: { type: string }
        risk_approval_ref: { type: string }
        security_approval_ref: { type: string }
        approvers: { type: array, items: { type: object, additionalProperties: true } }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    GateActionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 8 }
        legal_review_ref: { type: string }
        provider_contract_ref: { type: string }
        risk_approval_ref: { type: string }
        security_approval_ref: { type: string }
        evidence_hashes: { type: array, items: { type: string } }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        note: { type: string }
    KillSwitch:
      type: object
      required: [kind, scope_id, active, severity]
      properties:
        kind: { type: string, enum: [GLOBAL_NEW_RISK_KILL, ACCOUNT_FREEZE, AGENT_PAUSE, STRATEGY_VERSION_DISABLE, VENUE_DISABLE, INSTRUMENT_CLOSE_ONLY, INSTRUMENT_HALT, CHAIN_DISABLE_NEW_ACTIONS, PROVIDER_DISABLE_NEW_ACTIONS, FUNDING_DISABLE, WITHDRAWALS_DISABLE, MODEL_DISABLE] }
        scope_id: { type: string }
        active: { type: boolean }
        severity: { type: string, enum: [STANDARD, SEVERE] }
        reason: { type: string }
        activated_at: { $ref: "#/components/schemas/Timestamp" }
        released_at: { $ref: "#/components/schemas/Timestamp" }
    KillSwitchRequest:
      type: object
      required: [kind, action, reason]
      properties:
        kind: { type: string }
        scope_id: { type: string, default: "*" }
        action: { type: string, enum: [activate, release] }
        reason: { type: string, minLength: 8 }
        approval_id: { $ref: "#/components/schemas/UUID", description: "Required to release a SEVERE switch" }
    AdminActionProposal:
      type: object
      required: [kind, target_type, target_id, reason]
      properties:
        kind: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        params: { type: object, additionalProperties: true }
        reason: { type: string, minLength: 8 }
    AdminAction:
      type: object
      required: [id, kind, target_type, target_id, status, requires_dual, proposed_by, proposed_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        params: { type: object, additionalProperties: true }
        params_hash: { type: string }
        reason: { type: string }
        requires_dual: { type: boolean }
        status: { type: string, enum: [PROPOSED, APPROVED, REJECTED, EXECUTED, FAILED, EXPIRED, CANCELLED] }
        proposed_by: { $ref: "#/components/schemas/UUID" }
        proposed_at: { $ref: "#/components/schemas/Timestamp" }
        approved_by: { $ref: "#/components/schemas/UUID" }
        approved_at: { $ref: "#/components/schemas/Timestamp" }
        executed_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    AdminActionPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AdminAction" } }
    ReconciliationRecord:
      type: object
      required: [id, kind, mode, scope_type, scope_id, status, material, blocks_new_risk, opened_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind: { type: string, enum: [EXECUTION, WALLET_BALANCE, FUNDING, LEDGER_INTERNAL, POSITION_LEDGER, SUBMISSION_UNKNOWN] }
        mode: { type: string, enum: [EVENT_DRIVEN, PERIODIC, FULL] }
        scope_type: { type: string }
        scope_id: { type: string }
        account_id: { $ref: "#/components/schemas/UUID" }
        asset_id: { $ref: "#/components/schemas/UUID" }
        expected: { type: object, additionalProperties: true }
        observed: { type: object, additionalProperties: true }
        difference: { type: object, additionalProperties: true }
        status: { type: string, enum: [OPEN, MATCHED, MISMATCH, INVESTIGATING, RESOLVED_AUTOMATIC, RESOLVED_MANUAL, ESCALATED] }
        material: { type: boolean }
        blocks_new_risk: { type: boolean }
        opened_at: { $ref: "#/components/schemas/Timestamp" }
        resolved_at: { $ref: "#/components/schemas/Timestamp" }
        resolution_reason: { type: string }
        resolution_evidence_ref: { type: string }
        compensating_journal_transaction_id: { $ref: "#/components/schemas/UUID" }
    ReconciliationRecordPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/ReconciliationRecord" } }
    ReconciliationResolution:
      type: object
      required: [reason, evidence_ref]
      properties:
        reason: { type: string, minLength: 8 }
        evidence_ref: { type: string }
        approval_id: { $ref: "#/components/schemas/UUID" }
        compensation:
          type: object
          description: Reason-coded compensating posting; never a balance edit
          properties:
            reason_code: { type: string }
            entries:
              type: array
              items:
                type: object
                required: [account_code, asset, side, quantity]
                properties:
                  account_code: { type: string }
                  asset: { $ref: "#/components/schemas/UUID" }
                  side: { type: string, enum: [DEBIT, CREDIT] }
                  quantity: { $ref: "#/components/schemas/Quantity" }
    StatusChange:
      type: object
      required: [to, reason]
      properties:
        to: { type: string }
        reason: { type: string, minLength: 8 }
        policy_version: { type: string }
    ProviderStatus:
      type: object
      required: [name, role, health, verification]
      properties:
        name: { type: string }
        role: { type: string }
        health: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, DISABLED] }
        verification: { type: string, enum: [CODE_COMPLETE, CONTRACT_TESTED, SANDBOX_VERIFIED, CANARY_VERIFIED, LIVE_VERIFIED, BLOCKED_EXTERNAL] }
        mode: { type: string, enum: [fake, sandbox, live] }
        error_rate_bps: { type: integer }
        p95_ms: { type: integer }
        last_success_at: { $ref: "#/components/schemas/Timestamp" }
        disable_reason: { type: string }
    # ---- profile, terms and account lifecycle ----
    UserProfile:
      type: object
      required: [user_id, locale, time_zone, avatar_seed, created_at]
      description: >-
        Product-level state only. It carries no e-mail address, phone number,
        legal name or date of birth: those are sealed in identity_pii and this
        surface has no route to them.
      properties:
        user_id: { $ref: "#/components/schemas/UUID" }
        display_name: { type: string, maxLength: 64 }
        handle: { type: string, pattern: "^[a-z][a-z0-9_]{2,29}$" }
        locale: { type: string, pattern: "^[a-z]{2}(-[A-Z]{2})?$" }
        time_zone: { type: string, maxLength: 64 }
        avatar_seed:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Sixteen hex characters a client renders an identicon from. Nodal accepts no avatar upload.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ProfileUpdate:
      type: object
      description: Only the fields present are changed. An empty handle clears it.
      properties:
        display_name: { type: string, maxLength: 64 }
        handle: { type: string, maxLength: 30 }
        locale: { type: string, maxLength: 5 }
        time_zone: { type: string, maxLength: 64 }
    Onboarding:
      type: object
      required: [started_at, complete, steps]
      description: >-
        Timestamps, not a state machine. The steps are independent, may be done
        in any order, and cannot be undone (D-053).
      properties:
        started_at: { $ref: "#/components/schemas/Timestamp" }
        complete: { type: boolean }
        completed_at: { $ref: "#/components/schemas/Timestamp" }
        next_step: { type: string, enum: [PROFILE, TERMS] }
        steps:
          type: array
          items:
            type: object
            required: [key, complete]
            properties:
              key: { type: string, enum: [PROFILE, TERMS] }
              complete: { type: boolean }
              completed_at: { $ref: "#/components/schemas/Timestamp" }
    LegalDocument:
      type: object
      required: [document_id, version, title, content_hash, requirement, counsel_review_required, accepted]
      properties:
        document_id:
          type: string
          enum: [TERMS_OF_SERVICE, PRIVACY_POLICY, RISK_DISCLOSURE, CREDITS_TERMS, WITHDRAWAL_DISCLOSURE]
        version: { type: string }
        title: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        requirement:
          type: string
          enum: [ONBOARDING, WITHDRAWAL]
          description: When acceptance is required. A WITHDRAWAL document is not asked for at signup.
        counsel_review_required:
          type: boolean
          description: >-
            The document has not been reviewed by a lawyer. Every document
            currently served is marked, and a surface must say so rather than
            presenting a draft as settled.
        body:
          type: string
          description: >-
            The document text, as Markdown, so a client renders exactly what it
            records acceptance of.
        accepted: { type: boolean }
        accepted_at: { $ref: "#/components/schemas/Timestamp" }
    TermsState:
      type: object
      required: [documents, outstanding]
      properties:
        documents: { type: array, items: { $ref: "#/components/schemas/LegalDocument" } }
        outstanding:
          type: array
          description: Documents required at onboarding whose current bytes the caller has not accepted.
          items: { type: string }
        acceptances: { type: array, items: { $ref: "#/components/schemas/TermsAcceptance" } }
    TermsAcceptance:
      type: object
      required: [id, document_id, version, content_hash, accepted_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        document_id: { type: string }
        version: { type: string }
        content_hash: { type: string }
        accepted_at: { $ref: "#/components/schemas/Timestamp" }
    TermsAcceptanceRequest:
      type: object
      required: [document_ids]
      properties:
        document_ids:
          type: array
          minItems: 1
          items:
            type: string
            enum: [TERMS_OF_SERVICE, PRIVACY_POLICY, RISK_DISCLOSURE, CREDITS_TERMS, WITHDRAWAL_DISCLOSURE]
    AccountRestriction:
      type: object
      required: [code, message]
      description: >-
        A restriction, written for the person it applies to. The free text an
        operator wrote on a status change is deliberately not here: it was
        written for other operators and appears in the support view instead.
      properties:
        code:
          type: string
          enum: [USER_SUSPENDED, USER_CLOSED, ACCOUNT_RESTRICTED, ACCOUNT_FROZEN, ACCOUNT_CLOSED, CLOSURE_PENDING]
        account_id: { $ref: "#/components/schemas/UUID" }
        message: { type: string }
    ClosureRequest:
      type: object
      required: [id, state, requested_at, cooling_off_until]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        state: { type: string, enum: [PENDING, CANCELLED, REFUSED, EFFECTED] }
        requested_at: { $ref: "#/components/schemas/Timestamp" }
        cooling_off_until: { $ref: "#/components/schemas/Timestamp" }
        effectable:
          type: boolean
          description: The cooling-off period has passed and an operator may now effect the request.
        decided_at: { $ref: "#/components/schemas/Timestamp" }
        decided_reason: { type: string }
    MyAccount:
      type: object
      required: [user_id, user_status, accounts, restrictions, cooling_off_days]
      properties:
        user_id: { $ref: "#/components/schemas/UUID" }
        user_status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }
        restrictions: { type: array, items: { $ref: "#/components/schemas/AccountRestriction" } }
        closure_request: { $ref: "#/components/schemas/ClosureRequest" }
        cooling_off_days:
          type: integer
          description: How long a new closure request would wait before it could be effected.
    CloseAccountRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: Optional. A person leaving does not owe an explanation.
    SecuritySummary:
      type: object
      required: [active_sessions, mfa_present, amr, step_up_max_age_seconds]
      description: >-
        Derived from the session store and the claims of the current session.
        Nothing here is a secret and nothing here is created by asking.
      properties:
        active_sessions: { type: integer }
        mfa_present:
          type: boolean
          description: The identity provider asserted a strong authentication method for the current session.
        amr: { type: array, items: { type: string } }
        last_login_at: { $ref: "#/components/schemas/Timestamp" }
        last_step_up_at: { $ref: "#/components/schemas/Timestamp" }
        step_up_valid_until: { $ref: "#/components/schemas/Timestamp" }
        step_up_max_age_seconds: { type: integer }
        current_session_id: { $ref: "#/components/schemas/UUID" }
    AdminUserView:
      type: object
      required: [user_id, user_status, idp_issuer, idp_subject, email_verified, created_at, accounts, restrictions, active_sessions, audit_stream, verification]
      description: >-
        Read only. There is no field here an operator can write, and the only
        mutation the support surface offers is deciding a closure request the
        user themselves opened (PART 38).
      properties:
        user_id: { $ref: "#/components/schemas/UUID" }
        user_status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        idp_issuer: { type: string }
        idp_subject: { type: string }
        email_verified:
          type: boolean
          description: >-
            The identity provider asserted a verified address. The address
            itself is sealed and is not reachable from here.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        profile: { $ref: "#/components/schemas/UserProfile" }
        onboarding: { $ref: "#/components/schemas/Onboarding" }
        accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }
        restrictions: { type: array, items: { $ref: "#/components/schemas/AccountRestriction" } }
        closure_request: { $ref: "#/components/schemas/ClosureRequest" }
        acceptances: { type: array, items: { $ref: "#/components/schemas/TermsAcceptance" } }
        active_sessions: { type: integer }
        audit_stream:
          type: string
          description: >-
            Where this user history is recorded, so the support view points at
            the evidence rather than restating it.
        verification:
          type: object
          required: [known]
          description: >-
            The verification level Nodal has established. known is false when
            this deployment wired no resolver, which is reported as not known
            here and never as NONE.
          properties:
            known: { type: boolean }
            level: { type: string }
    ClosureDecision:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [CANCEL, REFUSE, EFFECT] }
        reason: { type: string, minLength: 8 }
