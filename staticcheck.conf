# staticcheck configuration.
#
# ST1000 (package comment) is off: doc.go carries the package contract in this
# repo and staticcheck's preferred phrasing fights it.
#
# ST1003 (naming) and ST1005 (error string capitalisation) are off because
# every finding they produce here is in code that cannot be changed at the site
# of the complaint:
#
#   - All 11 ST1005 findings are in internal/gen/api/api.gen.go, which carries
#     a "DO NOT EDIT" header. A generated file's style is the generator's
#     business; editing it would be reverted by the next `make openapi-server`
#     and the drift check would fail.
#   - The ST1003 findings are dominated by internal/httpapi methods whose names
#     are DICTATED by the generated StrictServerInterface — GetIntentsIntentId,
#     DeleteSessionsSessionId and so on. Renaming them does not compile. The
#     remainder are the deliberate domain spelling IdP (identity provider),
#     which staticcheck would have as IDP.
#
# Correctness checks (the SA series) remain fully enabled here, and
# golangci-lint runs staticcheck as well with its own per-path exclusions. The
# defect this replaces was a `make staticcheck` target that had never passed:
# it disagreed with the golangci-lint configuration the same repository ships,
# so `make lint` was red for reasons no one could act on. A check that cannot
# be satisfied is a check people learn to skip.
checks = ["all", "-ST1000", "-ST1003", "-ST1005"]
