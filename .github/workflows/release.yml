# Release supply chain (PART 104, 143): immutable images tagged with the git SHA,
# scanned before publishing, pushed to GHCR, signed keylessly with cosign via
# GitHub OIDC, with an SBOM attestation and SLSA build provenance. No static
# cloud credentials: the ECR variant below uses an OIDC role (EB-016).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  # Default registry. For ECR, see the commented block in the build job.
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-scan-push-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing / attestation via OIDC
    outputs:
      images: ${{ steps.manifest.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release gate below needs history
      # Deployment control (PART 143): only a commit that is already on the
      # default branch may become a release. A tag pushed from a side branch
      # would otherwise produce signed, attested images of code that never
      # passed ci.yml, since tag pushes do not trigger it.
      - name: Refuse to release a commit that is not on the default branch
        run: |
          set -euo pipefail
          base="origin/${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/$base" >/dev/null 2>&1 || true
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$base"; then
            echo "::error::$GITHUB_SHA is not an ancestor of $base; release only from the default branch"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool/main.go') }}
      - name: Install pinned scanners
        run: go run ./scripts/tool install -only trivy,syft
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Amazon ECR via GitHub OIDC (no static keys, PART 99/143) ------------
      # Active as soon as the repository variables AWS_RELEASE_ROLE_ARN (the
      # `deploy_role_arn` output of infra/terraform) and AWS_REGION exist; until
      # then the release goes only to GHCR and these three steps are skipped.
      # The ECR repositories are cp-<env>/<binary> with IMMUTABLE tags, so a
      # second push of the same SHA fails rather than silently replacing a
      # signed image. There are no static AWS keys anywhere in this workflow.
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_RELEASE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        if: vars.AWS_RELEASE_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2
      - name: Target ECR instead of GHCR
        if: vars.AWS_RELEASE_ROLE_ARN != ''
        run: echo "IMAGE_PREFIX=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_NAMESPACE || 'cp-prod' }}" >> "$GITHUB_ENV"
      # ------------------------------------------------------------------------

      - name: Build images (immutable, tagged with the git SHA)
        run: go run ./scripts/images -tag "$GITHUB_SHA" -registry "$IMAGE_PREFIX" -platform linux/amd64 -pull

      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Every cmd/<name> produced an image
        # scripts/images discovers cmd/ itself, so a new binary is picked up
        # without editing this file; this assertion is what makes that safe to
        # rely on when the count changes.
        run: |
          set -euo pipefail
          built="$(jq -r '.[].cmd' dist/images.json | sort | tr '\n' ' ')"
          found="$(for d in cmd/*/; do n="${d#cmd/}"; n="${n%/}"; ls "$d"*.go >/dev/null 2>&1 && echo "$n"; done | sort | tr '\n' ' ')"
          echo "built:  $built"
          echo "cmd/:   $found"
          [ "$built" = "$found" ] || { echo "::error::image set does not match cmd/"; exit 1; }

      - name: Scan images before publishing (trivy, fail on HIGH/CRITICAL)
        run: |
          set -euo pipefail
          # .ref is "<image>:<tag>" and is what was actually built; before the
          # push step .digest is empty, so this is the only correct reference.
          for ref in $(jq -r '.[].ref' dist/images.json); do
            go run ./scripts/tool trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$ref"
          done

      - name: Push images and record digests
        # Rebuild is a cache hit; dist/images.json + dist/images.txt now carry image@sha256 refs.
        run: go run ./scripts/images -tag "$GITHUB_SHA" -registry "$IMAGE_PREFIX" -platform linux/amd64 -push

      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign images (keyless, GitHub OIDC)
        run: |
          set -euo pipefail
          while read -r ref; do
            cosign sign --yes "$ref"
          done < dist/images.txt

      - name: SBOM per image (syft) and attestation (cosign)
        run: |
          set -euo pipefail
          mkdir -p dist/sbom
          while read -r ref; do
            name="$(basename "${ref%%@*}")"
            go run ./scripts/tool syft "$ref" -o "spdx-json=dist/sbom/${name}.spdx.json"
            cosign attest --yes --type spdxjson --predicate "dist/sbom/${name}.spdx.json" "$ref"
          done < dist/images.txt

      - id: manifest
        run: echo "images=$(jq -c . dist/images.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: |
            dist/images.json
            dist/images.txt
            dist/sbom/
          if-no-files-found: error

  # SLSA build provenance for each pushed image, stored in the registry alongside
  # the cosign signature ("generate provenance where practical", PART 104).
  provenance:
    needs: build-scan-push-sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.build-scan-push-sign.outputs.images) }}
    steps:
      - uses: docker/login-action@v4
        if: vars.AWS_RELEASE_ROLE_ARN == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The attestation is pushed to whichever registry holds the image, so this
      # job needs the same credentials the build job used.
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_RELEASE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        if: vars.AWS_RELEASE_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ matrix.image.image }}
          subject-digest: ${{ matrix.image.digest }}
          push-to-registry: true
