# CI for the Universal Financial Control Plane (PART 104, 142, 212–216).
# Every check that developers can run locally is invoked through the same `make`
# targets; tool versions come from scripts/tool/main.go (one pinned table).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local # the toolchain from go.mod, never an auto-downloaded one

jobs:
  # Probes for optional parts of the monorepo (web app, generated clients) so
  # their jobs are skipped cleanly until those parts exist. hashFiles() cannot be
  # used in a job-level `if` (it runs before checkout), hence this tiny job.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.probe.outputs.web }}
      webe2e: ${{ steps.probe.outputs.webe2e }}
      client: ${{ steps.probe.outputs.client }}
      sqlc: ${{ steps.probe.outputs.sqlc }}
      proto: ${{ steps.probe.outputs.proto }}
      openapi: ${{ steps.probe.outputs.openapi }}
      property: ${{ steps.probe.outputs.property }}
      e2e: ${{ steps.probe.outputs.e2e }}
      chaos: ${{ steps.probe.outputs.chaos }}
      load: ${{ steps.probe.outputs.load }}
    steps:
      - uses: actions/checkout@v7
      - id: probe
        # A Go package pattern whose directory does not exist is a hard error,
        # not an empty run ("pattern ./test/property/...: directory not found",
        # exit 1), so every optional suite is probed before its target is
        # invoked. test/e2e, test/chaos and apps/web are being written now.
        run: |
          web=false; webe2e=false; client=false; sqlc=false; proto=false; openapi=false
          property=false; e2e=false; chaos=false; load=false
          [ -f apps/web/package.json ] && web=true
          { [ -f apps/web/playwright.config.ts ] || [ -f apps/web/playwright.config.js ]; } && webe2e=true
          [ -f packages/generated-client/package.json ] && client=true
          { [ -f sqlc.yaml ] || [ -f sqlc.yml ] || [ -f sqlc.json ]; } && sqlc=true
          [ -f proto/buf.gen.yaml ] && proto=true
          [ -f openapi/oapi-codegen.yaml ] && openapi=true
          [ -d test/property ] && property=true
          [ -d test/e2e ] && e2e=true
          [ -d test/chaos ] && chaos=true
          [ -d test/load ] && load=true
          {
            echo "web=$web"
            echo "webe2e=$webe2e"
            echo "client=$client"
            echo "sqlc=$sqlc"
            echo "proto=$proto"
            echo "openapi=$openapi"
            echo "property=$property"
            echo "e2e=$e2e"
            echo "chaos=$chaos"
            echo "load=$load"
          } >> "$GITHUB_OUTPUT"

  go:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool/main.go') }}
      - name: Install pinned tools
        run: go run ./scripts/tool install -only gofumpt,staticcheck,govulncheck,gosec,golangci-lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: make vet
      - name: Format check
        # `gofumpt -l` exits 0 even when it lists files, so the check is on its output
        # (see the note on `make fmt-check` in the tooling report).
        run: |
          dirs=""
          for d in ./cmd ./internal ./scripts ./test ./packages; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          out="$(go run ./scripts/tool gofumpt -l $dirs)"
          if [ -n "$out" ]; then
            echo "::error::unformatted Go files (run: make fmt)"
            echo "$out"
            exit 1
          fi
      - name: staticcheck
        run: make staticcheck
      - name: golangci-lint
        run: go run ./scripts/tool golangci-lint run ./...
      - name: Financial invariants (lintfin)
        run: go run ./scripts/lintfin
      - name: Unit tests
        run: make unit
      - name: Property tests
        # `make property` also names ./test/property/..., which does not exist
        # yet; the in-package Prop/Property tests still run either way.
        run: |
          if [ "${{ needs.detect.outputs.property }}" = "true" ]; then
            make property
          else
            echo "::notice::test/property does not exist yet; running the in-package property tests only"
            go test -count=1 -timeout=20m -run 'Prop|Property' ./internal/...
          fi
      - name: Race detector (critical packages)
        run: make race
      - name: govulncheck
        run: make vuln
      - name: gosec
        run: make sast

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz every target briefly
        run: make fuzz FUZZTIME=10s

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Provider contract tests (recorded fixtures)
        run: make contract

  # The dev host is Windows; scripts must behave identically everywhere (D-013).
  scripts-crossplatform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./scripts/...
      - run: go test -count=1 -short ./scripts/...
      - run: go run ./scripts/tool list
      - run: go run ./scripts/maketargets Makefile
      - run: go run ./scripts/fuzzall -list

  # The migration suite applies from empty, verifies checksums and rolls back to
  # the ledger-protected version. It owns the schema for the length of its run,
  # so it gets its own runner and its own database: sharing a `go test`
  # invocation with other integration packages would let them run concurrently
  # (go test parallelises across packages) against a schema being torn down.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CP_TEST_DATABASE_URL: postgres://cp_app:cp_app_local@127.0.0.1:5433/controlplane_test?sslmode=disable
      CP_TEST_MIGRATE_DATABASE_URL: postgres://cp_migrate:cp_migrate_local@127.0.0.1:5433/controlplane_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start Postgres (docker compose, same as `make infra-up`)
        run: docker compose up -d --wait postgres
      - name: Migration tests
        run: make migrate-test
      - name: Postgres logs
        if: failure()
        run: docker compose logs postgres
      - name: Stop infra
        if: always()
        run: docker compose down -v

  integration:
    runs-on: ubuntu-latest
    # 45 was sized for a job that started Postgres alone. It now brings up six
    # services and runs five more packages, so a timeout here would be a false
    # failure rather than a signal.
    timeout-minutes: 60
    env:
      # Same DSNs as docker-compose / CONVENTIONS.md; the compose file publishes 5433.
      CP_TEST_DATABASE_URL: postgres://cp_app:cp_app_local@127.0.0.1:5433/controlplane_test?sslmode=disable
      CP_TEST_MIGRATE_DATABASE_URL: postgres://cp_migrate:cp_migrate_local@127.0.0.1:5433/controlplane_test?sslmode=disable
      # The addresses of the services `make infra-up` starts. Without these,
      # internal/reality (ClickHouse), internal/reality/redpandabus (Redpanda),
      # internal/archive (MinIO), internal/workflows (Temporal) and
      # internal/ratelimit (Redis) were enumerated by the loop below, invoked,
      # and skipped -- five subsystems reporting a pass having run nothing,
      # while fifteen VERIFIED rows in REQUIREMENTS_TRACEABILITY.md cited those
      # tests as their evidence (F-57).
      CP_TEST_CLICKHOUSE_ADDR: 127.0.0.1:19000
      CP_TEST_REDPANDA_BROKERS: 127.0.0.1:19092
      CP_TEST_ARCHIVE_ENDPOINT: http://127.0.0.1:9100
      CP_TEST_REDIS_URL: redis://127.0.0.1:6380
      # Temporal reads CP_TEMPORAL_HOSTPORT and already defaults to the compose
      # port, so it needs no entry here; the health check is what gates it, and
      # deps.Unavailable turns a failed one into a failure in this job.
      # The promise. internal/testkit/deps turns every external-dependency skip
      # into a failure when this is set, so a service that fails to start is a
      # red job rather than a fast green one. It is deliberately not set in the
      # unit job, which never claimed to have any of this.
      CP_TEST_REQUIRE_EXTERNAL_DEPS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # GitHub `services:` cannot bind-mount docker/postgres/init/001_roles.sql and
      # cannot pass the server flags compose sets (wal_level, pg_stat_statements,
      # which the init script requires). Starting the compose services instead
      # runs the identical images, flags, roles and databases developers use
      # locally. This used to start postgres alone; see the env block above.
      - name: Start the local stack (docker compose, same as `make infra-up`)
        run: make infra-up
      - name: Integration tests (migration suite excluded, see the migrations job)
        # `make integration` is ./test/integration/..., which still includes the
        # migration suite; until that target takes a package list, the exclusion
        # lives here. Keep the two in step if the Makefile gains an override.
        #
        # Each package gets its OWN database. Running them together against one
        # shared database does not work and never did: internal/event TRUNCATEs
        # outbox_events and inbox_messages while other suites assert on global
        # row counts, so a single invocation fails in packages that are
        # individually correct. Per-package databases are also what
        # CONVENTIONS.md tells developers to do locally, so this makes CI run
        # the same way rather than a way that only CI uses.
        run: |
          set -euo pipefail
          # ./test/integration/... contains ONLY the migration suite, so after
          # excluding it this list was EMPTY and the job passed in under a
          # tenth of a second while proving nothing. The database-backed proof
          # of the financial core -- ledger, capital, settlement, execution,
          # reconciliation, signing -- lives in *_test.go files behind
          # //go:build integration inside internal/ and cmd/: 40 packages that
          # no CI job ran. They are enumerated from the build tag itself, so a
          # new one is picked up without editing this file.
          {
            grep -rl '^//go:build integration' --include='*_test.go' internal cmd |
              sed 's|/[^/]*$||' | sort -u | sed 's|^|./|'
            go list -tags=integration ./test/integration/... | grep -v '/test/integration/migrations$' || true
          } | sort -u > /tmp/intpkgs.txt
          count="$(wc -l < /tmp/intpkgs.txt)"
          if [ "$count" -lt 2 ]; then
            echo "::error::found only $count integration packages; the enumeration is broken, not the tree"
            exit 1
          fi
          echo "integration packages: $count"

          fails=0
          while read -r pkg; do
            name="ci_$(echo "$pkg" | tr '/.-' '___' | tail -c 40)"
            echo "::group::$pkg (database controlplane_test_$name)"
            eval "$(go run ./scripts/testdb -name "$name" -export)"
            if ! go test -count=1 -timeout=30m -tags=integration "$pkg"; then
              fails=$((fails+1))
            fi
            echo "::endgroup::"
          done < /tmp/intpkgs.txt
          exit "$fails"
      - name: Prove nothing skipped for a missing dependency
        # The positive control for the env block above. `deps` fails rather than
        # skips in this job, so a skip here can only come from a test that opted
        # out for its own reasons -- but a count of zero external-dependency
        # skips is the thing worth asserting, and asserting it is what stops the
        # variables being quietly dropped again.
        run: |
          set -euo pipefail
          for pkg in ./internal/reality ./internal/reality/redpandabus ./internal/archive ./internal/workflows ./internal/ratelimit; do
            eval "$(go run ./scripts/testdb -name "ci_dep_$(echo "$pkg" | tr '/.-' '___' | tail -c 24)" -export)"
            out="$(go test -count=1 -timeout=15m -tags=integration -v "$pkg" 2>&1 || true)"
            if echo "$out" | grep -q 'not set; skipping\|is unreachable'; then
              echo "::error::$pkg skipped for a missing dependency in a job that promised one"
              echo "$out" | grep 'not set; skipping\|is unreachable'
              exit 1
            fi
            echo "$pkg: no dependency skips"
          done
      - name: Race detector over the financial core, WITH the integration tag
        # `make race` runs the same packages without -tags=integration, so it
        # only ever raced the in-memory tests. Every database-backed
        # concurrency property in this system — the capital reservation lock,
        # the ledger's balanced-per-asset triggers, settlement's resumable
        # executor, the outbox claim under SKIP LOCKED — had never been run
        # under the race detector at all. Those are exactly the paths where a
        # race costs money.
        run: |
          set -euo pipefail
          fails=0
          for pkg in ./internal/capital/... ./internal/ledger/... ./internal/execution/...                      ./internal/reconciliation/... ./internal/event/... ./internal/settlement/...                      ./internal/signing/... \
                     ./internal/credit/... ./internal/nativemarket/... ./internal/payout/... ./internal/commerce/...; do
            name="race_$(echo "$pkg" | tr '/.-' '___' | tail -c 30)"
            echo "::group::race $pkg"
            eval "$(go run ./scripts/testdb -name "$name" -export)"
            if ! go test -count=1 -race -timeout=30m -tags=integration "$pkg"; then
              fails=$((fails+1))
            fi
            echo "::endgroup::"
          done
          exit "$fails"
      - name: Security tests
        # The security suite refuses the shared controlplane_test by design
        # (TestHarness_RefusesTheSharedDatabase) — a suite that plants forged
        # sessions and injection probes must never be able to touch a database
        # anything else is using. Give it its own, exactly as its own error
        # message instructs.
        run: |
          set -euo pipefail
          eval "$(go run ./scripts/testdb -name ci_security -export)"
          go test -count=1 -timeout=30m -tags=integration ./test/security/
      - name: Backup/restore drill (pg_dump → pg_restore → verify → ledger consistency)
        run: make restore-drill
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restore-drill-${{ github.sha }}
          path: dist/restore-drill.json
          if-no-files-found: ignore
      - name: Postgres logs
        if: failure()
        run: docker compose logs postgres
      - name: Stop infra
        if: always()
        run: docker compose down -v

  security-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Organisation repositories need a license: set the GITLEAKS_LICENSE secret.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool/main.go') }}
      - name: Install pinned scanners
        run: go run ./scripts/tool install -only trivy,syft
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Dependency vulnerability scan (trivy fs)
        run: go run ./scripts/tool trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln,misconfig .
      - name: IaC scan (trivy config infra/)
        run: make iac-scan
      - name: SBOM (syft)
        run: |
          mkdir -p dist
          make sbom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: dist/sbom.spdx.json
          if-no-files-found: error

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend dependency audit
        run: pnpm audit --audit-level=high
      - run: make lint-web
      - run: make typecheck-web
      - run: make test-web
      - run: make build-web

  openapi-drift:
    needs: detect
    if: needs.detect.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the TypeScript client schema
        run: make openapi-client
      - name: Typecheck and test the client
        run: |
          pnpm --filter @controlplane/generated-client typecheck
          pnpm --filter @controlplane/generated-client test
      - name: Fail if the generated client is stale
        run: git diff --exit-code -- packages/generated-client

  generated-code-drift:
    needs: detect
    if: needs.detect.outputs.sqlc == 'true' || needs.detect.outputs.proto == 'true' || needs.detect.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool/main.go') }}
      - run: go run ./scripts/tool install -only sqlc,buf,oapi-codegen,protoc-gen-go,protoc-gen-go-grpc
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: needs.detect.outputs.sqlc == 'true'
        run: make sqlc
      - if: needs.detect.outputs.proto == 'true'
        run: make proto
      - if: needs.detect.outputs.openapi == 'true'
        run: make openapi-server
      - name: Fail if generated code is stale
        run: git diff --exit-code

  # Every workspace package that is not apps/web: the generated client and the
  # strategy SDK both ship lint/typecheck/test scripts and had no job — and
  # neither did the operator console, whose filter said "not apps/web" and read
  # `./packages/*`. Nothing in CI had ever compiled apps/admin, run its money,
  # decision-vector or source-scan tests, or built it.
  workspace-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck and test packages/*
        # A recursive filtered run skips a package that does not define the
        # script, so a new package without tests does not break the job.
        run: |
          pnpm --filter "./packages/*" run lint
          pnpm --filter "./packages/*" run typecheck
          pnpm --filter "./packages/*" run test
      - name: Lint, typecheck, test and build the operator console
        # The build is part of the gate, not a convenience: it verifies that
        # dist/generated matches src/generated, so a console that would render a
        # stale authority model fails here rather than in a browser.
        run: |
          pnpm --filter @controlplane/admin run lint
          pnpm --filter @controlplane/admin run typecheck
          pnpm --filter @controlplane/admin run test
          pnpm --filter @controlplane/admin run build

  # Playwright critical-path UI tests. apps/web owns the Playwright config,
  # including whether it starts the app itself through `webServer`; this job
  # only installs the browsers and runs `make e2e-web`.
  web-e2e:
    needs: detect
    if: needs.detect.outputs.webe2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @controlplane/web exec playwright install --with-deps chromium
      - name: Start Postgres (the app under test needs a database)
        run: docker compose up -d --wait postgres
      # playwright.config.ts starts the WEB app itself through `webServer`, but
      # nothing starts the API it talks to (CP_WEB_API_TARGET, default
      # 127.0.0.1:18099). The suite signs in through the dev identity provider
      # and reads real balances, so without a migrated, seeded API every spec
      # fails on the first navigation. See test/load/README.md for the same
      # setup done by hand.
      - name: Migrate, seed and start the API under test
        env:
          CP_ENV: LOCAL
          CP_AUTH_MODE: dev
          CP_HTTP_ADDR: 127.0.0.1:18099
        run: |
          set -euo pipefail
          # The DSNs come from testdb itself rather than being written out by
          # hand: it names the database controlplane_test_<name>, and an earlier
          # version of this step hardcoded controlplane_e2e without the prefix,
          # so seeding failed with `database "controlplane_e2e" does not exist`.
          # Deriving them removes the chance of the two disagreeing again.
          eval "$(go run ./scripts/testdb -name web_e2e -export)"
          export CP_DATABASE_APP_URL="$CP_TEST_DATABASE_URL"
          export CP_DATABASE_MIGRATE_URL="$CP_TEST_MIGRATE_DATABASE_URL"
          go run ./scripts/seed
          # The internal economy: a Credit asset, Credits for the dev
          # customers, a seller and a catalogue. Without it /marketplace has
          # nothing to buy and the purchase spec has nothing to exercise.
          go run ./scripts/seedeconomy
          # The GLOBAL risk policy. Domain A trades are evaluated against it and
          # fail closed without one, so a deployment that skips this step has a
          # marketplace but no internal market. The compiled-in default is what
          # a fresh development deployment gets; riskpolicy refuses to write it
          # outside LOCAL/DEV/TEST.
          go run ./scripts/riskpolicy -operator ci-operator -reason "continuous integration: the compiled-in development limits"
          # MARKETPLACE, through the REAL three-principal ceremony rather than
          # by writing an ACTIVE row. gateceremony drives gates.Admin, so the
          # state machine, the permission split, the step-up and all four
          # evidence references apply, and it refuses any environment but
          # LOCAL/DEV/TEST and any non-local database host.
          #
          # Without it the purchase spec takes its refusal branch: that branch
          # asserts the refusal names the capability and that no Credits moved,
          # so CI would still be testing something -- but it would not be
          # testing that a customer can buy anything, which is the point.
          go run ./scripts/gateceremony -capability MARKETPLACE             -proposer ci-proposer -approver ci-approver -activator ci-activator             -legal "CI-NOT-A-LEGAL-REVIEW" -contract "CI-NO-PROVIDER-CONTRACT"             -risk "CI-NOT-A-RISK-APPROVAL" -security "CI-NOT-A-SECURITY-REVIEW"             -reason "continuous integration: exercise the committed purchase path"
          # Settlement asset: buying power and holdings answer 422 UNSUPPORTED
          # without it, and the specs assert real figures.
          db="${CP_TEST_DATABASE_URL##*/}"; db="${db%%\?*}"
          asset="$(docker compose exec -T postgres psql -U cp_migrate -d "$db" -tAc             "SELECT chain||' '||mint_address FROM assets WHERE symbol='USDC' LIMIT 1")"
          test -n "$asset" || { echo "::error::no USDC asset in $db after seeding"; exit 1; }
          {
            echo "CP_DATABASE_APP_URL=$CP_DATABASE_APP_URL"
            echo "CP_DATABASE_MIGRATE_URL=$CP_DATABASE_MIGRATE_URL"
            echo "CP_API_SETTLEMENT_CHAIN=${asset% *}"
            echo "CP_API_SETTLEMENT_MINT=${asset#* }"
          } >> "$GITHUB_ENV"
          go build -o bin/api ./cmd/api
          CP_API_SETTLEMENT_CHAIN="${asset% *}" CP_API_SETTLEMENT_MINT="${asset#* }"             CP_API_LEGAL_POLICY=DEVELOPMENT             CP_API_ENABLED_CAPABILITIES=MARKETPLACE             CP_API_RATE_LIMIT_GENERAL=6000/1m CP_API_RATE_LIMIT_AUTH=600/1m CP_API_RATE_LIMIT_COMMAND=1200/1m CP_API_RATE_LIMIT_QUOTE=1200/1m             ./bin/api > api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -m 2 http://127.0.0.1:18099/v1/healthz >/dev/null; then
              echo "api up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the API under test never became healthy"; cat api.log; exit 1
      - run: make e2e-web
      - name: API log
        if: failure()
        run: cat api.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
      - name: Stop infra
        if: always()
        run: docker compose down -v

  # API-level end-to-end tests (Go, build tags integration,e2e).
  e2e:
    needs: detect
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No CP_TEST_DATABASE_URL here on purpose: test/e2e refuses the shared
    # controlplane_test for the same reason the chaos and security suites do —
    # it drives the real API binary end to end and must own its data. It gets
    # its own below.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start local infra
        run: make infra-up
      - name: Provision an isolated database for the e2e suite
        run: |
          set -euo pipefail
          eval "$(go run ./scripts/testdb -name ci_e2e -export)"
          {
            echo "CP_TEST_DATABASE_URL=$CP_TEST_DATABASE_URL"
            echo "CP_TEST_MIGRATE_DATABASE_URL=$CP_TEST_MIGRATE_DATABASE_URL"
          } >> "$GITHUB_ENV"
      - run: make e2e
      - name: Infra logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop infra
        if: always()
        run: docker compose down -v

  # Fault injection. Chaos tests kill and partition the local infrastructure,
  # so they get their own runner and never share it with another suite.
  chaos:
    needs: detect
    if: needs.detect.outputs.chaos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No CP_TEST_DATABASE_URL here on purpose: the chaos suite refuses the
    # shared controlplane_test by design, because it pauses containers and
    # kills processes mid-transaction and must never do that to a database
    # another suite is using. It gets its own below.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start local infra
        run: make infra-up
      - name: Provision an isolated database for the chaos suite
        run: |
          set -euo pipefail
          eval "$(go run ./scripts/testdb -name ci_chaos -export)"
          {
            echo "CP_TEST_DATABASE_URL=$CP_TEST_DATABASE_URL"
            echo "CP_TEST_MIGRATE_DATABASE_URL=$CP_TEST_MIGRATE_DATABASE_URL"
            # Without these two, broker_stall_test and archive_refused_test
            # t.Skip() silently and the job finishes in under half a second
            # while reporting success. The broker-stall test is the one that
            # found D-034, where a stalled broker made publishing look
            # successful — precisely the case that must not go unexercised.
            echo "CP_TEST_REDPANDA_BROKERS=127.0.0.1:19092"
            echo "CP_TEST_ARCHIVE_ENDPOINT=http://127.0.0.1:9100"
          } >> "$GITHUB_ENV"
      - run: make chaos
      - name: Infra logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop infra
        if: always()
        run: docker compose down -v

  # k6 scripts are parsed and their options validated on every change. Running
  # them needs a deployed target with a session (test/load/README.md), so CI
  # checks that they are valid, not that a service met a threshold.
  load-scripts:
    needs: detect
    if: needs.detect.outputs.load == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool/main.go') }}
      - name: Install k6
        run: go run ./scripts/tool install -only k6
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make load-inspect

  # One required check to point branch protection at, so a job that is skipped
  # because its directory does not exist yet cannot be mistaken for a pass, and
  # a job that fails cannot be merged past.
  ci:
    if: always()
    needs:
      - go
      - fuzz
      - contract
      - scripts-crossplatform
      - migrations
      - integration
      - security-scans
      - workspace-packages
      - web
      - web-e2e
      - e2e
      - chaos
      - load-scripts
      - openapi-drift
      - generated-code-drift
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed, was cancelled, or was skipped when it should not be
        env:
          RESULTS: ${{ toJSON(needs) }}
          # Skipping is legitimate only for the suites whose directory does not
          # exist yet (web, web-e2e, e2e, chaos, load-scripts, the drift jobs).
          REQUIRED: go fuzz contract scripts-crossplatform migrations integration security-scans workspace-packages
        run: |
          set -euo pipefail
          echo "$RESULTS"
          fail=0
          if printf '%s' "$RESULTS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one job failed or was cancelled"
            fail=1
          fi
          for job in $REQUIRED; do
            if ! printf '%s' "$RESULTS" | tr -d ' \n' | grep -q "\"$job\":{\"result\":\"success\""; then
              echo "::error::required job $job did not succeed"
              fail=1
            fi
          done
          exit "$fail"
